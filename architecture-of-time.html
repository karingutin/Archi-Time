     the box; each markup function draws its control under the text instead */
  const H=PANEL_H;
  /* what is actually left for the control once the words have taken theirs —
     the pinned case can be tighter than `ctrl` asked for */
  const room=H - (Q_INSET + lines*Q_LH + hintH + Q_GAP + Q_INSET);
  return {w, h:H, titleLines:lines, hintLines:hlines, room:Math.max(0.5, room)};
}

/* How far the words reach from the panel top, in cells — so a control can hang
   at a FIXED Figma size just under the hint rather than being fitted to the room
   the panel leaves (which silently rescaled the wheel and the month grid). */
function textBottomCells(q){
  const ps=panelSize(q);
  return Q_INSET + ps.titleLines*Q_LH + (ps.hintLines ? Q_HGAP + ps.hintLines*Q_HLH : 0);
}
/* The gap between the words and the control, per question, from Figma (px/36.68).
   shape and density keep the landing screens' own measure — 26px on that
   drawing's 45px cell (node 2879:6431) — since their controls came over intact.
   month tightened from 18 to 6 (Karin, 16 Aug): the ring grid's raw content
   measured 10.25 cells (see panelHeightCells) — just past the whole-cell
   ceiling, rounding the panel up to 11 and hanging Next a whole cell lower
   than it needed to. Trimming this one gap brings the raw height to ~9.93,
   which ceils to 10 instead — the panel comes back to a square-ish 9x10, the
   grid sits a bit higher under the hint, and Next follows it up by exactly
   one cell (its top is panel.top + panel.height — see renderSnake). */
const CTRL_GAP={ month:6/36.68, alarms:5/36.68, vacations:23/36.68, febdays:15/36.68,
                 shape:26/45, density:26/45 };
const ctrlGap=id=>CTRL_GAP[id]!==undefined ? CTRL_GAP[id] : Q_GAP;

/* THE PANEL'S INSIDES, as markup. Extracted so the run's reach can be MEASURED
   from exactly what renderSnake will draw — two copies of this would drift and
   the drift would show up as a run that sits a row off. */
function panelInner(q,c,PH,PW){
  return '<div class="qflow" style="padding:'+(Q_INSET*c).toFixed(1)+'px 0">'
    + '<h2 style="margin:0 '+(Q_INSET*c).toFixed(1)+'px;'
    +          'font-size:'+(Q_FS*c).toFixed(1)+'px;line-height:'+(Q_LH*c).toFixed(1)+'px">'
    + esc(val(q.title,derive())) + '</h2>'
    + (val(q.hint,derive())
        ? '<p class="qhint" style="margin:'+(Q_HGAP*c).toFixed(1)+'px '+(Q_INSET*c).toFixed(1)+'px 0;'
          + 'font-size:'+(Q_HFS*c).toFixed(1)+'px;line-height:'+(Q_HLH*c).toFixed(1)+'px">'
          + esc(val(q.hint,derive())) + '</p>'
        : '')
    + panelControl(q,c,PH,PW)
    + '</div>';
}

/* HOW FAR THE RUN REALLY REACHES, in rows below the FIRST marker.

   Panels hug their content and are then snapped up to whole cells, so the old
   reserve — a worst-case SNAKE.spanH under the LAST question — was wrong twice
   over: too generous for the short questions and, since the tallest panel is
   eleven cells rather than the declared ten, not generous enough for the month.
   Being too generous is what showed: the band could not honour SNAKE.top's
   three-cell drop, so the whole run rode up against the top edge and started
   two cells higher than the composition asks for.

   Measured instead. Each question's foot is its own marker's row, plus the
   panel hanging one row below it, plus Next one row below that; the run's reach
   is the deepest of those. Heights come off a detached probe built from
   panelInner, cached per question per cell size — a resize re-measures, a
   repaint does not. */
let panelHCache={key:null, rows:0, h:{}};
function panelHeightCells(q,c){
  if(panelHCache.h[q.id]!=null) return panelHCache.h[q.id];
  const PS=panelSize(q);
  const probe=document.createElement('div');
  probe.style.cssText='position:absolute;visibility:hidden;left:-9999px;top:0';
  probe.innerHTML='<div class="qpanel" style="width:'+(PS.w*c).toFixed(1)+'px;height:auto">'
                + panelInner(q,c,PS.h,PS.w) + '</div>';
  document.body.appendChild(probe);
  const h=Math.max(1, Math.ceil(probe.firstChild.offsetHeight/c - 0.01));
  probe.remove();
  panelHCache.h[q.id]=h;
  return h;
}
function snakeReach(){
  const c=cellSize(), key=c.toFixed(2)+'|'+ASKED.map(q=>q.id).join(',');
  if(panelHCache.key===key) return panelHCache.rows;
  panelHCache={key, rows:0, h:{}};
  let deepest=SNAKE.spanH;
  ASKED.forEach((q,n)=>{ deepest=Math.max(deepest, n + 1 + panelHeightCells(q,c) + 1); });
  panelHCache.rows=deepest;
  return deepest;
}

function snakeParts(i,j,sx,sy){
  const PH=snakeParts.h||6, PW=snakeParts.w||SNAKE.panel.w;
  const put=(o)=>({
    c: sx>0 ? i+o.dx : i-o.dx-(o.w-1),
    r: sy>0 ? j+o.dy : j-o.dy-(o.h-1),
    w:o.w, h:o.h
  });
  return {
    step:{c:i, r:j, w:1, h:1},
    total:put(SNAKE.total),
    panel:put({...SNAKE.panel, w:PW, h:PH}),
    /* Save hangs off the panel's lower-right corner, so its row follows the
       panel's height rather than being a constant */
    save:put({...SNAKE.save, dx:SNAKE.panel.dx+PW, dy:1+PH})
  };
}

/* Does every part sit inside the viewport and clear of the union? */
function snakeFits(P,B){
  const U=unionBox(), uH=Math.ceil(MAXR/2+1)+SNAKE.air;
  for(const k of ['step','total','panel','save']){
    const r=P[k];
    if(r.c<B.iMin || r.c+r.w>B.halfW) return false;
    if(r.r<B.jMin || r.r+r.h>B.halfH) return false;
    /* clear of the union: entirely left of it, right of it, above or below */
    const clearX = (r.c+r.w<=U.cl) || (r.c>=U.cr);
    const clearY = (r.r+r.h<=-uH) || (r.r>=uH);
    if(!clearX && !clearY) return false;
  }
  return true;
}

/* The figure for question n: its marker, and the first opening direction that
   fits. Down-right is the mock and is always tried first. */
function snakeFigure(n){
  const B=snakeBand(), m=snakeCell(n);
  /* the panel's REAL height, not panelSize's nominal PANEL_H(10) — the same
     fix snakeReach needed. Using the nominal here starved the last questions:
     a 7-cell panel (saying, colorway) was checked as if it were 10, pushed
     Next three rows past B.jMax that were never actually needed, and both
     fell to the anchored fallback despite fitting for real. snakeParts still
     wants a WIDTH (panelSize's w is fine, unaffected by hugging). */
  const q=ASKED[n];
  const PS = q ? {w:panelSize(q).w, h:panelHeightCells(q,cellSize())} : {w:SNAKE.panel.w, h:6};
  snakeParts.h=PS.h; snakeParts.w=PS.w;
  for(const [sx,sy] of [[1,1],[1,-1],[-1,1],[-1,-1]]){
    const P=snakeParts(m.i,m.j,sx,sy);
    if(snakeFits(P,B)) return {...P, sx, sy, i:m.i, j:m.j, fitted:true};
  }
  /* NO DIRECTION FITS, and with a horizontal snake that is the normal case
     rather than the edge one: the run is 9 columns, the figure is 11, and the
     clear band beside the poster is 13 — so the two cannot both hang off the
     same column once the markers have marched right.

     Rather than let the fallback drop the panel on the poster, the panel and
     Save anchor to the snake's OWN START, under the first marker, where 11
     columns always fit. The step and total stay on the live marker.

     This BREAKS the corner rule for the panel — it no longer touches the marker
     it belongs to — and that is a real loss which wants a decision, not a
     default. Flagged rather than hidden. */
  const anchored=snakeParts(B.iMin, B.jMin+2, 1, 1);
  return {step:{c:m.i, r:m.j, w:1, h:1},
          total:snakeParts(m.i,m.j,1,1).total,
          panel:anchored.panel, save:anchored.save,
          sx:1, sy:1, i:m.i, j:m.j, fitted:false, anchored:true};
}

/* cells -> pixels, against the same origin and cell every other layer uses */
function cellBox(r){
  const o=gridOrigin(), c=cellSize();
  return {left:o.x+r.c*c, top:o.y+r.r*c, w:r.w*c, h:r.h*c};
}
const cssBox=b=>'left:'+b.left.toFixed(1)+'px;top:'+b.top.toFixed(1)+'px;'
              + 'width:'+b.w.toFixed(1)+'px;height:'+b.h.toFixed(1)+'px';

/* ---------- draw the dots ---------- */
function renderDots(){
  const vw=window.innerWidth, vh=window.innerHeight, cell=cellSize();
  const o=gridOrigin();
  const at=d=>({x:o.x+d.i*cell, y:o.y+d.j*cell});
  const wrap=inner=>'<svg viewBox="0 0 '+vw+' '+vh+'" preserveAspectRatio="none">'+inner+'</svg>';
  const c=card.classList.contains('open') ? cardBox : null;
  const buried=(p,r,qid)=>c && qid!==pinnedQ &&
    p.x>c.left-r && p.x<c.right+r && p.y>c.top-r && p.y<c.bottom+r;

  /* the decorative layer is deliberately empty — the starfield is gone (see
     computeDots). The element stays because the question dots are z-indexed
     against it, and because emptying it is one assignment rather than a
     rework of the stack. */
  dotsDeco.innerHTML='';

  /* EVERY open question pulses, not just the first of them. During the linear
     lead that is one dot; at the fork it is both of the questions you may
     answer, which is what makes the choice visible — a single pulse there would
     read as an instruction rather than an option. */
  const avail=availableQs();
  const marks=DOTS.filter(d=>d.qid).map(d=>{
    const H=hierarchy(d.qid,cell), p=at(d);
    if(buried(p,H.r,d.qid)) return '';
    const q=BANK[d.qid];
    const open=d.qid===pinnedQ;
    const next=avail.includes(d.qid) && !open;
    const locked=!canOpen(d.qid);
    const cx=p.x.toFixed(1), cy=p.y.toFixed(1);
    const n=ASKED.findIndex(x=>x.id===d.qid)+1;
    let g='<g class="qdot'+(open?' is-open':'')+(locked?' locked':'')+'" data-qid="'+d.qid+'"'
        + (locked?'':' tabindex="0" role="button"')
        + ' aria-label="'+pad2(n)+' of '+pad2(ASKED.length)+'. '
        + (q?q.title.replace(/"/g,''):d.qid)
        + (H.passed?' (skipped)':H.done?' (answered)':
           locked?' (locked, answer earlier questions first)':'')+'">';
    if(next) g+='<circle class="pulse" cx="'+cx+'" cy="'+cy+'" r="'+(H.r+2).toFixed(1)+'"/>';
    if(open) g+='<circle class="halo" cx="'+cx+'" cy="'+cy+'" r="'+(H.r+7).toFixed(1)+'"/>';
    /* generous target when shut — and never smaller than half a cell, so a
       receded dot stays as easy to hit as a near one; shrunk while its card is
       open, so it cannot swallow clicks meant for the controls beside it */
    g+='<circle class="hit" cx="'+cx+'" cy="'+cy+'"'
      + ' r="'+(open?H.r+2:Math.max(H.r+13, cell*0.5)).toFixed(1)+'"/>';
    if(!locked) g+='<circle class="hover" cx="'+cx+'" cy="'+cy+'" r="'+(H.r+5).toFixed(1)+'"/>';
    /* a broken ring for skipped: same weight as answered, but visibly not the
       same thing. The dash is derived from the radius so it stays four even
       gaps at any size. */
    const dash=H.passed
      ? ' stroke-dasharray="'+(H.r*0.9).toFixed(1)+' '+(H.r*0.62).toFixed(1)+'"' : '';
    const state=H.fill?' filled':H.passed?' passed':' done';
    g+='<circle class="core'+state+'" cx="'+cx+'" cy="'+cy+'"'
      + ' r="'+H.r.toFixed(1)+'" opacity="'+H.op.toFixed(2)+'"'+dash+'/>';
    return g+'</g>';
  }).join('');

  /* The question dots are gone too, and with them the guide line and the start
     cue that pointed at them: the snake states the sequence and the position in
     it, so a second notation for the same thing was noise. `marks` is still
     built above because hierarchy() is what decides a question's state and that
     is worth keeping in one place — it is simply no longer drawn here. */
  void marks;
  dotsInt.innerHTML='';
  renderSnake();
}

/* =====================================================================
   THE WHEEL — the number question's control.

   A circle LARGER than the panel, centred below it, so what shows is the top
   cap of it: measured off the mock at radius 2.31 cells with its centre 0.79
   cells below the panel's lower edge, which is what puts the ±70° of arc on
   screen and no more. At 28° per step that is exactly five values — the one you
   have chosen and two either side, which is what the mock draws.

   It WRAPS. The mock shows 12 to the left of 01 with 02 selected, so the values
   run as a ring rather than a bar with two ends: turning past the first value
   arrives at the last. On a clock of alarms that is the truth of the thing.

   The chosen value is always at the top. You do not move a marker along a
   scale — you turn the scale until what you mean is at the top, which is why
   the number is set above the arc rather than beside a handle.
   ===================================================================== */
/* The wheel is a FIXED SIZE now. It used to be a fraction of the panel's
   height, which was fine while every panel was the same height and wrong the
   moment they were not: a short question would have got a small wheel and a
   long one a big one, for no reason a reader could see.

   So the radius is the constant, and the panel only decides where the centre
   goes. cy = panelHeight + 0.342 * r is not a taste number: 0.342 is cos(70
   degrees), so the panel's lower edge cuts the circle at exactly +-70 degrees
   whatever its height — which is what keeps five values on screen and no more.
   Every other measure is the mock's, divided by the mock's own radius. */
/* DERIVED, not chosen. The arc's widest point is where the panel's lower edge
   cuts it, at +-70 degrees, so its visible half-width is r*sin(70). Setting that
   equal to half the panel minus the hug makes the arc's ends land on exactly the
   same line as the title's first and last letters — the panel's one inset, obeyed
   by the wheel as well.

   Change Q_INSET or the panel's width and the wheel follows on its own. */
/* THE DIAL — reproduced from Figma node 2753:4337, NOT fitted to the panel.
   A FULL circle of a FIXED radius, hung so the active value sits at 12 o'clock
   just under the hint and the circle's lower part is CLIPPED by the panel edge.
   Every measure is the mock's own, over its 300px content:
     radius 122.3/300 = 0.4077 of the content; label ring 135.99/122.3 = 1.112 of
     the radius; active dot 11.139px and tick 6.188px as fractions of the radius;
     labels 14px; three numbers each side of the active one (seven on screen). */
const DIAL_R=0.4077*(PANEL_W.number-2*Q_INSET);   // 3.334 cells at width 9
const DIAL_LR=1.112;                               // label ring, as a multiple of r
const DIAL_SIDES=5;                                // numbers each side (±3 show; the
                                                  // extra ±2 are the clipped margin
                                                  // the spin turns through)
const DIAL_GAP=5/36.68;                            // Figma gap text->control, in cells
const DIAL={
  step:27,                              // degrees per value (mock ~0, 32, 55, 80)
  dragPerStep:0.62,                     // cells of pointer travel per value
  r:DIAL_R,
  labelR:DIAL_R*DIAL_LR,
  dotR:DIAL_R*0.0455,                   // active dot: 11.139/2 over 122.3
  tickR:DIAL_R*0.0253,                  // inactive tick: 6.188/2 over 122.3
  innerRatio:0.62,                      // a second concentric ring inside the arc
  labelCells:0.382,                     // labels 14px = 14/36.68 cells
  cx:PANEL_W.number/2                   // the panel's horizontal centre
};
/* The dial is clipped, not fitted, so this only needs to be large enough that the
   number question's own arithmetic never shrinks its pinned panel. */
const DIAL_CELLS=DIAL_R;
const dialSteps=()=>DIAL_SIDES;

/* the ring of values for a number question, wrapping at both ends */
function dialRing(q){
  const D=derive();
  const min=val(q.min,D), max=val(q.max,D);
  const n=max-min+1, cur=Math.max(min,Math.min(max,Math.round(ans(q.id))));
  return {min, max, n, cur, at:k=>min+(((cur-min+k)%n)+n)%n};
}

function dialMarkup(q,c,PH,W){
  const R=dialRing(q);
  const rC=DIAL_R;                                  // FIXED radius, from Figma
  const ts=DIAL.labelCells*c;                       // labels 14px
  /* how far the words reach, so the circle hangs just under the hint. The circle
     then runs well past the panel foot and the panel (overflow:hidden) clips it. */
  const ps=panelSize(q);
  const textB=Q_INSET + ps.titleLines*Q_LH + (ps.hintLines?Q_HGAP+ps.hintLines*Q_HLH:0);
  const labelR=rC*DIAL_LR;
  const cx=(W/2)*c, cy=(textB + DIAL_GAP + DIAL.labelCells/2 + labelR)*c;
  const r=rC*c, lr=labelR*c;
  const pt=(rad,deg)=>{const a=(deg-90)*Math.PI/180;
    return [cx+rad*Math.cos(a), cy+rad*Math.sin(a)];};
  /* a flow child, cropped to the wheel's TOP HALF: the viewBox runs from the
     twelve-o'clock value down to the horizontal diameter (cy), so the lower
     half is clipped by the svg's own viewport — no panel foot needed for it */
  const vbY=(textB+DIAL_GAP)*c, vbH=cy-vbY;
  let s='<svg class="dial" viewBox="0 '+vbY.toFixed(1)+' '+(W*c).toFixed(1)+' '+vbH.toFixed(1)+'"'
      + ' style="margin-top:'+(DIAL_GAP*c).toFixed(1)+'px"'
      + ' tabindex="0" role="slider" aria-label="'+esc(q.title)+'"'
      + ' aria-valuemin="'+R.min+'" aria-valuemax="'+R.max+'" aria-valuenow="'+R.cur+'"><g class="cbody">';
  /* the FULL circle outline — the panel clips its lower part, exactly as the mock */
  s+='<circle class="dial-arc" cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'"'
    + ' r="'+r.toFixed(1)+'" fill="none" stroke-width="'+Math.max(1,c*0.02).toFixed(2)+'"/>';
  /* a second concentric ring inside the arc (see reference) */
  s+='<circle class="dial-arc" cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'"'
    + ' r="'+(r*DIAL.innerRatio).toFixed(1)+'" fill="none" stroke-width="'+Math.max(1,c*0.02).toFixed(2)+'"/>';
  /* The selection sits at twelve o'clock, but the dot is no longer a separate
     fixed mark: every number carries its OWN circle inside the spinning ring.
     As the ring turns the circle nearing the top grows to the strong colour and
     the one leaving shrinks + fades back to the idle grey (see spinDial). At rest
     the k=0 circle is the big one, so a static first paint already reads right. */
  const K=DIAL_SIDES;
  s+='<g class="dial-ring" data-cx="'+cx.toFixed(1)+'" data-cy="'+cy.toFixed(1)+'"'
    + ' data-step="'+DIAL.step+'" data-rmin="'+(DIAL.tickR*c).toFixed(2)+'"'
    + ' data-rmax="'+(DIAL.dotR*c).toFixed(2)+'">';
  for(let k=-K;k<=K;k++){
    const deg=k*DIAL.step, [lx,ly]=pt(lr,deg), lab=pad2(R.at(k)), [tx,ty]=pt(r,deg);
    const on=(k===0);
    /* the circle beneath the number; spinDial tweens its r + fill as it turns */
    s+='<circle class="'+(on?'dial-dot':'dial-tick')+'" data-deg="'+deg.toFixed(2)+'"'
      + ' cx="'+tx.toFixed(1)+'" cy="'+ty.toFixed(1)+'"'
      + ' r="'+((on?DIAL.dotR:DIAL.tickR)*c).toFixed(1)+'"/>';
    if(on){
      s+='<text class="dial-val" x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'"'
        + ' dominant-baseline="central" font-size="'+ts.toFixed(1)+'">'+lab+'</text>';
      continue;
    }
    /* rotated to the tangent, so the ring of numbers reads as a dial face */
    s+='<text class="dial-lab" x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'"'
      + ' text-anchor="middle" dominant-baseline="central"'
      + ' font-size="'+ts.toFixed(1)+'"'
      + ' transform="rotate('+deg.toFixed(1)+' '+lx.toFixed(1)+' '+ly.toFixed(1)+')">'+lab+'</text>';
    /* generous invisible tap target so a click anywhere on the number selects it,
       not just a dead-centre hit (neighbours are ~1.75 cells apart, so 0.6 is safe) */
    s+='<circle class="dial-hit" data-step="'+k+'" cx="'+lx.toFixed(1)+'" cy="'+ly.toFixed(1)+'"'
      + ' r="'+(c*0.6).toFixed(1)+'"/>';
  }
  s+='</g>';
  return s+'</g></svg>';
}

/* Turn the wheel by `k` values, wrapping, and repaint. `noSpin` is for dragging,
   where the numbers already follow the finger and a per-step spin would fight it. */
function dialTurn(qid,k,noSpin){
  const q=BANK[qid]; if(!q) return;
  const R=dialRing(q);
  S.answers[qid]=R.at(k); S.touched[qid]=true;
  if(q.onPick) q.onPick(); else draw();
  renderSnake();
  if(!noSpin) spinDial(k);
}
/* THE CLOCK TURNS, it does not cut. After the wheel repaints with the new value
   at the top, the ring of numbers is spun into place from k steps away — the
   answer rotates up to twelve o'clock like a camera-mode dial. On a timer
   (requestAnimationFrame), never a CSS animation, so a backgrounded tab cannot
   freeze it mid-turn; reduced-motion skips straight to rest. From now on every
   "clock" control turns this way. */
let dialSpinRAF=0;
/* a colour string ('#abc', '#aabbcc' or 'rgb(...)') to an [r,g,b] triple, so the
   circle's fill can be mixed between the idle grey and the strong colour */
function dialRGB(v){ v=(v||'').trim(); let m;
  if(m=v.match(/^#([0-9a-f]{3})$/i)) return [0,1,2].map(i=>parseInt(m[1][i]+m[1][i],16));
  if(m=v.match(/^#([0-9a-f]{6})$/i)) return [0,2,4].map(i=>parseInt(m[1].substr(i,2),16));
  if(m=v.match(/rgba?\(([^)]+)\)/i)) return m[1].split(',').slice(0,3).map(x=>parseFloat(x));
  return null;
}
const dialMix=(a,b,t)=>'rgb('+a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(',')+')';
function spinDial(k){
  cancelAnimationFrame(dialSpinRAF);
  const ring=qsys.querySelector('.dial-ring'); if(!ring) return;
  const cx=+ring.dataset.cx, cy=+ring.dataset.cy;
  const step=+ring.dataset.step, rmin=+ring.dataset.rmin, rmax=+ring.dataset.rmax;
  const dots=ring.querySelectorAll('.dial-dot,.dial-tick');
  const cs=getComputedStyle(ring);
  const cIdle=dialRGB(cs.getPropertyValue('--q-past')),
        cOn=dialRGB(cs.getPropertyValue('--q-text'));
  /* At any ring rotation, size + fill each circle by how near its number is to the
     top: 1 at twelve o'clock, 0 a full step away. The circle arriving grows to the
     strong colour, the one leaving shrinks + brightens back to grey — this is the
     whole of the "both move" behaviour, and at deg=0 it lands exactly at rest. */
  const paint=deg=>{
    dots.forEach(el=>{
      const d=((+el.dataset.deg+deg)%360+540)%360-180;   // signed angle to top
      const a=Math.max(0,1-Math.abs(d)/step);
      el.setAttribute('r',(rmin+(rmax-rmin)*a).toFixed(2));
      if(cIdle&&cOn) el.setAttribute('fill',dialMix(cIdle,cOn,a));
    });
  };
  if(!k){ paint(0); return; }
  if(reduceMotion && reduceMotion()){ ring.setAttribute('transform','rotate(0 '+cx+' '+cy+')'); paint(0); return; }
  const from=k*step;                            // start k steps away, settle at 0
  /* easeOutBack: overshoots the top by a few degrees then settles, so the arriving
     circle grows past, dips, and springs back to full — the requested springy pop. */
  const c1=2.2, back=t=>1+(c1+1)*Math.pow(t-1,3)+c1*Math.pow(t-1,2);
  const dur=440, t0=performance.now();
  ring.setAttribute('transform','rotate('+from.toFixed(2)+' '+cx+' '+cy+')');
  paint(from);
  dialSpinRAF=requestAnimationFrame(function frame(now){
    let t=(now-t0)/dur; if(t>1) t=1;
    const deg=from*(1-back(t));
    ring.setAttribute('transform','rotate('+deg.toFixed(2)+' '+cx+' '+cy+')');
    paint(deg);
    if(t<1) dialSpinRAF=requestAnimationFrame(frame);
    else { ring.setAttribute('transform','rotate(0 '+cx+' '+cy+')'); paint(0); }
  });
}

/* =====================================================================
   THE HORIZON — one straight line, used for the decades question (10..100 years).

   It was a radial gauge, and the round shape was the wrong metaphor twice over:
   the question asks how much RUNWAY is left, and the answer draws a band of
   rectangles along the foot of the sheet that grows one column per decade (see
   barLayer). Nothing about either is circular. A line that runs left to right,
   inked behind the handle and a hairline ahead of it, says the same thing the
   poster layer says.

   The stops are laid across the FULL track — idx 0 on the left hug, idx n-1 on
   the right — rather than the gauge's (idx+1)/n fill fraction. That spends the
   whole width on the ten answers, so a stop is 0.9 of a cell wide instead of
   0.82, and the handle's travel reads as the whole horizon rather than as a
   quantity poured into a container.

   THERE IS NO LINE. The horizon is drawn as ten DOTS, one per decade, and a disc
   that glides along them: the dots behind the disc are inked, the ones ahead are
   hollow. Which is the same alphabet the board is already written in — the grid
   under everything is a dot field, and the answer circles of the other questions
   are the same mark at another size. A drawn track and a row of ticks was a
   slider borrowed from an operating system; this is the piece's own furniture.

   The disc is NOT one of the dots. It floats between them while the finger is
   down and lands on one when it is released, which is what lets the drag stay
   continuous — a control made only of ten states can only ever hop.

   Geometry, in cells, bottom-hugged by the same Q_INSET as every other control.
   The row is inset by one handle radius at each end, so what lands on the hug is
   the DISC's outer edge at the extremes — it is the biggest mark in the control
   and it is the silhouette the eye reads as the margin.
   ===================================================================== */
const BAR={
  fat:0.34,                 // the bar at ten years: short and thick
  thin:0.15,                // the bar at a hundred: long and drawn out
  valCells:0.66,            // the value, riding above the end of the bar
  unitCells:0.30,           // its unit, set small beside it
  valGap:0.26,              // bar top -> the value's baseline box
  rubber:0.05               // how far past either end the pull may stretch
};
/* HOW THICK THE BAR IS AT A GIVEN LENGTH.
   The whole answer to "it does not feel interactive" is in this one line. A
   control that only changes POSITION under the hand reads as dead, because
   nothing about it is being acted upon — the mark just relocates. A control
   that changes SHAPE reads as material: the hand is doing something to it.

   So the bar conserves its bulk. Pulled out it thins, let back it thickens, and
   at rest at ten years it is a short fat lozenge while at a hundred it is a long
   drawn wire. That also happens to say the right thing about the question: the
   further ahead you expect to see, the thinner the thing you are spreading over
   it. Past either end the pull thins it further still, on top of the rubber
   band, so the resistance is visible as well as felt. */
function barThick(p,fat,thin){
  const inside=Math.max(0,Math.min(1,p));
  let t=fat+(thin-fat)*inside;
  const over=p<0 ? -p : p>1 ? p-1 : 0;
  if(over) t*=Math.max(0.55, 1-over/BAR.rubber*0.45);
  return t;
}
/* WHERE THE HANDLE IS, as 0..1 across the track.
   Two sources: while a drag or a settle is running, barLive holds a CONTINUOUS
   position that does not sit on a stop — that is the whole point, the handle
   follows the finger rather than hopping. Otherwise it is derived from the
   answer. Keeping the live value on a module global rather than on the element
   is what lets the panel be rebuilt mid-drag (barTurn re-renders on every stop
   the finger crosses, so the poster's brick band grows as you pull) without the
   handle snapping back to the stop under it. */
let barLive=null;                                  // {qid, p} or null
let barRAF=0;
const barPosOf=(q,R)=> (barLive && barLive.qid===q.id)
  ? barLive.p : (R.n>1 ? R.idx/(R.n-1) : 0);
/* Past either end the drag keeps moving, but less and less — it asymptotes at
   BAR.rubber instead of stopping dead against the bound. A hard stop reads as
   the control being broken; a band reads as the end of the scale. */
function barRubber(p){
  const k=BAR.rubber;
  if(p<0) return -k*(1-1/(1+(-p)/k));
  if(p>1) return 1+k*(1-1/(1+(p-1)/k));
  return p;
}
/* the stops of a gauge question: {min,max,step,n,cur,idx,at,frac} */
function barRing(q){
  const D=derive();
  const min=val(q.min,D), max=val(q.max,D), step=q.step||1;
  const n=Math.round((max-min)/step)+1;
  const raw=ans(q.id);
  /* a saved answer that is not a number reads as UNANSWERED rather than being
     carried through the arithmetic — Math.round(NaN) is NaN and every clamp
     below it passes NaN along, so without this the corruption is permanent */
  const idx=(raw==null || !Number.isFinite(+raw)) ? 0
          : Math.max(0,Math.min(n-1,Math.round((raw-min)/step)));
  return {min,max,step,n,idx,cur:min+idx*step, frac:(idx+1)/n,
          at:i=>min+Math.max(0,Math.min(n-1,i))*step};
}
function barMarkup(q,c,PH,W){
  const R=barRing(q);
  const p=barPosOf(q,R);
  const fat=BAR.fat*c, thin=BAR.thin*c;
  /* the run, inset by half the FATTEST it can be, so the round cap's edge lands
     on the hug at the short end where the bar is thickest */
  const x0=Q_INSET*c+fat/2, x1=(W-Q_INSET)*c-fat/2;
  /* under the text at the question's Figma gap — value first, then the run;
     the 10-cell card's slack sits below the bar, not between it and the words */
  const valFs=BAR.valCells*c, unitFs=BAR.unitCells*c;
  const baseY=(textBottomCells(q)+ctrlGap(q.id)+BAR.valCells)*c;
  const y=baseY+BAR.valGap*c+fat/2;
  const x=x0+(x1-x0)*p;                            // NOT clamped: the rubber band shows
  const th=barThick(p,fat,thin);
  const unit=String(q.unit||'');
  /* the value rides the handle, so it has to be stopped from walking off the
     panel — an estimate of the run's width is enough, it only ever bites in the
     last stop at either end, and it is deliberately a touch GENEROUS so the
     clamp bites a hair early rather than a hair late */
  const vw=String(R.cur).length*0.60*valFs + 0.28*unitFs + unit.length*0.55*unitFs;
  const vlo=Q_INSET*c+vw/2, vhi=(W-Q_INSET)*c-vw/2;
  const vx=Math.max(vlo,Math.min(vhi,x));
  const px=v=>(+v).toFixed(1);
  /* a flow child: the viewBox crops from the value's box down to the bar's
     underside, and the gap to the words is a real flow margin */
  const vbY=(textBottomCells(q)+ctrlGap(q.id))*c, vbH=y+fat-vbY;
  let s='<svg class="bar" viewBox="0 '+vbY.toFixed(1)+' '+(W*c).toFixed(1)+' '+vbH.toFixed(1)+'"'
      + ' style="margin-top:'+(ctrlGap(q.id)*c).toFixed(1)+'px"'
      + ' tabindex="0" role="slider" aria-label="'+esc(String(val(q.title,derive())))+'"'
      + ' aria-valuemin="'+R.min+'" aria-valuemax="'+R.max+'" aria-valuenow="'+R.cur+'"'
      + ' aria-valuetext="'+R.cur+' '+esc(unit)+'"><g class="bbody">';
  s+='<g class="bar-line" data-qid="'+esc(q.id)+'" data-n="'+R.n+'"'
    + ' data-x0="'+px(x0)+'" data-x1="'+px(x1)+'"'
    + ' data-fat="'+px(fat)+'" data-thin="'+px(thin)+'"'
    + ' data-vlo="'+px(vlo)+'" data-vhi="'+px(vhi)+'">';
  /* the whole band is the target, not the bar — at a hundred years the bar is
     four pixels tall and a finger cannot land on that */
  s+='<rect class="bar-hit" x="'+px(Q_INSET*c)+'" y="'+px(baseY-valFs)+'"'
    + ' width="'+px((W-2*Q_INSET)*c)+'" height="'+px(y+fat-baseY+valFs)+'"/>';
  /* how far the material could still go */
  s+='<line class="bar-track" x1="'+px(x0)+'" y1="'+px(y)+'" x2="'+px(x1)+'" y2="'+px(y)+'"/>';
  /* THE MATERIAL. A round cap at each end, so at the shortest answer the bar is
     not a zero-length line but a fat dot on the left hug, and every intermediate
     state is a lozenge that has been drawn out of it. */
  s+='<line class="bar-run" x1="'+px(x0)+'" y1="'+px(y)+'" x2="'+px(x)+'" y2="'+px(y)+'"'
    + ' stroke-width="'+th.toFixed(2)+'" stroke-linecap="round"/>';
  /* Named ends instead of a number, when the question carries them (the
     week/weekend bar): one label hugging each end of the run, and no readout. */
  if(q.ends){
    s+='<text class="bar-end" x="'+px(Q_INSET*c)+'" y="'+px(baseY)+'" text-anchor="start" font-size="'+unitFs.toFixed(1)+'">'+esc(q.ends[0])+'</text>';
    s+='<text class="bar-end" x="'+px((W-Q_INSET)*c)+'" y="'+px(baseY)+'" text-anchor="end" font-size="'+unitFs.toFixed(1)+'">'+esc(q.ends[1])+'</text>';
  } else {
    s+='<text class="bar-val" x="'+px(vx)+'" y="'+px(baseY)+'" text-anchor="middle"'
      + ' font-size="'+valFs.toFixed(1)+'">'+esc(String(R.cur))
      + (unit ? '<tspan class="bar-unit" dx="0.28em" font-size="'+unitFs.toFixed(1)+'">'+esc(unit)+'</tspan>' : '')
      + '</text>';
  }
  s+='</g>';
  return s+'</g></svg>';
}
/* the stop the pointer is over, from its distance along the track */
function barIdxFromEvent(svg,clientX){
  const g=svg.querySelector('.bar-line'); if(!g) return 0;
  const rect=svg.getBoundingClientRect(), vb=svg.viewBox.baseVal;
  const vx=(clientX-rect.left)*(vb.width/rect.width);
  const x0=+g.dataset.x0, x1=+g.dataset.x1, n=+g.dataset.n;
  const p=(vx-x0)/(x1-x0);
  return Math.max(0,Math.min(n-1,Math.round(p*(n-1))));
}
/* the track's length in CLIENT pixels — the ruler a 1:1 drag is measured against */
function barTrackClient(svg){
  const g=svg.querySelector('.bar-line'); if(!g) return 1;
  const r=svg.getBoundingClientRect(), vb=svg.viewBox.baseVal;
  return Math.max(1,(+g.dataset.x1 - +g.dataset.x0)*(r.width/vb.width));
}
/* Move the handle, the run behind it and the value WITHOUT rebuilding the panel.
   This is the whole reason the drag feels continuous: renderSnake only runs when
   the answer actually changes stop, and every frame in between is three attribute
   writes on elements that are already there. */
function paintBar(p){
  const g=qsys.querySelector('.bar-line'); if(!g) return;
  const x0=+g.dataset.x0, x1=+g.dataset.x1;
  const x=x0+(x1-x0)*p;
  const run=g.querySelector('.bar-run'), val=g.querySelector('.bar-val');
  if(run){
    run.setAttribute('x2',x.toFixed(1));
    /* the length AND the thickness, every frame — the second one is the point */
    run.setAttribute('stroke-width', barThick(p,+g.dataset.fat,+g.dataset.thin).toFixed(2));
  }
  if(val) val.setAttribute('x',Math.max(+g.dataset.vlo,Math.min(+g.dataset.vhi,x)).toFixed(1));
}
/* Run the handle from one position to another. Used for the release settle and
   for taps and arrow keys, which differ only in their curve: a release is
   already at its destination and wants to LAND (easeOutCubic, short), a tap or a
   key jumped there and wants to arrive with a spring (easeOutBack, longer).
   The back curve is clamped to the track so its overshoot cannot carry the
   handle off the end at the top and bottom stops. */
function runBar(from,to,spring,then){
  cancelAnimationFrame(barRAF);
  if((reduceMotion && reduceMotion()) || Math.abs(to-from)<0.001){
    paintBar(to); if(then) then(); return;
  }
  const c1=1.7;
  const ease = spring ? t=>1+(c1+1)*Math.pow(t-1,3)+c1*Math.pow(t-1,2)
                      : t=>1-Math.pow(1-t,3);
  const dur = spring ? 380 : 260, t0=performance.now();
  paintBar(from);
  barRAF=requestAnimationFrame(function frame(now){
    let t=(now-t0)/dur; if(t>1) t=1;
    paintBar(Math.max(0,Math.min(1, from+(to-from)*ease(t))));
    if(t<1) barRAF=requestAnimationFrame(frame);
    else { paintBar(to); if(then) then(); }
  });
}
/* the stop-to-stop spring, called by barTurn after the panel has been rebuilt at
   the new value — so the digits already read the destination while the handle
   travels to it, exactly as the wheel behaves */
function spinBar(fromIdx,toIdx){
  const g=qsys.querySelector('.bar-line'); if(!g) return;
  const n=+g.dataset.n; if(n<2) return;
  runBar(fromIdx/(n-1), toIdx/(n-1), true);
}
/* set a bar question to an absolute stop index and repaint. noSpin is for dragging,
   where the selection already follows the finger stop by stop. */
function barTurn(qid,idx,noSpin){
  const q=BANK[qid]; if(!q) return;
  const R=barRing(q);
  const from=R.idx;
  /* The one door every value goes through, so it is the one place that has to
     hold. A NaN reaching this line writes NaN into S.answers, and from then on
     barRing derives its index from that NaN and hands the next NaN straight
     back — the question is corrupt for the rest of the session and the poster's
     brick band draws nothing. It gets here from a zero-sized layout: a panel
     rendered before the cell has a size makes the track zero pixels wide, and
     every position derived from it is 0/0. Clamping cannot catch that, since
     Math.min/max pass NaN through untouched. */
  if(!Number.isFinite(idx)) return;
  idx=Math.max(0,Math.min(R.n-1,idx));
  if(idx===from && S.touched[qid]) return;
  S.answers[qid]=R.at(idx); S.touched[qid]=true;
  if(q.onPick) q.onPick(); else draw();
  renderSnake();
  if(!noSpin) spinBar(from,idx);
}

/* =====================================================================
   Drawing the snake. Past markers, the current figure, and nothing else —
   a question not yet reached has no mark, exactly as the mock has no 3.
   ===================================================================== */
/* WHICH QUESTION THE PANEL IS SHOWING.
   null means "the one the flow is on" — the first still unanswered. Going back
   to a marker sets it to that question's index, and Save clears it, so the
   panel returns to the front of the flow once the revisit is banked.
   This exists because there was no notion of it: going back called
   openQuestion(), which draws the OLD floating card, so a revisited question
   appeared in the previous design's clothes. The board must never call that. */
let snakeAt=null;
function snakeIndex(){
  const first=ASKED.findIndex(q=>!isDone(q.id));
  if(snakeAt!=null && snakeAt>=0 && snakeAt<ASKED.length) return snakeAt;
  return first;
}
const snakeQ=()=>{ const i=snakeIndex(); return i<0 ? null : ASKED[i]; };

function renderSnake(){
  if(!S.baseDone){ qsys.innerHTML=''; return; }
  const c=cellSize();
  const cur=snakeIndex();
  let html='';

  /* The trail: every question behind us EXCEPT the one being shown. Keyed on
     each question's own state rather than on "index below the cursor", so a
     revisit keeps the whole trail drawn instead of truncating it. */
  for(let n=0;n<ASKED.length;n++){
    if(n===cur || !isDone(ASKED[n].id)) continue;
    const q=ASKED[n], F=snakeFigure(n);
    html+='<div class="qstep past" data-qid="'+q.id+'" tabindex="0" role="button"'
        + ' aria-label="'+pad2(n+1)+' of '+pad2(ASKED.length)+'. '+esc(q.title)+' (answered)"'
        + ' style="'+cssBox(cellBox(F.step))+';font-size:'+(0.33*c).toFixed(1)+'px">'
        + (n+1)+'</div>';
  }
  if(cur<0){ qsys.innerHTML=html; return; }    // everything answered

  /* the current figure */
  const q=ASKED[cur], F=snakeFigure(cur);
  /* TRICKLE DOWN. The four parts cut in one after another, in the order the eye
     builds them: which question, of how many, what it asks, and then the way
     out. It is a stagger of the SAME 110ms beat the opening screen runs on, so
     the piece keeps one clock.

     Only on ARRIVAL. Tagging every repaint would replay the stagger on every
     keystroke of a drag, so the class goes on only when the question showing
     has actually changed. */
  const arriving = renderSnake.last!==q.id;
  renderSnake.last=q.id;
  /* The density circles' rise plays on ARRIVAL — every time the question comes
     up, first visit or a return to it — and never on a pick, whose re-render
     keeps the circles standing. `pending` holds the rise armed across a
     double render: a revisit repaints twice in one tick (closeCard and the
     marker handler both render), and the second pass is no longer "arriving" —
     without it the rise died before it ever reached the screen. It clears in
     the rAF that actually raises the fills. */
  densityFillMarkup.rise = arriving || !!densityFillMarkup.pending;
  const A='';
  html+='<div class="qstep now'+A+'" style="'+cssBox(cellBox(F.step))
      + ';font-size:'+(0.33*c).toFixed(1)+'px">'+(cur+1)+'</div>';
  html+='<div class="qtotal'+A+'" style="'+cssBox(cellBox(F.total))
      + ';font-size:'+(0.40*c).toFixed(1)+'px">/'+ASKED.length+'</div>';

  const PH=F.panel.h;
  const pb=cellBox(F.panel);
  /* 0.52 of a cell, not 0.372. The mock's 16px was measured on its own 43px
     cell and came out too small to read at this size — the first question was
     the tell. Every question is set at this one size; nothing is scaled per
     question except the panel that holds it. */
  /* EVERY PANEL FLOWS. Title, hint and control sit in ONE .qflow column that
     owns all the spacing — vertical padding is the hug, the children's margins
     are the gaps — and the panel's height is auto: it hugs the content instead
     of holding 10 cells. The padding is vertical ONLY, so an svg control can
     span the panel's full width and keep its viewBox at 1:1 with the screen;
     the words carry the side hug as their own horizontal margins. Each control
     crops its viewBox to just itself, so where it drew inside the old 10-cell
     card no longer matters — the flow places it under the REAL text. */
  html+='<div class="qpanel'+A+'" style="left:'+pb.left.toFixed(1)+'px;top:'+pb.top.toFixed(1)+'px;'
      + 'width:'+pb.w.toFixed(1)+'px;height:auto">'
      + panelInner(q,c,PH,F.panel.w)
      + '</div>';

  /* Shut until a card has been picked. With no standing default there is nothing
     to bank, and a live Save would either record an answer nobody gave or do
     nothing when pressed — both worse than a button that is visibly not ready. */
  const locked=needsPick(q) && !isChosen(q.id);
  html+='<button type="button" class="qsave'+A+(locked?' locked':'')+'"'
      + (locked?' disabled aria-disabled="true"':'')
      + ' style="'+cssBox(cellBox(F.save))
      + ';font-size:'+(0.26*c).toFixed(1)+'px;letter-spacing:'+(0.03*c).toFixed(2)+'px">Next</button>';

  qsys.innerHTML=html;

  /* PANELS hug their content, so the box they end up with is whatever the words
     and the control add up to — which lands its bottom edge in the middle of a
     cell. THE PANEL IS INTERFACE, so it has to sit on the lattice like every
     other part of it: measure the hug, round the height UP to whole cells, and
     ASSIGN it. The slack falls at the panel's foot (the composition inside is
     tuned separately), and Next then hangs off a corner that is really on a
     line rather than off an estimate. Karin's rule, 16 Aug.
     Only the downward-opening figure reseats Next: the mirrored ones seat it a
     row ABOVE the panel's top, which is already on a line whatever the height. */
  const panelEl=qsys.querySelector('.qpanel');
  if(panelEl){
    const hCells=Math.max(1, Math.ceil(panelEl.offsetHeight/c - 0.01));
    panelEl.style.height=(hCells*c).toFixed(1)+'px';
    if(F.sy>0){
      const saveEl=qsys.querySelector('.qsave');
      if(saveEl) saveEl.style.top=(pb.top + hCells*c).toFixed(1)+'px';
    }
  }

  /* THE DENSITY CIRCLES' rise, on arrival only: the markup came out with the
     fills at 0 (see densityFillMarkup.rise), so one frame later they climb to
     their levels. A pick's re-render bakes the levels in as inline heights and
     there is nothing here to do — baking them is what makes the no-animation
     case airtight: this function forces a layout right above (the Save fit
     reads offsetHeight), and a height set from 0 AFTER a forced layout is a
     transition the browser will happily play. */
  if(densityFillMarkup.rise){
    const fills=qsys.querySelectorAll('.qfill .circ i');
    if(fills.length){
      densityFillMarkup.pending=true;
      requestAnimationFrame(()=>{
        densityFillMarkup.pending=false;
        fills.forEach(i=>{ i.style.height=i.dataset.fill+'%'; });
      });
    }
  }

  /* THE TRICKLE-DOWN, on timers rather than on a CSS animation.
     It was an animation with a staggered delay, and that is how the /9 cell
     disappeared: a CSS animation is PAUSED in a backgrounded tab, and the
     fill-mode held its from-state — opacity 0 — for as long as it never ran.
     Whatever hides a thing must be the same thing that shows it again, and a
     timer fires eventually in every state a tab can be in.

     Order is the order the eye builds the question: which one, of how many, what
     it asks, then the way out. Beat is HERO_BEAT, the opening screen's clock, so
     the piece keeps one. Everything CUTS — visibility, never opacity. */
  if(arriving){
    const parts=[qsys.querySelector('.qstep.now'), qsys.querySelector('.qtotal'),
                 qsys.querySelector('.qpanel'),   qsys.querySelector('.qsave')];
    clearTimeout(renderSnake.t);
    parts.forEach(el=>{ if(el) el.style.visibility='hidden'; });
    const show=k=>{
      if(k>=parts.length) return;
      if(parts[k] && parts[k].isConnected) parts[k].style.visibility='';
      renderSnake.t=setTimeout(()=>show(k+1), HERO_BEAT);
    };
    show(0);
  }

  /* EVERY question opens in the panel now — the old floating card is no longer
     reached from the board at all. What openQuestion used to do besides drawing
     the card still has to happen, though: mark the question reached so the
     sheet starts responding, and register the standing default so the record is
     explicit rather than implied by a fallback. */
  S.reached[q.id]=true;
  /* only the scale-shaped questions open on a value — see needsPick */
  if(!needsPick(q) && S.answers[q.id]===undefined) S.answers[q.id]=q.default;
}

/* The control the panel holds. One per question TYPE, and the panel is what
   they have in common — see the .qopts rules for why the binary and the months
   are not wheels. Positioned in the panel's own cell module: the question takes
   the top two rows, the control the bottom one and a half. */
/* =====================================================================
   THE MONTH RING — twelve circles, four across and three down, touching.

   The name sits inside its circle until it is chosen; then it LEAVES the middle
   and runs around the circle's edge, repeated as many times as the circumference
   will take, turning for as long as the answer stands. Nothing else marks it —
   no stroke, no dot in the middle. The turning name IS the state.

   The repeat count is computed from the circumference rather than fixed, so the
   names never collide and never leave a gap: a three-letter month at this size
   takes a known arc, and however many fit is however many are set.

   Circles TOUCH. There is no gap between them and no cell around them — they
   are one field with a hole opened in it, which is the whole reason the chosen
   one reads as chosen.
   ===================================================================== */
function monthRingMarkup(q,c,PH,W){
  /* Four across, three down, tangent — so the white between them is the diamond
     four touching circles leave, not a gap. Inset by Q_INSET, the panel's one
     hug, so the grid's outer edge lines up exactly with the title's. */
  const cols=RING_COLS, rows=3, gap=CIRCLE_GAP;
  /* THE CIRCLES NO LONGER TOUCH. They were tangent, and the white between them
     was the diamond four touching circles leave; a few pixels of gap trades that
     figure for four separate marks, which is what a set of twelve alternatives
     should read as. The gap comes out of the DIAMETER, not out of the hug: the
     grid still spans exactly the hugged width, so its edge still meets the
     title's. */
  const d=ringCircleD(W);
  const gridW=cols*d+(cols-1)*gap;
  const Q_SHIFT=(W-gridW)/2;                   // = Q_INSET, so the grid's edge meets the title's
  /* a flow child: the viewBox crops to the grid itself, and the gap to the
     words is a real flow margin — the bottom hug is the .qflow padding now */
  const gridH=rows*d+(rows-1)*gap;
  const top=PH-Q_INSET-gridH;
  const R=d/2, cur=picked(q.id);
  const fs=Q_HFS*c;                            // the name, inside its circle — the hint's size (14px)
  const ringFs=d*0.185*c;                      // the name, running round
  let g='<svg viewBox="0 '+(top*c).toFixed(1)+' '+(W*c).toFixed(1)+' '+(gridH*c).toFixed(1)+'"'
      + ' class="mring" style="margin-top:'+(ctrlGap(q.id)*c).toFixed(1)+'px">';
  q.options.forEach((m,k)=>{
    const col=k%cols, row=Math.floor(k/cols);
    const cx=(Q_SHIFT+col*(d+gap)+d*0.5)*c, cy=(top+row*(d+gap)+d*0.5)*c, r=R*c;
    const on=cur===m;
    /* Three letters, in the grid AND on the ring. The full name was tried and
       dropped: it forced a single pass, which read as a label bent round a curve
       rather than as something running. */
    const lab=String(m).slice(0,3).toUpperCase();
    if(!on){
      g+='<g class="mo" data-val="'+esc(String(m))+'">'
       + '<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+r.toFixed(1)+'"/>'
       + '<text x="'+cx.toFixed(1)+'" y="'+cy.toFixed(1)+'" text-anchor="middle"'
       + ' dominant-baseline="central" font-size="'+fs.toFixed(1)+'">'+lab+'</text></g>';
      return;
    }
    /* The chosen one, per the sketch: THE CIRCLE IS GONE. Not hollowed, not
       stroked — absent. What marks the answer is the name alone, turning where
       the circle was, and the hole it leaves in the field is the whole signal.
       The ring sits well inside the circle's own footprint — 0.55, not 0.70 —
       so there is clear white between the type and the circles it touches. The
       gap belongs to the name, not to its neighbours. */
    const rr=r*0.55;                           // the path the name runs on
    const id='mring'+k;
    const circ=2*Math.PI*rr;
    /* THE RING IS FILLED, EXACTLY.
       The name repeats as many times as the circumference naturally takes, and
       then the whole run is stretched to the circumference with textLength — so
       the last separator meets the first letter and there is neither a gap nor a
       glyph pushed off the end of the path. A glyph that falls off a textPath is
       not clipped, it is simply not drawn, which is how letters were going
       missing: the run was centred on twelve o'clock and whatever hung past the
       path's ends vanished.

       At least three passes: two read as a label repeated, not as something
       running round. */
    /* Three passes, and the TYPE SIZE is what bends to fit them — not the
       spacing. lengthAdjust only stretches the gaps between glyphs, so asking a
       run 137 units long to sit on a 90-unit ring squeezed the letters into each
       other. So the size is derived: whatever makes three passes of this name
       fill this circumference naturally, floored so it never becomes a smear.
       textLength then only has to take up the rounding. */
    const reps=3;
    const run=Array.from({length:reps},()=>lab).join(' \u00b7 ')+' \u00b7';
    const ringFit=Math.max(6.5, circ/(run.length*0.58));
    g+='<g class="mo on" data-val="'+esc(String(m))+'">'
     /* the turn: its own group so only the type rotates, about the circle's
        centre, stated in px because an SVG group has no box of its own */
     + '<g class="mo-spin" style="transform-origin:'+cx.toFixed(1)+'px '+cy.toFixed(1)+'px">'
     + '<path id="'+id+'" fill="none" d="M'+(cx-rr).toFixed(1)+','+cy.toFixed(1)
     +   ' a'+rr.toFixed(1)+','+rr.toFixed(1)+' 0 1,1 '+(rr*2).toFixed(1)+',0'
     +   ' a'+rr.toFixed(1)+','+rr.toFixed(1)+' 0 1,1 -'+(rr*2).toFixed(1)+',0"/>'
     /* From the path's start and all the way round: startOffset 0, no anchoring,
        and textLength set to the circumference so the run closes on itself. The
        slack goes into the spacing between glyphs, never into dropping them. */
     + '<text font-size="'+ringFit.toFixed(1)+'">'
     +   '<textPath href="#'+id+'" startOffset="0"'
     +     ' textLength="'+circ.toFixed(1)+'" lengthAdjust="spacing">'+run+'</textPath></text>'
     + '</g></g>';
  });
  return g+'</svg>';
}

/* VACATIONS — a row of touching black circles, one per option (1..3 and a '4+'),
   white labels, the chosen one inverts. FIXED size and BOTTOM-hugged by the same
   Q_INSET as the sides, so the margin is equal on left, right and bottom. */
function circlesMarkup(q,c,PH,W){
  const opts=q.options;
  const cols=opts.length;
  const gap=CIRCLE_GAP;                           // breathing room between circles, in cells
  let d=(W-2*Q_INSET-(cols-1)*gap)/cols;          // diameter once the gaps are taken out
  /* cap the diameter so a few-option row doesn't crowd the subtitle; keep the tight
     gap and CENTRE the row (left0 == Q_INSET when the row fills the width uncapped) */
  if(d>circleCap(q)) d=circleCap(q);
  const left0=(W-(cols*d+(cols-1)*gap))/2;
  /* a flow child: the viewBox crops to the row itself, and the gap to the
     words is a real flow margin — no more estimated text height, no slack */
  const top=textBottomCells(q)+ctrlGap(q.id);
  const r=(d/2)*c, fs=DIAL.labelCells*c;          // labels 14px
  let s='<svg viewBox="0 '+(top*c).toFixed(1)+' '+(W*c).toFixed(1)+' '+(d*c).toFixed(1)+'"'
      + ' class="vcirc" style="margin-top:'+(ctrlGap(q.id)*c).toFixed(1)+'px">';
  opts.forEach((v,i)=>{
    const cx=(left0+i*(d+gap)+d*0.5)*c, cy=(top+d*0.5)*c;
    const on=String(picked(q.id))===String(v);
    s+='<g class="vc'+(on?' on':'')+'" data-val="'+esc(String(v))+'">'
     + '<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+r.toFixed(1)+'"/>'
     + '<text x="'+cx.toFixed(1)+'" y="'+cy.toFixed(1)+'" text-anchor="middle"'
     + ' dominant-baseline="central" font-size="'+fs.toFixed(1)+'">'+esc(String(v))+'</text></g>';
  });
  return s+'</svg>';
}
/* SHAPE — the question that used to open the landing sequence, its control
   carried over intact: two ring glyphs drawn to the Figma node (2879:6431)
   and its 45px cell, the mark sitting apart from the ring or riding on it.
   Both marks are drawn in the ring's own box and in the frame's own units, so
   the numbers below are the Figma node's (2875:6324 / 2875:6325) verbatim —
   the viewBox does the scaling. The apart mark sits outside the box to the
   right and spills; the riding mark sits ON the ring, up and to the right of
   centre. HTML rather than panel SVG so the .qduo cell-based CSS keeps ruling
   its geometry; the buttons register through the same #qsys delegation as
   every other control. */
const DUO_RING='cx="50.4669" cy="50.4669" r="49.7169" stroke-width="1.5"';
const DUO_DOT={apart:'cx="118.877" cy="50.4669"', onring:'cx="78.504" cy="10.0934"'};
const DUO_POS=['apart','onring'];            // one glyph per side, in the bank's order
const DUO_BREAK={                             // the landing screens' own line breaks
  'It moves on without me':'It moves on<br>without me',
  'It carries me along with it':'It carries me<br>along with it'
};
function shapeDuoMarkup(q,c,PH,W){
  /* THE SAME CIRCLE AS THE FEBDAYS ROW (Q4): width-fit four across under
     febdays' own cap, so Q1's rings and Q4's circles are one size of the same
     mark, by decision. The svg frame is a shade wider than the ring it holds
     (the Figma node's 100.934 against the ring's 99.434), so the frame is
     scaled up by that ratio and the RING itself comes out at exactly d. */
  const d=Math.min((W-2*Q_INSET-(RING_COLS-1)*CIRCLE_GAP)/RING_COLS, circleCap(BANK.febdays));
  const bx=(d*(100.934/99.4338)*c).toFixed(1);
  /* a FLOW child now — it sits in the .qflow column right after the words, so
     the only geometry it states is its own gap to them (the Figma ctrlGap) */
  let s='<div class="qduo" style="margin-top:'+(ctrlGap(q.id)*c).toFixed(1)+'px">';
  q.options.forEach(([k,label],i)=>{
    const pos=DUO_POS[i]||'apart';
    const on=String(picked(q.id))===String(k);
    s+='<button type="button" class="'+pos+'" data-val="'+esc(String(k))+'"'
     + ' aria-pressed="'+on+'" style="width:'+bx+'px">'
     + '<svg viewBox="0 0 100.934 100.934" aria-hidden="true" style="width:'+bx+'px;height:'+bx+'px">'
     + '<circle class="ring" '+DUO_RING+'/>'
     + '<circle class="dot" '+DUO_DOT[pos]+' r="10.0934"/></svg>'
     + '<b>'+(DUO_BREAK[label]||esc(label))+'</b></button>';
  });
  return s+'</div>';
}
/* DENSITY — the landing sequence's second question, carried over with it:
   three circles filling up to their level — a sliver, about half, brimming.
   The rise plays on ARRIVAL — every time the question comes up, first visit or
   a return (renderSnake decides and stashes the flag here, the way snakeParts
   carries its height). On any other render — a pick, a drag's repaint — the
   level is baked into the markup as an inline height, so there is no
   0-to-level change for the CSS transition to animate, whatever forced layout
   passes run in between. */
const DENSITY_FILL={little:14, enough:52, plenty:100};   // fill level per side, in %
function densityFillMarkup(q,c,PH,W){
  const rise=!!densityFillMarkup.rise;
  /* THE SAME CIRCLE AS THE MONTH GRID, from the same function rather than a
     size of this control's own — the answer circle is one mark across the
     piece, and ringCircleD is the one place its diameter is decided. */
  const d=(ringCircleD(W)*c).toFixed(1);
  /* a FLOW child, same as the shape control — gap only, no absolute box */
  let s='<div class="qfill" style="margin-top:'+(ctrlGap(q.id)*c).toFixed(1)+'px">';
  q.options.forEach(([k,label])=>{
    const on=String(picked(q.id))===String(k);
    const fill=DENSITY_FILL[k]||0;
    s+='<button type="button" data-val="'+esc(String(k))+'" aria-pressed="'+on+'">'
     + '<span class="circ" style="width:'+d+'px;height:'+d+'px">'
     + '<i data-fill="'+fill+'"'+(rise?'':' style="height:'+fill+'%"')+'></i></span>'
     + '<b>'+esc(label)+'</b></button>';
  });
  return s+'</div>';
}

/* FEBRUARY — four bordered cards (Figma node 2780:4797): 66x106, 12px gap, the
   number (22px) over a small FEB (11px). Left-aligned by the hug. A card question
   (no default): the chosen card inverts, Save stays shut until one is picked. */
function cardsMarkup(q,c,PH,W){
  /* Figma node 2780:4797 (May): three SOLID black cards, 89.189 x 105, pitch
     105.41, the number 22px white and centred, no sub-label. */
  /* portrait cards — 89.189 x 105, the number centred. Hung under the text at
     the question's Figma gap; the 10-cell card's slack sits at the foot. */
  const cardW=89.189/36.68, cardH=105/36.68, pitch=105.41/36.68;
  const top=textBottomCells(q)+ctrlGap(q.id);
  const numFs=0.603*c;
  let s='<svg viewBox="0 0 '+(W*c).toFixed(1)+' '+(PH*c).toFixed(1)+'" class="fcard">';
  q.options.forEach((v,i)=>{
    const x=(Q_INSET+i*pitch)*c, y=top*c, w=cardW*c, h=cardH*c;
    const on=String(picked(q.id))===String(v);
    s+='<g class="fc'+(on?' on':'')+'" data-val="'+esc(String(v))+'">'
     + '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+'"/>'
     + '<text class="fc-num" x="'+(x+w/2).toFixed(1)+'" y="'+(y+h*0.5).toFixed(1)+'" text-anchor="middle"'
     + ' dominant-baseline="central" font-size="'+numFs.toFixed(1)+'">'+esc(String(v))+'</text></g>';
  });
  return s+'</svg>';
}

/* COLORWAY — the last question. Six SPLIT circles (three across, two down), each
   half one colour and half the other from COLORWAYS. Touching and bottom-hugged
   like the other circle grids; once one is picked the rest dim so the choice reads. */
function colorwayMarkup(q,c,PH,W){
  const cols=3, rows=2;
  const gap=CIRCLE_GAP;                             // a small gap between swatches
  let d=(W-2*Q_INSET-(cols-1)*gap)/cols;            // width-fit diameter
  if(d>COLORWAY_D_MAX) d=COLORWAY_D_MAX;            // cap so both rows fit the shorter panel
  const gridW=cols*d+(cols-1)*gap, gridH=rows*d+(rows-1)*gap;
  const left0=(W-gridW)/2;                          // centred horizontally
  const top=textBottomCells(q)+ctrlGap(q.id);       // crop origin — a flow child now
  const r=(d/2)*c, pk=picked(q.id);
  let s='<svg viewBox="0 '+(top*c).toFixed(1)+' '+(W*c).toFixed(1)+' '+(gridH*c).toFixed(1)+'"'
      + ' class="cway" style="margin-top:'+(ctrlGap(q.id)*c).toFixed(1)+'px">';
  q.options.forEach((opt,i)=>{
    const col=i%cols, row=Math.floor(i/cols);
    const cx=(left0+col*(d+gap)+d*0.5)*c, cy=(top+row*(d+gap)+d*0.5)*c;
    const isRandom=(opt==='random');
    const on=String(pk)===String(opt);
    const R=r.toFixed(1);
    let inner;
    if(isRandom){
      /* 'random' is NOT a fixed pair — the swatch shows the whole colour bank as a
         six-wedge pie, so it reads as "any of these, rolled". The poster takes an
         actual rolled pair (see the handler); this icon stays the bank. */
      let w=''; const nB=BANK_COLORS.length;
      for(let s2=0;s2<nB;s2++){
        const a0=(-90+s2*360/nB)*Math.PI/180, a1=(-90+(s2+1)*360/nB)*Math.PI/180;
        const x0=(cx+r*Math.cos(a0)).toFixed(1), y0=(cy+r*Math.sin(a0)).toFixed(1);
        const x1=(cx+r*Math.cos(a1)).toFixed(1), y1=(cy+r*Math.sin(a1)).toFixed(1);
        w+='<path d="M'+cx.toFixed(1)+' '+cy.toFixed(1)+' L'+x0+' '+y0+' A'+R+' '+R+' 0 0 1 '+x1+' '+y1+' Z" fill="'+BANK_COLORS[s2]+'"/>';
      }
      inner=w;
    } else {
      const raw=COLORWAYS[opt]||['#000000','#000000'];
      /* the chosen swatch mirrors the swap so the preview matches the poster */
      const pair=(on && S.colorSwap) ? [raw[1],raw[0]] : raw;
      /* split on the \ diagonal: colour A fills the lower-left half, colour B the
         upper-right half — from the top-left point of the circle to the bottom-right. */
      const k=r*0.70710678;
      const p1x=(cx-k).toFixed(1), p1y=(cy-k).toFixed(1);   // top-left
      const p2x=(cx+k).toFixed(1), p2y=(cy+k).toFixed(1);   // bottom-right
      inner='<path d="M'+p1x+' '+p1y+' A'+R+' '+R+' 0 0 0 '+p2x+' '+p2y+' Z" fill="'+pair[0]+'"/>'
          + '<path d="M'+p1x+' '+p1y+' A'+R+' '+R+' 0 0 1 '+p2x+' '+p2y+' Z" fill="'+pair[1]+'"/>';
    }
    /* the chosen swatch carries a small glyph: '⇄' on a fixed pair (click to flip
       the two inks), '↻' on 'random' (click to roll a fresh pair) — see the handler. */
    let badge='';
    if(on){
      const gr=(r*0.30).toFixed(1);
      badge='<g class="cw-badge" data-cx="'+cx.toFixed(1)+'" data-cy="'+cy.toFixed(1)+'">'
          +'<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+gr+'" fill="#FFFFFF" pointer-events="none"/>'
          +'<text class="cw-swap" x="'+cx.toFixed(1)+'" y="'+cy.toFixed(1)+'" text-anchor="middle"'
          +' dominant-baseline="central" font-size="'+(r*(isRandom?0.34:0.40)).toFixed(1)+'" fill="#111"'
          +' pointer-events="none">'+(isRandom?'↻':'⇄')+'</text></g>';
    }
    /* the wedges/halves live in their own group so a pick can spin them about the
       swatch centre — see spinSwatch. The badge stays put, over the spin. */
    s+='<g class="cw'+(on?' on':'')+'" data-val="'+esc(opt)+'"'+(pk&&!on?' opacity="0.4"':'')+'>'
      +'<g class="cw-spin" data-cx="'+cx.toFixed(1)+'" data-cy="'+cy.toFixed(1)+'">'
      +inner
      +'</g>'+badge+'</g>';
  });
  return s+'</svg>';
}

/* Swap the chosen swatch's two colours by SPINNING it 180° about its centre: a
   diagonal split turned half a turn lands each colour in the other's half, so the
   rotation IS the swap. `done` fires at rest, where the panel repaints in the new
   swapped state (which matches the rotated frame exactly, so there is no jump). */
let swatchRAF=0;
function spinSwatch(cw, done){
  cancelAnimationFrame(swatchRAF);
  const g=cw && cw.querySelector('.cw-spin');
  if(!g){ if(done) done(); return; }
  const cx=+g.dataset.cx, cy=+g.dataset.cy;
  const badge=cw.querySelector('.cw-badge');       // the ⇄ whirls a FULL turn with it
  if(reduceMotion && reduceMotion()){ if(done) done(); return; }
  const dur=460, t0=performance.now(), ease=t=>1-Math.pow(1-t,4);   // easeOutQuart — clear ease-out
  swatchRAF=requestAnimationFrame(function frame(now){
    let t=(now-t0)/dur; if(t>1) t=1; const e=ease(t);
    g.setAttribute('transform','rotate('+(180*e).toFixed(2)+' '+cx+' '+cy+')');
    if(badge) badge.setAttribute('transform','rotate('+(360*e).toFixed(2)+' '+cx+' '+cy+')');
    if(t<1) swatchRAF=requestAnimationFrame(frame);
    else if(done) done();
  });
}

/* THE COMPASS — the word question's control (see `saying`).

   Four circles on the points of a compass around an EMPTY centre, and the empty
   centre is the whole idea: the words are not a list of four equal alternatives,
   they are four directions out of where the person is standing, and the thing
   they are standing on is not drawn. The arrangement carries the meaning that a
   grid of four buttons threw away — Regret behind, Trust ahead, Worry above,
   Presence below.

   WIDE, not square. The block spans the full hug, so the horizontal axis comes
   out longer than the vertical, and that is the right way round: left-to-right
   is the axis the whole piece already reads as time. Regret and Trust sit at its
   two ends and are the furthest apart of the four.

   It emits circlesMarkup's own class names on purpose. `.vcirc .vc[data-val]` is
   already wired for hit-testing, for the chosen state and for the CSS, so this
   function only has to place circles — every other question's circle row uses
   the same three lines of styling and the same click delegation. */
const COMPASS={
  ringR:0.62,               // the running word's path, as a fraction of the circle
  ringFsMax:0.30,           // the ceiling on that word's type size, in cells
  minReps:2, maxReps:5      // passes of the word around its ring
};
function compassMarkup(q,c,PH,W){
  const opts=q.options;
  const gap=CIRCLE_GAP;
  /* THE SAME CIRCLE AS THE MONTH GRID, taken from the same function rather than
     sized to this control's own block — the two questions are meant to read as
     one family of mark, and a compass whose circles are a different diameter
     from the month's reads as a different piece of furniture. */
  const d=ringCircleD(W), r=d/2;
  /* A SQUARE: four points ninety degrees apart at the same distance out. They no
     longer touch — adjacent centres are one diameter plus the gap apart, and
     since adjacent centres lie R*sqrt(2) from each other, R = (d+gap)/sqrt(2). */
  const R=(d+gap)/Math.SQRT2;
  const block=2*R+d;
  /* under the text like every other control now — the 10-cell card's spare air
     sits below the compass, per the updated Figma, not between it and the words */
  const cx=W/2, cy=textBottomCells(q)+ctrlGap(q.id)+block/2;
  /* WHERE EACH WORD GOES, read straight off the bank's own order: 0 ahead, 1
     above, 2 below, 3 behind. Only the four-word case is a compass; any other
     count falls back to even angles so a fifth word can never land silently on
     top of another. */
  const AT = opts.length===4
    ? [[1,0],[0,-1],[0,1],[-1,0]]
    : opts.map((_,i)=>{ const a=-Math.PI/2+i*2*Math.PI/opts.length;
                        return [Math.cos(a),Math.sin(a)]; });
  /* the word inside an unpicked circle is set at the hint's size, as the month's
     three letters are, and only fitted down if a longer word would spill */
  const maxLen=Math.max(1,...opts.map(o=>String(o).length));
  const fs=Math.min(Q_HFS,(d*0.82)/(maxLen*0.52));
  const rp=r*c, rr=rp*COMPASS.ringR, circ=2*Math.PI*rr;
  /* ONE TYPE SIZE FOR ALL FOUR RUNNING WORDS.
     The month can let each ring set its own size because every label there is
     three letters, so they all come out near enough the same anyway. Here the
     words run from five letters to eight, and sizing each ring to fill its
     circumference gave TRUST at 15px beside REGRET at 20px — four different
     sizes of the same voice, on one card.
     So the size is decided ONCE, by the LONGEST word, at the size that still
     lets it round the ring twice. Every shorter word is then set at that same
     size and simply fits more passes in, or the same number with more air
     between them. The difference between the words shows up as SPACING, which
     is what should absorb it, and never as type size. */
  const fit=Math.max(6.5, Math.min(COMPASS.ringFsMax*c,
                     circ/(COMPASS.minReps*(maxLen+3)*0.58)));
  /* a flow child: the viewBox crops to the compass block itself */
  const vbY=(cy-block/2)*c;
  let s='<svg viewBox="0 '+vbY.toFixed(1)+' '+(W*c).toFixed(1)+' '+(block*c).toFixed(1)+'"'
      + ' class="vcirc compass" style="margin-top:'+(ctrlGap(q.id)*c).toFixed(1)+'px">';
  opts.forEach((v,i)=>{
    const p=AT[i], ccx=(cx+p[0]*R)*c, ccy=(cy+p[1]*R)*c;
    const on=String(picked(q.id))===String(v);
    if(!on){
      s+='<g class="vc" data-val="'+esc(String(v))+'">'
       + '<circle cx="'+ccx.toFixed(1)+'" cy="'+ccy.toFixed(1)+'" r="'+rp.toFixed(1)+'"/>'
       + '<text x="'+ccx.toFixed(1)+'" y="'+ccy.toFixed(1)+'" text-anchor="middle"'
       + ' dominant-baseline="central" font-size="'+(fs*c).toFixed(1)+'">'+esc(String(v))+'</text></g>';
      return;
    }
    /* THE PICKED ONE, built the way the month's is (see monthRingMarkup): the
       disc is GONE, not hollowed and not stroked, and what marks the answer is
       the word alone turning in the hole it left. The ring it runs on sits well
       inside the circle's own footprint, so the type never reaches the edge.

       How many passes is what varies now, not the size: as many whole runs of
       this word as fit at `fit`, floored so the stretch below can only ever OPEN
       the gaps and never squeeze the letters into each other. textLength then
       takes the remainder into the spacing, which is why the ring still closes
       exactly on itself with no glyph pushed off the end of the path. */
    const lab=String(v).toUpperCase();
    const unit=(lab.length+3)*0.58*fit;        // one pass, plus its ' · ', at that size
    const reps=Math.max(COMPASS.minReps, Math.min(COMPASS.maxReps, Math.floor(circ/unit)));
    const run=Array.from({length:reps},()=>lab).join(' · ')+' ·';
    const id='cring'+i;
    s+='<g class="vc on" data-val="'+esc(String(v))+'">'
     + '<g class="mo-spin" style="transform-origin:'+ccx.toFixed(1)+'px '+ccy.toFixed(1)+'px">'
     + '<path id="'+id+'" fill="none" d="M'+(ccx-rr).toFixed(1)+','+ccy.toFixed(1)
     +   ' a'+rr.toFixed(1)+','+rr.toFixed(1)+' 0 1,1 '+(rr*2).toFixed(1)+',0'
     +   ' a'+rr.toFixed(1)+','+rr.toFixed(1)+' 0 1,1 -'+(rr*2).toFixed(1)+',0"/>'
     + '<text font-size="'+fit.toFixed(1)+'">'
     +   '<textPath href="#'+id+'" startOffset="0"'
     +     ' textLength="'+circ.toFixed(1)+'" lengthAdjust="spacing">'+esc(run)+'</textPath></text>'
     + '</g></g>';
  });
  return s+'</svg>';
}
function panelControl(q,c,PH,W){
  if(q.id==='shape')     return shapeDuoMarkup(q,c,PH,W);
  if(q.id==='density')   return densityFillMarkup(q,c,PH,W);
  if(q.id==='saying')    return circlesMarkup(q,c,PH,W);   /* a row of four circles, like febdays — was compassMarkup */
  if(q.id==='vacations') return circlesMarkup(q,c,PH,W);
  if(q.id==='febdays')   return circlesMarkup(q,c,PH,W);
  if(q.id==='colorway')  return colorwayMarkup(q,c,PH,W);
  if(q.type==='number') return dialMarkup(q,c,PH,W);
  if(q.type==='bar')    return barMarkup(q,c,PH,W);
  if(q.type==='choice') return monthRingMarkup(q,c,PH,W);
  const opts = q.type==='choice'
    ? q.options.map(v=>[v, q.display(v)])
    : q.options.map(o=>[o[0], o[1]]);
  const rows = q.type==='choice' ? 2 : 1;
  /* the block sits inset by the same 0.44 cell the question is, and fills the
     panel's lower band — 6 cells wide by the rows it needs */
  /* Anchored to the panel's FOOT, not to a fraction of its height: the answer
     belongs directly under the question however long the question ran, and a
     proportional position would have floated it away from short ones. */
  const inset=Q_INSET*c;
  const hgt=(rows===2 ? 1.9 : 1.1)*c;
  const fs=(q.type==='choice' ? 0.26 : 0.30)*c;
  return '<div class="qopts '+q.type+'" style="margin:'+(Q_GAP*c).toFixed(1)+'px '+inset.toFixed(1)+'px 0;'
       + 'height:'+hgt.toFixed(1)+'px;font-size:'+fs.toFixed(1)+'px">'
       + opts.map(([v,label])=>
           '<button type="button" data-val="'+esc(String(v))+'"'
         + ' aria-pressed="'+String(picked(q.id)===v)+'">'
         + esc(q.type==='choice' ? String(label).slice(0,3).toUpperCase() : label)
         + '</button>').join('')
       + '</div>';
}

/* ---- where to begin ----
   A word beside the first question, and only while nothing has been answered:
   once you have started, the board itself is the instruction and this is noise.
   Sits to the right of its dot by default and flips to the left if that would
   put it over the sheet. */
function startCue(at,cell){
  if(!ASKED.length) return '';
  if(!S.baseDone) return '';   // nothing to point at yet
  if(ASKED.some(q=>isDone(q.id))) return '';
  const d=DOTS.find(x=>x.qid===ASKED[0].id);
  if(!d) return '';
  const H=hierarchy(ASKED[0].id,cell), p=at(d), U=unionBox();
  const gap=H.r+10;
  const right = p.x+gap+74 < U.l || p.x > U.r;    // room before the sheet?
  return '<text class="startcue" x="'+(right?p.x+gap:p.x-gap).toFixed(1)+'"'
       + ' y="'+(p.y+3).toFixed(1)+'" text-anchor="'+(right?'start':'end')+'">'
       + 'Start here</text>';
}

/* ---- the guide line ----
   Reaches from the question just answered toward whatever opened up, then
   fades. Not a straight run and not along the grid: a gentle arc that takes the
   long way round, bowing AWAY from the centre of the sheet. That does two jobs
   at once — it gives the gesture some travel instead of geometry, and it leans
   the line around the artwork rather than straight over the middle of it.

   The bow is derived from the two positions, never random, so it is identical
   on every re-render. A random curve would twitch each time the board relaid.

   Where it does cross the sheet it is drawn at a quarter of the weight. That is
   done by drawing the same curve twice under opposite clips — one keeping what
   is outside the sheet, one keeping what is inside — so a single gesture
   changes weight halfway along without becoming two lines. */
let guideFrom=null, guideTo=[];
function guideMarkup(at,cell){
  if(!CONFIG.GUIDE_LINE || !guideFrom || !guideTo.length) return '';
  const a=DOTS.find(x=>x.qid===guideFrom);
  if(!a) return '';
  const A=at(a), f=sheetRect(), vw=window.innerWidth, vh=window.innerHeight;
  const mid={x:f.left+f.width/2, y:f.top+f.height/2};
  let out='';
  for(const id of guideTo){
    const b=DOTS.find(x=>x.qid===id);
    if(!b) continue;
    const B=at(b);
    /* spring from the edge of one mark and land on the edge of the other,
       rather than burying both ends under the dots */
    const hA=hierarchy(guideFrom,cell).r+3, hB=hierarchy(id,cell).r+3;
    const dx=B.x-A.x, dy=B.y-A.y, dist=Math.hypot(dx,dy);
    if(dist<=hA+hB+8) continue;                 // too close to be worth a line
    const ux=dx/dist, uy=dy/dist;
    const x1=A.x+ux*hA, y1=A.y+uy*hA;
    const x2=B.x-ux*hB, y2=B.y-uy*hB;

    /* bow perpendicular to the chord, on whichever side leads further from the
       middle of the sheet */
    let nx=-uy, ny=ux;
    const cxm=(x1+x2)/2, cym=(y1+y2)/2;
    if(Math.hypot(cxm+nx-mid.x, cym+ny-mid.y) < Math.hypot(cxm-nx-mid.x, cym-ny-mid.y)){
      nx=-nx; ny=-ny;
    }
    const k=Math.min(dist*0.17, 6*cell);
    /* two control points at a third and two thirds, bowed by slightly different
       amounts — a symmetrical arc reads as drafted, an uneven one as travelled */
    const c1={x:x1+ux*dist*0.33+nx*k*0.85, y:y1+uy*dist*0.33+ny*k*0.85};
    const c2={x:x1+ux*dist*0.67+nx*k*1.10, y:y1+uy*dist*0.67+ny*k*1.10};
    const d='M '+x1.toFixed(1)+' '+y1.toFixed(1)
          + ' C '+c1.x.toFixed(1)+' '+c1.y.toFixed(1)
          + ' '+c2.x.toFixed(1)+' '+c2.y.toFixed(1)
          + ' '+x2.toFixed(1)+' '+y2.toFixed(1);
    /* THE WAKE.
       len is an over-estimate of the arc length — a gentle bow is a little
       longer than its chord, and guessing long only means the segment leaves a
       fraction early, whereas guessing short would cut it off mid-curve. No
       getTotalLength call, so this stays a pure string with no measuring pass.

       seg is how much of the curve is lit at once — a streak, not a line: about
       a quarter, floored so a short hop still reads as something moving rather
       than a dot, capped so a long one does not turn back into a drawn path.

       The gap is three times the path, which guarantees only ONE segment can
       ever intersect the visible stroke — a shorter gap and a second copy of
       the dash walks in behind the first.

       The offset runs from +seg to seg-len. The dash sits on [-o, seg-o], so at
       o = seg it is entirely before the start (invisible), and at o = seg-len
       its LEADING EDGE is exactly at len — on the target dot — with the tail
       still strung out behind it. That is the arrival. Running it to -len
       instead would carry the whole segment off the far end, which reads as
       overshooting the question it is pointing at. */
    const len=Math.round(dist*1.2+12);
    const seg=Math.round(Math.max(52, Math.min(len*0.26, 165)));
    const sty='--o0:'+seg+';--o1:'+(seg-len)+';stroke-dasharray:'+seg+' '+(len*3);
    out+='<path class="guide" clip-path="url(#gOut)" style="'+sty+'" d="'+d+'"/>'
       + '<path class="guide under" clip-path="url(#gIn)" style="'+sty+'" d="'+d+'"/>';
  }
  if(!out) return '';
  /* gOut keeps everything except the sheet — a full-bleed rect with the sheet
     punched out of it by the even-odd rule. gIn keeps only the sheet. */
  const R=(x,y,w,h)=>'M '+x+' '+y+' H '+(x+w)+' V '+(y+h)+' H '+x+' Z ';
  return '<defs>'
    + '<clipPath id="gOut"><path clip-rule="evenodd" d="'
    +   R(0,0,vw,vh) + R(f.left.toFixed(1),f.top.toFixed(1),f.width.toFixed(1),f.height.toFixed(1))
    + '"/></clipPath>'
    + '<clipPath id="gIn"><rect x="'+f.left.toFixed(1)+'" y="'+f.top.toFixed(1)
    +   '" width="'+f.width.toFixed(1)+'" height="'+f.height.toFixed(1)+'"/></clipPath>'
    + '</defs>' + out;
}
/* Called when a question is banked. Points at everything that just opened up —
   one dot during the linear lead, two once the path forks, so at the fork the
   wake shows the choice rather than a single destination.

   It runs after EVERY question, all the way through the session. It can afford
   to: a travelling segment that clears the screen in a little over a second is
   a hand-off, not a permanent line, so repeating it never accumulates into
   furniture the way a persistent path would. */
function aimGuide(fromId){
  if(!CONFIG.GUIDE_LINE) return;
  guideFrom=fromId;
  guideTo=availableQs();
  clearTimeout(aimGuide.t);
  aimGuide.t=setTimeout(()=>{ guideFrom=null; guideTo=[]; renderDots(); }, 1300);
}

/* No per-frame dot work exists here on purpose. The dots are on the grid, the
   grid does not move when the format changes, and they are placed clear of
   every format's footprint — so there is nothing to keep in step. */

/* ---------- open / close ---------- */
function placeCard(){
  const vw=window.innerWidth, vh=window.innerHeight;
  const f=sheetRect();
  /* pinnedQ==null must NOT search DOTS at all: decorative dots also carry
     qid:null, so x.qid===pinnedQ would match the first one of THOSE and anchor
     the card to a random background mark instead of falling through to the
     centred fallback below. Only a real question id is a valid anchor. */
  const anchor=pinnedQ==null ? null : DOTS.find(x=>x.qid===pinnedQ);
  const d=anchor ? dotXY(anchor) : null;      // grid coordinates -> pixels
  let cw=0, ch=0;
  const setW=w=>{                             // '' restores the CSS width
    card.style.width = w ? Math.round(w)+'px' : '';
    cw=card.offsetWidth||cardWidth();
    ch=card.offsetHeight;                     // re-read: narrower reflows taller
  };
  const settle=(l,t,origin)=>{
    card.style.left=Math.round(l)+'px';
    card.style.top=Math.round(t)+'px';
    card.style.transformOrigin=origin;
    cardBox={left:Math.round(l),top:Math.round(t),right:Math.round(l)+cw,bottom:Math.round(t)+ch};
  };

  /* THE CARD COMES OUT OF ITS DOT, and it never covers the poster. Those two
     want opposite things once the window is tight: a dot sits in the strip of
     screen beside the sheet, and a card hung off that dot by one corner
     reaches either across the sheet or off the edge. At 1000px wide with a
     390px sheet the strips are only ~300px, so corner-anchoring is impossible
     at ANY width the card can survive at.

     So the gesture is kept, not the geometry. Best case the card still hangs
