     off the dot by a corner. Otherwise it is placed as CLOSE to its dot as the
     clear space allows, and transform-origin is aimed at the dot — so it still
     grows out of that circle, just from a card whose corner is not exactly on
     it. Both cases are tried narrowest-need-first: widths descend so the card
     is never smaller than it has to be, and each step reflows to re-measure.  */
  const widths=[];
  for(let w=cardWidth(); w>=CARD_MIN_W; w-=18) widths.push(w);
  if(widths[widths.length-1]!==CARD_MIN_W) widths.push(CARD_MIN_W);

  if(d){
    for(const w of widths){
      setW(w===cardWidth()?0:w);              // full width uses the stylesheet's own
      const hit=fitAt(d,cw,ch,vw,vh,f,false);
      if(hit){ settle(hit.left, hit.top, hit.origin); return; }
    }
    /* Scan ALL widths and keep the one that lands NEAREST the dot, rather than
       the first that merely fits. The two differ sharply: a 292px card fits the
       right-hand strip while the dot is in the left one, so "first fit" parks
       the question 600px from the circle it belongs to. Eighteen pixels
       narrower and the left strip opens up and the card lands on its dot. Ties
       within 20px go to the wider card, so it only pays width for real
       proximity. */
    let best=null;
    for(const w of widths){
      setW(w===cardWidth()?0:w);
      const near=nearestClear(d,cw,ch,vw,vh,f);
      if(!near) continue;
      const gap=Math.hypot(Math.max(near.left,Math.min(d.x,near.left+cw))-d.x,
                           Math.max(near.top, Math.min(d.y,near.top+ch))-d.y);
      if(!best || gap<best.gap-20) best={...near, gap, w};
    }
    if(best){
      setW(best.w===cardWidth()?0:best.w);
      settle(best.left, best.top, originFromDot(best.left,best.top,cw,ch,d));
      return;
    }
  }
  /* no dot to speak from (the finish card): just stay off the poster */
  for(const w of widths){
    setW(w===cardWidth()?0:w);
    const clear=clearOfSheet(cw,ch,vw,vh,f);
    if(clear){ settle(clear.left, clear.top, 'center'); return; }
  }

  setW(0);
  const last = d && (fitAt(d,cw,ch,vw,vh,f,true)
                  || fitAt(d,cw,Math.min(ch,vh-2*EDGE),vw,vh,f,true));
  if(last) settle(last.left, last.top, last.origin);
  else     settle(Math.max(EDGE,(vw-cw)/2), Math.max(EDGE,(vh-ch)/2), 'center');
}

/* Where on the card the dot is, as a transform-origin. The pop keyframes scale
   the card from this point, so aiming it at the dot is what makes the card
   read as coming OUT of that circle even when its corner cannot sit on it.
   Clamped to the card's own edges: a dot further away than the card is wide
   would otherwise throw the origin far outside it and the card would appear to
   fly in rather than grow. */
function originFromDot(l,t,cw,ch,d){
  const clamp=(v)=>Math.max(0,Math.min(100,v));
  return clamp((d.x-l)/cw*100).toFixed(1)+'% '+clamp((d.y-t)/ch*100).toFixed(1)+'%';
}

/* The placement closest to the dot that is still clear of the sheet, the
   chrome and the screen edge. Same four bands as clearOfSheet, but instead of
   centring in the roomiest it centres ON THE DOT and clamps into each band,
   then keeps whichever lands nearest. */
function nearestClear(d,cw,ch,vw,vh,f){
  const G=8;
  const zones=[
    {l:EDGE, r:f.left-G, t:EDGE, b:vh-EDGE},
    {l:f.right+G, r:vw-EDGE, t:EDGE, b:vh-EDGE},
    {l:EDGE, r:vw-EDGE, t:EDGE, b:f.top-G},
    {l:EDGE, r:vw-EDGE, t:f.bottom+G, b:vh-EDGE}
  ].filter(z=>z.r-z.l>=cw && z.b-z.t>=ch);
  if(!zones.length) return null;
  const avoid=chromeBoxes();
  const hits=(l,t)=>avoid.some(x=>l<x.right+6 && l+cw>x.left-6 && t<x.bottom+6 && t+ch>x.top-6);
  let best=null;
  for(const z of zones){
    const l=Math.min(Math.max(d.x-cw/2, z.l), z.r-cw);
    let t=Math.min(Math.max(d.y-ch/2, z.t), z.b-ch);
    if(hits(l,t)){
      /* slide along the band, nearest offset first, to step over the chrome */
      let ok=false;
      for(let s=16; s<=z.b-z.t; s+=16){
        for(const cand of [t+s, t-s]){
          if(cand<z.t || cand>z.b-ch) continue;
          if(!hits(l,cand)){ t=cand; ok=true; break; }
        }
        if(ok) break;
      }
      if(!ok) continue;
    }
    const dist=Math.hypot(l+cw/2-d.x, t+ch/2-d.y);
    if(!best || dist<best.dist) best={left:l, top:t, dist};
  }
  return best;
}

/* The best position that does not touch the sheet: take the four bands the
   sheet leaves against the viewport, keep the ones the card actually fits in,
   and centre it in the roomiest. Returns null when the sheet leaves no band
   wide enough — the only case where the card is allowed to overlap it. */
function clearOfSheet(cw,ch,vw,vh,f){
  const G=8;                                   // the same breathing room fitAt uses
  const bands=[
    {l:EDGE,        r:f.left-G,   t:EDGE, b:vh-EDGE},   // left of the sheet
    {l:f.right+G,   r:vw-EDGE,    t:EDGE, b:vh-EDGE},   // right of it
    {l:EDGE,        r:vw-EDGE,    t:EDGE, b:f.top-G},   // above
    {l:EDGE,        r:vw-EDGE,    t:f.bottom+G, b:vh-EDGE}
  ].filter(z=>z.r-z.l>=cw && z.b-z.t>=ch);
  if(!bands.length) return null;
  /* widest first: on a normal viewport that is the side of the sheet with the
     most air, which is where the card is least in the way */
  bands.sort((a,b)=>(b.r-b.l)*(b.b-b.t)-(a.r-a.l)*(a.b-a.t));
  const avoid=chromeBoxes();
  const hits=(l,t)=>avoid.some(x=>l<x.right+6 && l+cw>x.left-6 && t<x.bottom+6 && t+ch>x.top-6);
  for(const z of bands){
    const cl=(z.l+z.r)/2-cw/2, ct=(z.t+z.b)/2-ch/2;
    if(!hits(cl,ct)) return {left:cl, top:ct};
    /* centred lands on the chrome — slide down the band before giving up on it */
    for(let t=z.t; t<=z.b-ch; t+=24) if(!hits(cl,t)) return {left:cl, top:t};
  }
  const z=bands[0];
  return {left:(z.l+z.r)/2-cw/2, top:(z.t+z.b)/2-ch/2};
}

/* =====================================================================
   THE LANDING — the opening screen, before anything else opens and before
   the poster is shown at all.

   Deliberately NOT part of the card/popup system that every question uses.
   A question card floats over the board on purpose — you can see the sheet
   and the grid through it, because by then you are already inside the piece.
   This screen is the opposite: it is what brings you in, and per spec the
   poster must not be visible behind it. Giving it its own element (#landing)
   rather than reusing `card` is what makes that possible.

   It used to run four steps — the aperture, then three base questions whose
   answers were permanent. Those questions moved into the bank (shape and
   density open the board now; the arrival dial was removed outright), so all
   that is left here is the aperture and its Start. */
const LANDING_STEPS=CONFIG.SHOW_OPENING?['hero']:[];
let landingStep=0;

/* ---- APERTURE: the opening screen -----------------------------------------
   Step one, and the only step that owns the whole viewport rather than the
   380px column. It asks for nothing: a title, a line about what is coming, and
   Begin.

   The mechanic: the interface grid is painted across the entire viewport and
   then a rectangle of it is cleared away. The title sits in that cleared
   rectangle, on bare ink — there is no panel behind it, no border, no shadow.
   The hole is the container.

   The hole used to be sized by the name you typed, which was the argument for
   collecting one here. With the fields gone that reading goes too, and what is
   left is the hole opening on the beat as the title arrives — the way in is
   still something that opens rather than a page that loads, but it is no
   longer something the visitor sizes.

   ONE CLOCK. The title's characters, the field's flicker and the aperture's
   growth all land on the same beat. Three animations on three timers would
   read as ambient shimmer; on a single beat it reads as a mechanism running.
   Everything cuts — visibility, not opacity; whole cells, not sub-pixels. */
const HERO_BEAT=110;                       /* ms; the whole screen's clock */
const HERO_TITLE='Architecture of Time';
const HERO_PAD=2;                          /* whole cells of clearance round the plate */
let FIELD=null;
let heroLayoutFn=null;                      /* the hero's resize handler, removed on teardown */

/* Built once, on the first landing step, and kept alive until the sequence
   hands over to the board. Every step re-renders #landingBody from scratch;
   the canvas is deliberately not in there. */
function ensureField(){
  if(FIELD) return FIELD;
  const cv=document.createElement('canvas'); cv.id='heroField';
  cv.setAttribute('aria-hidden','true');   /* decorative; the steps carry the meaning */
  landing.insertBefore(cv,landingBody);
  FIELD=heroField(cv,()=>landingBody.querySelector('.hero-plate')||landingBody);
  return FIELD;
}
function teardownHero(){
  if(FIELD){ FIELD.stop(); FIELD=null; }
  if(heroLayoutFn){ window.removeEventListener('resize',heroLayoutFn); heroLayoutFn=null; }
  const cv=landing.querySelector('#heroField');
  if(cv) cv.remove();
  landing.classList.remove('hero');
}

/* Straight to the board, skipping the opening screen. Nothing is answered on
   the way past any more — shape and density are board questions now, so the
   board opens on question one either way; this just spares the aperture.

   Two ways in and one implementation: the link on the opening screen, and ?skip
   on the URL. Neither may drift from the other. */
function skipOpening(){
  teardownHero();
  landing.classList.remove('open');
  landing.setAttribute('aria-hidden','true');
  S.baseDone=true;
  finishBase();
}

/* Four small squares, one for each corner of a cell — the pointer feedback the
   opening tiles and START share. Absolutely positioned, so they sit on the
   grid junctions the cell touches. */
function addCornerMarks(el){
  ['tl','tr','bl','br'].forEach(p=>{
    const m=document.createElement('span'); m.className='kmark '+p; el.appendChild(m);
  });
}

/* Each KAIRO letter is exactly three interface cells square (3x3), snapped to
   the same lattice the dot field paints, so its corners land on grid junctions
   and the four corner marks read as squares of the grid itself. */
const HERO_TILE_CELLS=3;
/* K,A,I,R,O on a five-wide checkerboard: K I O along the top row, A and R
   dropped between them on the row below, so the five cells interlock at their
   corners and read as one mark cut from the lattice. The bottom-middle slot,
   between A and R, is left empty for START. */
const HERO_LOGO_CELLS=[[0,0],[1,1],[2,0],[3,1],[4,0]];
/* Hovering a cell collapses the drifting twelve-ray aperture to just the four
   corner marks of that cell — the field is told to suppress its star so nothing
   but those four squares is lit, and the pointer reads as focused on the
   letter. */
function heroCellHover(el){
  el.addEventListener('mouseenter',()=>{ if(FIELD) FIELD.focus(el.getBoundingClientRect()); });
  el.addEventListener('mouseleave',()=>{ if(FIELD) FIELD.focus(null); });
}
/* Builds the mark's DOM only — five letter cells and START — with no sizes yet.
   layoutHeroLogo() measures and places everything, so the same nodes can be
   re-laid-out on resize. */
function buildHeroLogo(){
  const box=document.createElement('div'); box.className='klogo';
  box.setAttribute('role','img'); box.setAttribute('aria-label','KAIRO');
  const tiles=LOGO_LETTERS.map(ch=>{
    const t=document.createElement('div'); t.className='kt';
    t.appendChild(document.createTextNode(ch));
    addCornerMarks(t); heroCellHover(t);
    box.appendChild(t); return t;
  });
  const start=document.createElement('button');
  start.className='kstart'; start.type='button';
  start.appendChild(document.createTextNode('Start'));
  addCornerMarks(start); heroCellHover(start);
  start.addEventListener('click',advanceLanding);
  box.appendChild(start);
  return {box,tiles,start};
}

/* Size and place the mark in whole cells, snapped to the grid. The cluster is
   fifteen cells wide and seven tall (five 3x3 letters plus the 1-cell START
   row); fifteen is odd, so centring alone would drop its edges on half-cells,
   off the lattice — the top-left is therefore SNAPPED to the nearest junction
   (the field phases a junction through the viewport centre, exactly as
   measure() does). Re-run on resize and once after first paint so a viewport
   that was not yet measured — or one that changes — never leaves the cluster
   mis-sized or off the lattice. */
function layoutHeroLogo(box,tiles,start){
  const cell=cellSize();
  if(!cell||!isFinite(cell)) return;
  const cells=Math.max(1,Math.min(HERO_TILE_CELLS,Math.floor(0.92*window.innerWidth/(5*cell))));
  const tile=cells*cell;
  const boxW=5*tile, boxH=2*tile+cell;
  const W=window.innerWidth, H=window.innerHeight;
  const sox=((W/2)%cell+cell)%cell, soy=((H/2)%cell+cell)%cell;
  const left=sox+Math.round(((W-boxW)/2-sox)/cell)*cell;
  const top =soy+Math.round(((H-boxH)/2-soy)/cell)*cell;
  box.style.left=left+'px'; box.style.top=top+'px';
  box.style.width=boxW+'px'; box.style.height=boxH+'px';
  tiles.forEach((t,n)=>{
    const [c,r]=HERO_LOGO_CELLS[n];
    t.style.left=(c*tile)+'px'; t.style.top=(r*tile)+'px';
    t.style.width=tile+'px'; t.style.height=tile+'px';
    t.style.fontSize=Math.round(tile*0.42)+'px';
  });
  /* START below A and R, centred between them: three cells wide, one tall */
  start.style.left=(2*tile)+'px'; start.style.top=(2*tile)+'px';
  start.style.width=(3*cell)+'px'; start.style.height=cell+'px';
  start.style.fontSize=(Math.round(cell*0.42)-2)+'px';
}

function renderLandingHero(){
  const plate=document.createElement('div'); plate.className='hero-plate hero-kairo';
  const {box,tiles,start}=buildHeroLogo();
  plate.appendChild(box);

  /* The "Skip to the poster" link that used to hang below the cluster is gone,
     by decision: with the base questions on the board it skipped nothing but
     the mark itself, and START already does that job. ?skip on the URL stays
     as the development shortcut (see skipOpening). */
  landingBody.appendChild(plate);

  /* place it now, again after the first paint (the viewport may not be measured
     yet), and on every resize; teardownHero drops the listener */
  const layout=()=>layoutHeroLogo(box,tiles,start);
  layout();
  requestAnimationFrame(layout);
  window.addEventListener('resize',layout);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(layout);
  heroLayoutFn=layout;

  /* The field paints the lattice unbroken under the mark; there is no title to
     reveal on this screen, so it is handed no characters. */
  const field=ensureField();
  field.setChars([]);
  /* Focus is NOT taken here: openLanding() renders the step before it adds
     .open, so nothing inside can take focus yet. renderLandingStep's deferred
     focus handles it. */
}

/* The field itself. Paints the lattice over the whole viewport, then clears the
   aperture out of it — the clear is what makes the hole, so no step needs a
   background of its own and none can ever disagree with the field.

   It is built once and runs for the whole landing sequence. frameOf() is asked
   every time for the element the hole should clear, so when a step re-renders
   #landingBody the aperture just resizes around whatever is there now: wide for
   the opening plate, narrow for the 380px question column. That resize IS the
   transition between steps.

   Note what is NOT painted here: the sheet, the dot field, anything of the
   poster. All four steps are spec'd to show none of it, and this holds that
   line while still standing the visitor inside the lattice the finished poster
   will be read against. */
function heroField(cv,frameOf){
  const ctx=cv.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  let chars=[];                             /* only the opening step has a title */
  /* READ FROM THE PALETTE, not hard-coded. These were white because the screen
     was black; now the screen is whatever --ink is, and these follow --sheetline
     and the interface ink with it. That is the rule: one place to change. */
  const cssVar=(k,fb)=>getComputedStyle(document.documentElement)
                        .getPropertyValue(k).trim()||fb;
  const RAY=cssVar('--sheetline','rgba(0,0,0,.34)');
  /* the field stays monochrome on purpose: --done yellow means "this question
     is settled" everywhere else in the piece, and spending it on decoration
     here would blunt it before it has been earned */
  const MARK_LO=cssVar('--line','rgba(0,0,0,.16)');

  /* A square sits on EVERY --cell junction of the interface grid, so the field and
     the poster's grid share the same lattice exactly (Karin's ask: each square on a
     grid junction). The light and the twelve-ray star, though, are still measured in
     the coarser UNIT of STEP_CELLS cells, so widening the square field does not shrink
     the bloom or pull the star's hour-points off where they were. The aperture stays
     in whole --cell units — the hole belongs to the piece's grid. */
  const STEP_CELLS=1;    /* the light/star unit, in --cell; the square lattice itself is one cell.
                            1 = the compact spider (rays reach ring-2 of the cell grid, 2 cells out);
                            2 was double that. This is the one knob for the tracking star's size. */
  const R_STEPS=4.4;      /* how far the light reaches, in UNITS */
  /* How fast the light falls off. Squared kept the bloom tight, which read
     fine when there was a mark in every cell — on the sparse lattice it left
     nothing lit but the twelve ray ends. Below 2 the neighbours come back. */
  const FALLOFF=1.35;
  const RAY_STEPS=2;      /* where the twelve rays end, in UNITS */
  /* Twelve, at 30°, snapped to the UNIT sublattice (every STEP_CELLS cells): ring-2 of
     that coarser lattice is exactly (±2,0) (0,±2) (±2,±1) (±1,±2) — twelve points, the
     reference's star with nothing forced. Snapping the ends to the unit rather than the
     dense cell lattice is what keeps this clean 12-point clock even now that a square
     sits on every junction. It is a clock, and the piece is about time. */
  const RAYS=12;

  /* The far field never changes, so it is painted once into an offscreen canvas
     and blitted each frame. Only the ~130 cells inside the light get computed
     per frame, which is what makes a 60fps cursor affordable on a full-viewport
     lattice — repainting every cell every frame would be ~5000 rects a frame to
     redraw a picture that is identical everywhere the cursor is not. */
  const bg=document.createElement('canvas');
  const bx=bg.getContext('2d');

  let W=0,H=0,cell=20,cols=0,rows=0,dpr=1,rect={left:0,top:0};
  let step=20,unit=40,sox=0,soy=0,scols=0,srows=0;   /* step: dense square lattice (one cell); unit: light/star scale */
  let apW=0,apH=0,tgtW=0,tgtH=0;            /* aperture, in whole cells */
  let lit=0,acc=0,last=0,raf=null;
  /* while a KAIRO cell is hovered the star concentrates onto it: focusAmt eases
     from 0 (the full twelve-ray star) to 1 (collapsed — rays retracted and
     faded, leaving only the cell's four corner marks). focusTarget is where it
     is heading. */
  let focusAmt=0, focusTarget=0, focusRect=null;   /* the hovered cell, so rays gather onto its corners */
  /* fx,fy is where the light actually is; px,py is where it is being pulled.
     The gap between them is the whole feel of the thing: the field follows the
     hand, it does not teleport with it. */
  let fx=0,fy=0,px=0,py=0,pointer=false;

  function measure(){
    dpr=Math.min(2,window.devicePixelRatio||1);
    W=cv.clientWidth; H=cv.clientHeight;
    if(!W||!H) return;
    cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    rect=cv.getBoundingClientRect();
    cell=parseFloat(getComputedStyle(document.documentElement)
      .getPropertyValue('--cell'))||20;
    /* put a cell boundary through the exact centre of the viewport. That is
       what lets an aperture of N whole cells, centred, land all four edges on
       the piece's grid — the same trick syncSheet() uses to snap the sheet. */
    cols=Math.ceil(W/cell)+2; rows=Math.ceil(H/cell)+2;
    /* the square lattice IS the cell grid, phased so a junction sits at the viewport
       centre; the light/star read the coarser unit */
    step=cell; unit=cell*STEP_CELLS;
    sox=(W/2)%step; soy=(H/2)%step;
    scols=Math.ceil(W/step)+2; srows=Math.ceil(H/step)+2;
    if(!pointer){ fx=px=W/2; fy=py=H/2; }
    paintBg();
    retarget();
  }

  /* lattice point for an index, and the nearest index to a point. No half-step offset:
     a square sits ON the junction (sox is the junction phase), not at the cell centre. */
  const cxOf=c=>sox+c*step, cyOf=r=>soy+r*step;
  const cAt=x=>Math.round((x-sox)/step), rAt=y=>Math.round((y-soy)/step);

  function paintBg(){
    bg.width=cv.width; bg.height=cv.height;
    bx.setTransform(dpr,0,0,dpr,0,0);
    bx.clearRect(0,0,W,H);

    /* No ruled lines. The lattice is stated by the squares alone — where they
       stop, the aperture begins, and that edge is legible without anything
       being drawn around it. Ruling it as well was belt and braces, and it
       made the field read as graph paper rather than as a field.
       (.gridlayer behind the board still rules its own lines; that is the
       board's language, and #landing covers it completely anyway.)

       At rest the squares are barely there; the light is what gives them
       size. */
    const m=Math.max(2,Math.round(unit*.055));   /* same square size as before, now one per junction */
    bx.fillStyle=MARK_LO;
    for(let c=-1;c<scols;c++) for(let r=-1;r<srows;r++){
      bx.fillRect(Math.round(cxOf(c)-m/2),Math.round(cyOf(r)-m/2),m,m);
    }
  }

  function retarget(){
    const el=frameOf();
    if(!el) return;
    const r=el.getBoundingClientRect();
    if(!r.width) return;
    /* the smallest hole that still clears the plate — the floor a clamp may
       never cut into, or the type would end up sitting back on the grid */
    const minW=Math.ceil(r.width/cell)+2, minH=Math.ceil(r.height/cell)+2;
    /* and the largest that still leaves two cells of field on every side, so
       the aperture always reads as cut OUT of something */
    const maxW=Math.max(minW,cols-4), maxH=Math.max(minH,rows-4);
    tgtW=Math.min(maxW,Math.ceil(r.width/cell)+HERO_PAD*2);
    tgtH=Math.min(maxH,Math.ceil(r.height/cell)+HERO_PAD*2);
    if(reduce){ apW=tgtW; apH=tgtH; paint(); }
  }

  function paint(){
    if(!W||!H) return;
    ctx.clearRect(0,0,W,H);
    ctx.drawImage(bg,0,0,W,H);
    /* foc: 0 = full twelve-ray star; 1 = concentrated onto the hovered cell.
       The star never fades: four arms become the cell's four corner squares
       and the rest collapse into the centre — see the ray loop below. Only the
       BLOOM dims out, so the grid glow does not sit on the hovered letter. */
    const foc=focusAmt;

    const R=R_STEPS*unit;
    const base=Math.max(2,Math.round(unit*.055));
    const peak=Math.max(4,Math.round(unit*.22));
    const span=Math.ceil(R/step)+1;                 /* the bloom radius, counted in the dense cell lattice */
    const c0=cAt(fx), r0=rAt(fy);

    /* The squares inside the light, sized and brightened by how near they are —
       the whole bloom dims out as the star concentrates. */
    for(let c=c0-span;c<=c0+span;c++){
      for(let r=r0-span;r<=r0+span;r++){
        const x=cxOf(c), y=cyOf(r);
        const d=Math.hypot(x-fx,y-fy);
        if(d>R) continue;
        const t=1-d/R, f=Math.pow(t,FALLOFF);
        const s=Math.max(base,Math.round(base+(peak-base)*f));
        ctx.fillStyle='rgba(20,20,20,'+((0.16+0.72*f)*(1-foc)).toFixed(3)+')';
        ctx.fillRect(Math.round(x-s/2),Math.round(y-s/2),s,s);
      }
    }

    /* Twelve rays at 30°. THE STAR DOES NOT FADE when it concentrates — it is
       one unit throughout. Four of its arms, one per corner of the hovered
       cell (each corner claims its NEAREST arm, and an arm can serve only one
       corner), sweep out and BECOME the cell's four corner squares: the tip
       travels to the corner while the line's centre end chases it, so the arm
       shortens into its square instead of fading, and the square eases to the
       .kmark size so what lands IS the corner mark. The other eight arms
       collapse along themselves into the centre and end up under the centre
       square. */
    /* the four corners of the hovered cell, in canvas coords */
    let corners=null;
    if(focusRect){
      const fl=focusRect.left-rect.left, ft=focusRect.top-rect.top,
            fr=focusRect.right-rect.left, fb=focusRect.bottom-rect.top;
      corners=[[fl,ft],[fr,ft],[fl,fb],[fr,fb]];
    }
    /* every arm's nominal tip first — the corners need them all to choose from */
    const tips=[];
    for(let k=0;k<RAYS;k++){
      const a=k*(Math.PI*2/RAYS)-Math.PI/2;
      const cc=Math.round((fx+Math.cos(a)*RAY_STEPS*unit-sox)/unit);
      const rr=Math.round((fy+Math.sin(a)*RAY_STEPS*unit-soy)/unit);
      tips.push([sox+cc*unit, soy+rr*unit]);
    }
    const armCorner=new Array(RAYS).fill(null);
    if(corners){
      const taken=new Set();
      for(const [cx,cy] of corners){
        let best=Infinity, bk=-1;
        for(let k=0;k<RAYS;k++){
          if(taken.has(k)) continue;
          const d=(cx-tips[k][0])*(cx-tips[k][0])+(cy-tips[k][1])*(cy-tips[k][1]);
          if(d<best){ best=d; bk=k; }
        }
        if(bk>=0){ taken.add(bk); armCorner[bk]=[cx,cy]; }
      }
    }
    ctx.strokeStyle=RAY; ctx.lineWidth=1; ctx.beginPath();
    const ends=[];
    for(let k=0;k<RAYS;k++){
      const [nx,ny]=tips[k], tgt=armCorner[k];
      let ex,ey;
      if(tgt){
        /* a keeper: tip to the corner, centre end chasing it */
        ex=nx+(tgt[0]-nx)*foc; ey=ny+(tgt[1]-ny)*foc;
        ctx.moveTo(fx+(ex-fx)*foc, fy+(ey-fy)*foc); ctx.lineTo(ex,ey);
      }else{
        /* collapsed: the tip retracts along its own arm into the centre */
        ex=nx+(fx-nx)*foc; ey=ny+(fy-ny)*foc;
        ctx.moveTo(fx,fy); ctx.lineTo(ex,ey);
      }
      ends.push([ex,ey,!!tgt]);
    }
    ctx.stroke();

    /* the hour marks sit on top of their rays, so the line reads as arriving at
       the square rather than crossing it. A keeper's square eases from the
       star's own size to the DOM corner mark's (cell*.17 — see .kmark), so the
       landing is exact. */
    ctx.fillStyle=cssVar('--fg','#141414');
    const hm=Math.max(4,Math.round(unit*.17));
    const km=Math.max(3,Math.round(cell*.17));
    for(const [x,y,keep] of ends){
      const s=keep ? hm+(km-hm)*foc : hm;
      ctx.fillRect(Math.round(x-s/2),Math.round(y-s/2),Math.round(s),Math.round(s));
    }

    /* the centre: the only mark not on the lattice, because it is you */
    const fm=Math.max(6,Math.round(unit*.26));
    ctx.fillRect(Math.round(fx-fm/2),Math.round(fy-fm/2),fm,fm);

    /* No hole is cut any more. The grid runs unbroken under the KAIRO mark and
       the question panels — the letters sit ON the lattice, and hovering one
       lights the grid squares at its four corners, which only reads if the grid
       is there beneath it. The white cells and the opaque panels supply their
       own ground where they need one. */
  }

  function tick(now){
    raf=requestAnimationFrame(tick);
    if(!last) last=now;
    const dt=now-last; last=now;

    /* Before the hand arrives — and on any device that has no hand — the light
       drifts on its own, so the screen is never dead on first sight. */
    if(!pointer){
      px=W/2+W*0.34*Math.sin(now*0.00021);
      py=H/2+H*0.30*Math.sin(now*0.00029+1.1);
    }
    /* frame-rate independent ease-out: same feel at 60 and 120Hz */
    const k=1-Math.pow(0.0016,dt/1000);
    fx+=(px-fx)*k; fy+=(py-fy)*k;
    /* the concentrate-on-hover transition, on its own quick ease */
    focusAmt += (focusTarget-focusAmt)*Math.min(1,dt/140);
    if(focusTarget===0 && focusAmt<0.02){ focusAmt=0; focusRect=null; }

    acc+=dt;
    if(acc>=HERO_BEAT){
      acc=0;
      if(lit<chars.length) chars[lit++].classList.add('lit');
      /* two cells per beat in each axis — a hard step, never a tween */
      if(apW!==tgtW) apW += apW<tgtW ? Math.min(2,tgtW-apW) : -Math.min(2,apW-tgtW);
      if(apH!==tgtH) apH += apH<tgtH ? Math.min(2,tgtH-apH) : -Math.min(2,apH-tgtH);
    }
    paint();
  }

  const onMove=e=>{
    pointer=true;
    px=e.clientX-rect.left; py=e.clientY-rect.top;
    if(reduce){ fx=px; fy=py; paint(); }
  };
  const onLeave=()=>{ pointer=false; };
  const onResize=()=>{ measure(); paint(); };
  window.addEventListener('resize',onResize);
  landing.addEventListener('pointermove',onMove);
  landing.addEventListener('pointerleave',onLeave);
  /* a step's height depends on the display serif, so its box is wrong until the
     webfont lands; retarget once it has */
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ measure(); paint(); });

  measure();
  if(reduce){
    /* no autonomous motion: no drift, no ease, no beat. The light still answers
       the hand, because that is the visitor moving, not the page. */
    apW=tgtW; apH=tgtH; paint();
  } else raf=requestAnimationFrame(tick);

  return {
    retarget,
    /* Handed the current step's title characters, or an empty list when the
       step has none. The beat reveals them; nothing else knows about them. */
    setChars(list){
      chars=list||[]; lit=0;
      if(reduce) chars.forEach(i=>i.classList.add('lit'));
    },
    /* aims the concentrate-on-hover transition: pass the hovered cell's rect and
       the rays gather onto its four corners; pass null and the star springs back */
    focus(r){ if(r) focusRect=r; focusTarget=r?1:0; if(reduce){ focusAmt=focusTarget; if(!r) focusRect=null; paint(); } },
    stop(){
      if(raf) cancelAnimationFrame(raf);
      window.removeEventListener('resize',onResize);
      landing.removeEventListener('pointermove',onMove);
      landing.removeEventListener('pointerleave',onLeave);
    }
  };
}

/* One step left — the aperture. The table stays so a landing step can be added
   back with one entry, the way the base questions once lived here. */
const LANDING_RENDER={hero:renderLandingHero};
function renderLandingStep(){
  const step=LANDING_STEPS[landingStep];
  landing.classList.toggle('hero',step==='hero');
  /* The step wipes to nothing and builds itself: the hero its KAIRO mark. */
  landingBody.innerHTML='';
  LANDING_RENDER[step]();
  /* The field is not in this DOM and survives the wipe — it only has to be
     told the shape it frames just changed. */
  const f=ensureField();
  f.retarget();
}
function advanceLanding(){
  if(landingStep+1<LANDING_STEPS.length){ landingStep++; renderLandingStep(); }
  else finishBase();
}
function showIntro(){
  /* nothing to show — straight to the board (SHOW_OPENING off) */
  if(!LANDING_STEPS.length){ finishBase(); return; }
  introOpen=true; landingStep=0;
  renderLandingStep();
  landing.classList.add('open');
  landing.setAttribute('aria-hidden','false');
  holdWorld(true);
}
function finishBase(){
  teardownHero();
  S.baseDone=true;
  introOpen=false;
  landing.classList.remove('open');
  landing.setAttribute('aria-hidden','true');
  holdWorld(false);
  relayout();
}

function openQuestion(id){
  if(!BANK[id] || !canOpen(id)) return;
  openQ=id; pinnedQ=id;
  S.reached[id]=true;              // the sheet starts responding right away
  /* register the standing value so the record is explicit rather than implied
     by a fallback; S.touched tells us whether the person actually chose */
  if(S.answers[id]===undefined) S.answers[id]=BANK[id].default;
  finished=false;
  renderCard();
  card.classList.add('open');
  card.setAttribute('aria-hidden','false');
  placeCard();
  card.style.animation='none'; void card.offsetWidth; card.style.animation='';
  holdWorld(true);
  renderDots();
  draw();
  const first=card.querySelector('button,input');
  if(first) setTimeout(()=>first.focus(),80);
}

function closeCard(markDone){
  if(markDone && openQ) S.done[openQ]=true;
  openQ=null; pinnedQ=null; finished=false; cardBox=null;
  card.classList.remove('open');
  card.setAttribute('aria-hidden','true');
  holdWorld(false);
  renderDots(); renderStatus(); draw();
}

function showFinish(){
  openQ=null; finished=true;
  /* the finish card grows out of the last dot that was answered */
  const last=ASKED[ASKED.length-1];
  pinnedQ = DOTS.find(x=>x.qid===last.id) ? last.id : ((DOTS.find(x=>x.qid)||{}).qid || null);
  renderCard();
  card.classList.add('open');
  card.setAttribute('aria-hidden','false');
  placeCard();
  card.style.animation='none'; void card.offsetWidth; card.style.animation='';
  holdWorld(true);
  renderDots(); renderStatus(); draw(); submit('complete');
}

/* ---------- controls ---------- */
const ICON={
  circle:'<circle cx="26" cy="26" r="24"/>',
  rectangle:'<rect x="1" y="12" width="50" height="28"/>',
  triangle:'<polygon points="26,2 51,48 1,48"/>'
};
function ctrlShapes(q){
  const el=document.createElement('div'); el.className='shapes';
  Object.keys(q.options).forEach(k=>{
    const b=document.createElement('button');
    b.type='button';
    b.innerHTML='<svg viewBox="0 0 52 52" aria-hidden="true">'+ICON[k]+'</svg><b>'+q.options[k].label+'</b>';
    b.setAttribute('aria-pressed',String(ans(q.id)===k));
    b.setAttribute('aria-label',q.options[k].label);
    b.addEventListener('click',()=>{
      S.answers[q.id]=k; S.touched[q.id]=true; draw();
      [...el.children].forEach(c=>c.setAttribute('aria-pressed',String(c===b)));
    });
    el.appendChild(b);
  });
  return el;
}
function ctrlDuo(q){
  const el=document.createElement('div'); el.className='duo';
  q.options.forEach(([k,t,sub])=>{
    const b=document.createElement('button');
    b.type='button';
    b.innerHTML='<strong>'+t+'</strong><span>'+sub+'</span>';
    b.setAttribute('aria-pressed',String(ans(q.id)===k));
    b.addEventListener('click',()=>{
      S.answers[q.id]=k; S.touched[q.id]=true; draw();
      [...el.children].forEach(c=>c.setAttribute('aria-pressed',String(c===b)));
    });
    el.appendChild(b);
  });
  return el;
}
function ctrlNumber(q){
  const D=derive();
  const min=val(q.min,D), max=val(q.max,D);
  const start=Math.max(min,Math.min(max,Math.round(ans(q.id))));
  S.answers[q.id]=start;
  const el=document.createElement('div');
  el.innerHTML=
    '<div class="num"><input type="number" min="'+min+'" max="'+max+'" step="1" value="'+start+'"><em>'+(q.unit||'')+'</em></div>'+
    '<input type="range" min="'+min+'" max="'+max+'" step="1" value="'+start+'">'+
    '<div class="scale"><span>'+pad2(min)+'</span><span>'+pad2(max)+'</span></div>';
  const num=el.querySelector('input[type=number]'), rng=el.querySelector('input[type=range]');
  num.setAttribute('aria-label',q.unit||'Value'); rng.setAttribute('aria-label',q.unit||'Value');
  const set=(v,syncNum)=>{
    const n=Math.max(min,Math.min(max,Math.round(v)||0));
    S.answers[q.id]=n; S.touched[q.id]=true; rng.value=n; if(syncNum) num.value=n; draw();
  };
  rng.addEventListener('input',()=>set(+rng.value,true));
  num.addEventListener('input',()=>{ if(num.value!=='') set(+num.value,false); });
  num.addEventListener('blur',()=>{ num.value=S.answers[q.id]; });
  num.addEventListener('keydown',e=>{ if(e.key==='Enter'){ num.blur(); saveAnswer(); } });
  return el;
}
/* A flat grid of equal buttons — the duo control's logic with no cap on how
   many sides a question may have. Twelve months need to be scannable at a
   glance, so they are laid out as a grid rather than a list or a scrubber:
   picking a month is a recognition task, not a measurement. */
function ctrlChoice(q){
  const el=document.createElement('div'); el.className='choice';
  q.options.forEach(k=>{
    const b=document.createElement('button');
    b.type='button'; b.textContent=k;
    b.setAttribute('aria-pressed',String(ans(q.id)===k));
    b.addEventListener('click',()=>{
      S.answers[q.id]=k; S.touched[q.id]=true;
      /* A question whose layer ARRIVES rather than appears owns that arrival,
         so the bank declares it and the control just runs it. onPick replaces
         the plain draw() — it is expected to paint. */
      if(q.onPick) q.onPick(); else draw();
      [...el.children].forEach(c=>c.setAttribute('aria-pressed',String(c===b)));
    });
    el.appendChild(b);
  });
  return el;
}
const CONTROLS={shapes:ctrlShapes, duo:ctrlDuo, number:ctrlNumber, choice:ctrlChoice};

/* The roll, for the three questions that own a tool. It sits UNDER the control
   and ABOVE the exits on purpose: it belongs to the mark this question makes,
   not to leaving the question, and putting it in the nav row would have made
   it read as a third exit next to Save and Skip.

   Dead until the question has been chosen. Rolling redraws a layer that is not
   on the sheet yet would be a button that visibly does nothing, and the honest
   alternative — having it register the default answer on the person's behalf —
   would put an answer in the record nobody gave. So it waits, and says why. */
/* The Randomize control is GONE from the interface, by decision along with
   Skip: the question system's mock has one action on it and that action is
   Save. ROLLS/rolled()/rollFor() all stay — every tool still reads its
   randomisable control through rolled(), which now always returns the frozen
   default. Bringing the control back is a matter of a button that calls
   rollFor(id) and then draw(); nothing else has to change. */

/* ---------- card contents ---------- */
function renderCard(){
  const D=derive();
  cardBody.innerHTML='';
  const box=document.createElement('div');
  box.className='q';

  if(finished){
    const summary=ASKED.filter(q=>isAnswered(q.id))
                       .map(q=>q.label+' '+q.display(ans(q.id))).join(' · ');
    box.innerHTML='<h2>Your poster is ready.</h2><p class="hint">'+esc(summary)+'.</p>'+
      '<div class="row">'+
        '<button class="btn" id="dlPng" type="button">Download PNG</button>'+
        '<button class="btn ghost" id="dlSvg" type="button">SVG for print</button>'+
      '</div>'+
      '<div class="collected">'+
        '<span id="saveNote">Response saved \u00b7 '+RESPONSES.length+' collected'+
          (CONFIG.DATA_ENDPOINT?' \u00b7 sent to endpoint':' \u00b7 no endpoint set')+'</span>'+
        '<div class="row">'+
          '<button class="btn ghost" id="cpJson" type="button">Copy JSON</button>'+
          '<button class="btn ghost" id="dlCsv" type="button">All responses (CSV)</button>'+
        '</div>'+
      '</div>';
    cardBody.appendChild(box);
    box.querySelector('#dlPng').addEventListener('click',exportPNG);
    box.querySelector('#dlSvg').addEventListener('click',exportSVG);
    box.querySelector('#dlCsv').addEventListener('click',()=>downloadResponses('csv'));
    box.querySelector('#cpJson').addEventListener('click',async e=>{
      const ok=await copyPayload();
      e.target.textContent = ok ? 'Copied' : 'Logged to console';
      setTimeout(()=>{ e.target.textContent='Copy JSON'; },1600);
    });
    const foot=document.createElement('div');
    foot.className='nav';
    const close=document.createElement('button');
    close.className='btn ghost'; close.type='button'; close.textContent='Close';
    close.addEventListener('click',()=>closeCard(false));
    foot.appendChild(close);
    cardBody.appendChild(foot);
    return;
  }

  const q=BANK[openQ];
  if(!q) return;
  const idx=ASKED.findIndex(x=>x.id===openQ);
  box.innerHTML=
    '<div class="eyebrow"><span>'+esc(q.label)+'</span>'
    + '<span class="eyebrow-right">'+pad2(idx+1)+' / '+pad2(ASKED.length)+'</span></div>'
    + '<h2>'+val(q.title,D)+'</h2><p class="hint">'+val(q.hint,D)+'</p>';
  box.appendChild(CONTROLS[q.type](q));
  cardBody.appendChild(box);

  /* Two exits, and they do different things — which is exactly what the old
     Done / Close pair failed to say. Save banks the answer and moves on; Skip
     passes the question by and moves on WITHOUT recording one. Cancelling is a
     third thing again and needs no button: Escape, or clicking the dot a second
     time, shuts the card and leaves the question exactly as it was. */
  const foot=document.createElement('div');
  foot.className='nav';
  /* Always just "Save" — even on the last question. Creating the poster is a
     separate, deliberate action now (see #mkPoster), not something the last
     Save silently doubles as. */
  const save=document.createElement('button');
  save.className='btn'; save.type='button'; save.textContent='Save';
  save.addEventListener('click',saveAnswer);
  foot.appendChild(save);

  /* Skip is GONE from the interface, by decision. Cancelling still needs no
     button — Escape, or clicking the marker a second time, shuts the card and
     leaves the question as it was. step(true)/skipQuestion and the whole
     skipped path stay in the code and in the record's shape: they are what let
     a response say "no answer given" rather than reporting a default, and that
     distinction should not be thrown away to remove a button. */
  cardBody.appendChild(foot);
}

/* Both exits do the same three things — mark the question behind us, save, and
   hand off to the next dot — and differ only in whether an answer was given.
   step() is that shared shape, so the two can never drift apart. */
/* Saving or skipping the LAST question no longer auto-opens the finish card —
   it behaves exactly like any other question. "Create the poster" is now a
   deliberate, separate action (see #mkPoster below), not something bundled
   into answering. So this always submits 'partial'; 'complete' is submitted
   only by showFinish(), which only the dedicated button ever calls. */
function step(passed){
  /* openQ is the old floating card's question. The board no longer opens it, so
     the question being answered is simply the one the snake is on — and that is
     what Save in the panel means. Falling back here rather than faking openQ
     keeps the card's own state out of a flow that no longer uses it. */
  const from=openQ || ((snakeQ()||{}).id);
  if(!from) return;
  snakeAt=null;                    // banked — the panel goes back to the flow
  S.done[from]=true;
  if(passed){
    S.skipped[from]=true;
    /* Drop the standing value that openQuestion registered, so nothing claims
       an answer that was not given: the record reports null, and the bead
       count does not include it.
       The ARTWORK is the one place a default still applies — the poster has to
       draw some shape and some ground — so a skipped question falls back to a
       neutral default there rather than leaving a hole. */
    delete S.answers[from];
    delete S.reached[from];
    delete S.touched[from];
  } else {
    delete S.skipped[from];                   // in case it was skipped earlier
  }
  submit('partial');                          // captured even if they stop here
  aimGuide(from);                             // reach toward whatever just opened
  closeCard(false);                           // ...which renders it
}
const saveAnswer=()=>step(false);
/* No caller while the interface has no Skip: kept as the named entry point
   to the skipped path, which the record still models. See renderCard. */
const skipQuestion=()=>step(true);

/* ---------- status strip, bottom left ---------- */
function renderStatus(){
  const done=ASKED.filter(q=>isDone(q.id)).length;
  const answered=ASKED.filter(q=>isAnswered(q.id)).length;
  const passed=done-answered;
  const bits=[];
  bits.push('<span class="build">'+BUILD+'</span>');
  if(done===0) bits.push('<span class="cue">'
    + (!S.baseDone ? 'Say hello first' : 'Click the pulsing point to begin')
    + '</span>');
  /* counts what was ANSWERED, not what is behind us — and states the skips
     separately rather than quietly folding them into progress */
  else bits.push('<span>'+pad2(answered)+' of '+pad2(ASKED.length)+' answered'
               + (passed?' · '+pad2(passed)+' skipped':'')+'</span>');
  /* Only worth saying once there is actually a choice. During the linear lead a
     single question is open and "1 open" is noise; at the fork the board starts
     behaving differently and that IS worth stating. */
  if(!allDone() && forked()) bits.push('<span>'+availableQs().length+' open, pick either</span>');
  statusBar.innerHTML='<span class="statline">'+bits.join('<i class="sep"></i>')+'</span>';
  resetBtn.disabled = done===0 && Object.keys(S.answers).length===0 && !finished;
  /* the one and only "create the poster" control — see #mkPoster's own
     comment for why it lives below the sheet rather than in this strip or
     inside a question card */
  mkBtn.classList.toggle('ready', allDone() && !finished);
}

/* ---------- poster ----------
   Painted into whichever of the two layers is currently live. The other one
   holds the outgoing format for the length of a morph and is otherwise idle. */
let livePly=0, lastMarkup=['',''];
/* Writing innerHTML throws the whole SVG away and builds a new one — new
   element, new render tree, new raster. At up to 1,872 smoke rects that is
   heavy enough to drop a frame and show as a flash, and draw() is called on
   every single input event while a slider is dragged, most of which do not
   change the rounded answer at all. So build the markup, compare it, and only
   touch the DOM when it is genuinely different. Most drag events now cost a
   string compare instead of a reparse. */
/* Each hover layer is given a transparent rect at its own bounding box, so the
   whole element region is hoverable (not just the thin shapes) while z-order keeps
   a layer above its neighbours. Runs after the SVG is in the DOM (needs getBBox). */
function addHitRects(ply){
  if(!ply) return;
  ply.querySelectorAll('.hl').forEach(g=>{
    /* month and sixweek are hovered on their ACTUAL painted marks, not a
       bounding box: both scatter corner to corner, so a bbox rect would be the
       whole sheet and every element under it could never be reached. For the
       lattice the marks are its cell rects (red, and paper with a red frame);
       the negative space between cells is left to whatever lies below. */
    if(g.getAttribute('data-q')==='month' || g.getAttribute('data-q')==='sixweek') return;
    if(g.querySelector(':scope > rect.hit')) return;
    let bb; try{ bb=g.getBBox(); }catch(e){ return; }
    if(!bb || !bb.width) return;
    const r=document.createElementNS('http://www.w3.org/2000/svg','rect');
    r.setAttribute('class','hit');
    r.setAttribute('x',bb.x.toFixed(1)); r.setAttribute('y',bb.y.toFixed(1));
    r.setAttribute('width',bb.width.toFixed(1)); r.setAttribute('height',bb.height.toFixed(1));
    r.setAttribute('fill','transparent');
    g.insertBefore(r, g.firstChild);
  });
}
/* First-appearance entry: the first time a tool's layer is present in a freshly
   painted poster, tag it .enter so its CSS entrance runs once. Any later render of
   the same tool (a slider drag rebuilding the SVG, a format morph painting the
   other ply) finds its id already in `entered` and stays silent — the entrance
   never re-fires until resetAll() clears the set. Runs after innerHTML so the
   class lands on the live elements. */
const entered=new Set();
function markEntries(ply){
  if(!ply) return;
  ply.querySelectorAll('.hl[data-q]').forEach(g=>{
    const q=g.getAttribute('data-q');
    if(entered.has(q)) return;
    /* month draws NOTHING until its font resolves (monthLayer returns '' while
       loading), then asks for one redraw. Tagging the empty not-ready render
       would burn the one-shot on a blank group, so the real silhouette would
       land already-entered and never animate. Wait for the font-ready render. */
    if(q==='month' && monthFontState!=='ready') return;
    entered.add(q);
    g.classList.add('enter');
  });
}
/* ---------- the snake's morph ----------
   The snake is the one layer that keeps a life of its own between renders. On its
   FIRST appearance the CSS entrance (.enter) unspools it; after that, whenever the
   February-length answer changes the bead COUNT, we GLIDE the beads from the old
   layout to the new one instead of cutting. The body is a metaball chain, so the
   bridges have to be rebuilt every frame from the moving beads — which is why a morph
   frame re-emits only this one small group (snakeEmit), never the whole poster. New
   tail beads are born at the tail tip (r:0 -> full); dropped beads retract into it. */
let snakeState=null;   // the settled (target) layout the static paint drew
let snakeLive=null;    // what is actually on screen right now (lags the target mid-morph)
let snakeRAF=0;
function cancelSnakeMorph(){ if(snakeRAF){ cancelAnimationFrame(snakeRAF); snakeRAF=0; } }
function startSnakeMorph(g, from, to){
  cancelSnakeMorph();
  g.classList.remove('enter');                 // the one-shot entrance must not re-fire on morph frames
  const fromMap=new Map(from.beads.map(b=>[b.index,b]));
  const toMap  =new Map(to.beads.map(b=>[b.index,b]));
  const fTail=from.beads[from.beads.length-1], tTail=to.beads[to.beads.length-1];
  const idx=[...new Set([...fromMap.keys(),...toMap.keys()])].sort((a,b)=>a-b);
  const specs=idx.map(i=>{
    const a=fromMap.get(i), b=toMap.get(i);
    if(a&&b) return {index:i, sx:a.x,sy:a.y,sr:a.r, ex:b.x,ey:b.y,er:b.r};   // shared bead: glide across
    if(b)    return {index:i, sx:fTail.x,sy:fTail.y,sr:0, ex:b.x,ey:b.y,er:b.r};  // new: born at the tail tip
    return   {index:i, sx:a.x,sy:a.y,sr:a.r, ex:tTail.x,ey:tTail.y,er:0};         // dropped: retract into the tail
  });
  const dur=520, ease=t=> 1-Math.pow(1-t,3);   // easeOutCubic (matches the CSS --eo)
  const swF=from.sw, swT=to.sw, KF=from.K, KT=to.K, merge=to.merge, t0=performance.now();
  const step=(now)=>{
    if(!g.isConnected){ snakeRAF=0; return; }   // a full repaint replaced the group; let the static one stand
    let p=(now-t0)/dur; if(p>1)p=1; const e=ease(p);
    const full=specs.map(s=>({index:s.index, x:s.sx+(s.ex-s.sx)*e, y:s.sy+(s.ey-s.sy)*e, r:Math.max(0,s.sr+(s.er-s.sr)*e)}));
    const sw=swF+(swT-swF)*e, K=KF+(KT-KF)*e;
    snakeLive={beads:full, sw, merge, K};
    g.innerHTML=inkedMarkup(snakeEmit(full.filter(b=>b.r>0.01), sw, merge, K));   // a bead is invisible until it has grown a little
    if(p<1){ snakeRAF=requestAnimationFrame(step); }
    else { snakeRAF=0; snakeLive=to; g.innerHTML=inkedMarkup(snakeEmit(to.beads,to.sw,to.merge,to.K)); addHitRects(plys[livePly]); }
  };
  step(t0);   // render frame 0 (the old layout) synchronously, so the static new snake never flashes first
}
/* Decide, after each real repaint, whether the snake should morph. Runs off the
   layout the paint just drew (recomputed, cheap — only fires on genuine repaints). */
function syncSnake(){
  const g=plys[livePly].querySelector('.hl[data-q="febdays"]');
  if(!g){ cancelSnakeMorph(); snakeState=snakeLive=null; return; }
  const nl=snakeBeads(box(), PAPER);
  if(!nl){ cancelSnakeMorph(); snakeState=snakeLive=null; return; }
  const prev=snakeState;
  // first-ever appearance, or the CSS entrance is on this group: let that play, just record
  if(!prev || g.classList.contains('enter')){ snakeState=nl; snakeLive=nl; return; }
  const from=snakeRAF ? snakeLive : prev;      // interrupt a running morph from its current on-screen state
  snakeState=nl;
  if(!snakeRAF && from.beads.length===nl.beads.length){ snakeLive=nl; return; }   // idle & unchanged count -> nothing to glide
  if(reduceMotion()){ cancelSnakeMorph(); snakeLive=nl; return; }                 // static swap already painted
  startSnakeMorph(g, from, nl);
}

/* ---------- the node's morph ----------
   Unlike the snake, the node RE-SCATTERS every ray angle when the alarm count changes
   (the geometry is seeded on the count). So the morph glides ALL ray tips from the old
   scatter to the new one; a gained ray is born at the centre (its tip grows out of
   cx,cy) and a lost one retracts into it. A ray is always centre->tip, so moving the
   tip in a straight line reads as a smooth sweep. Only this one small group is
   re-emitted per frame — the poster is never touched. */
let nodeState=null, nodeLive=null, nodeRAF=0;
function cancelNodeMorph(){ if(nodeRAF){ cancelAnimationFrame(nodeRAF); nodeRAF=0; } }
function startNodeMorph(g, from, to){
  cancelNodeMorph();
  g.classList.remove('enter');
  const n=Math.max(from.ends.length, to.ends.length);
  const specs=[];
  for(let i=0;i<n;i++){
    const a=from.ends[i], b=to.ends[i];
    specs.push({sx:a?a[0]:to.cx, sy:a?a[1]:to.cy, ex:b?b[0]:to.cx, ey:b?b[1]:to.cy});
  }
  const dur=520, ease=t=> 1-Math.pow(1-t,3), t0=performance.now();   // easeOutCubic (matches the CSS --eo)
  const step=(now)=>{
    if(!g.isConnected){ nodeRAF=0; return; }
    let p=(now-t0)/dur; if(p>1)p=1; const e=ease(p);
    const ends=specs.map(s=>[s.sx+(s.ex-s.sx)*e, s.sy+(s.ey-s.sy)*e]);
    nodeLive={...to, ends};
    g.innerHTML=inkedMarkup(nodeEmit(nodeLive));
    if(p<1){ nodeRAF=requestAnimationFrame(step); }
    else { nodeRAF=0; nodeLive=to; g.innerHTML=inkedMarkup(nodeEmit(to)); addHitRects(plys[livePly]); }
  };
  step(t0);   // render frame 0 (old scatter) synchronously, so the new static node never flashes first
}
function syncNode(){
  const g=plys[livePly].querySelector('.hl[data-q="alarms"]');
  if(!g){ cancelNodeMorph(); nodeState=nodeLive=null; return; }
  const nl=nodeRays(box(), PAPER);
  const prev=nodeState;
  if(!prev || g.classList.contains('enter')){ nodeState=nl; nodeLive=nl; return; }   // first appearance / entrance owns it
  const from=nodeRAF ? nodeLive : prev;
  nodeState=nl;
  if(!nodeRAF && from.ends.length===nl.ends.length){ nodeLive=nl; return; }   // same ray count -> instant (re-roll etc.)
  if(reduceMotion()){ cancelNodeMorph(); nodeLive=nl; return; }
  startNodeMorph(g, from, nl);
}
/* ---------- the ring block's morph ----------
   The block is one ring per memory, and EVERY radius moves when the count does
   (a ring's radius is a function of its index over the count). But the geometry
   holds one invariant: every ring passes through the tangent point, and its
   centre is that point minus r along the lean. So a ring at radius r is exactly
   the settled ring SCALED by r/r_settled about the tangent point — which means
   the morph never has to redraw a thing. It emits the settled stack once and
   then animates one transform per ring group.

   That is not just cheaper, it is the only version that is right about SHAPE.
   Gliding radii and re-tessellating would leave every ring's elements at their
   settled size — the fifth ring's blocks are 2.4x their dot size and don't depend
   on r at all, so a ring being born would appear full-blown as a clot of blocks
   and only then spread into a ring. Scaling the whole group takes the blocks, the
   halftone dots and the Riso grain with it, so a ring gained grows out of the
   tangent point as ITSELF, and a ring lost shrinks back into it the same way. */
let ringsState=null, ringsLive=null, ringsRAF=0;
function cancelRingsMorph(){ if(ringsRAF){ cancelAnimationFrame(ringsRAF); ringsRAF=0; } }
/* the transform that puts a settled ring at scale s about the tangent point */
const ringScaleAt=(g,s)=>'translate('+g.bx.toFixed(2)+' '+g.by.toFixed(2)+') scale('
  + s.toFixed(5)+') translate('+(-g.bx).toFixed(2)+' '+(-g.by).toFixed(2)+')';
function startRingsMorph(gEl, from, to){
  cancelRingsMorph();
  gEl.classList.remove('enter');              // the one-shot entrance must not re-fire on morph frames
  const stack=gEl.querySelector('.rstack');
  if(!stack){ ringsLive=to; return; }
  /* What to DRAW: every ring the new count wants, at its new radius, plus any ring
     the old count had beyond that — kept at its old radius so it has something to
     shrink from. Dropped rings are the innermost ones, so they land last in the
     markup and stay on top, which is where inner rings belong. */
  const n=Math.max(from.radii.length, to.radii.length);
  const drawn=[], specs=[];
  for(let i=0;i<n;i++){
    const rf=from.radii[i]||0, rt=to.radii[i]||0;
    const rd=rt||rf;                          // dropped rings are drawn at the size they leave from
    drawn.push(rd);
    specs.push({from:rf/rd, to:rt?1:0});      // gained: 0 -> 1. dropped: 1 -> 0. kept: rf/rt -> 1.
  }
  stack.innerHTML=inkedMarkup(ringsStack(to, drawn));
  const els=[...stack.querySelectorAll('.rring')];
  const put=e=>{ els.forEach((el,k)=>{
    const sp=specs[k]; const s=sp.from+(sp.to-sp.from)*e;
    el.setAttribute('transform', ringScaleAt(to, Math.max(0,s)));
  }); };
  const dur=560, ease=t=> 1-Math.pow(1-t,3), t0=performance.now();   // easeOutCubic (matches the CSS --eo)
  const step=(now)=>{
    if(!stack.isConnected){ ringsRAF=0; return; }   // a full repaint replaced the group; let the static one stand
    let p=(now-t0)/dur; if(p>1)p=1; const e=ease(p);
    put(e);
    ringsLive={...to, radii:specs.map((sp,k)=>drawn[k]*(sp.from+(sp.to-sp.from)*e)).filter(r=>r>0.5)};
    if(p<1){ ringsRAF=requestAnimationFrame(step); }
    else {
      ringsRAF=0; ringsLive=to;
      stack.innerHTML=inkedMarkup(ringsStack(to, to.radii));   // drop the dropped rings and every leftover transform
      addHitRects(plys[livePly]);
    }
  };
  step(t0);   // render frame 0 (the old sizes) synchronously, so the new static stack never flashes first
}
function syncRings(){
  const gEl=plys[livePly].querySelector('.hl[data-q="vacations"]');
  if(!gEl){ cancelRingsMorph(); ringsState=ringsLive=null; return; }
  const nl=ringsGeom(box());
  const prev=ringsState;
  if(!prev || gEl.classList.contains('enter')){ ringsState=ringsLive=nl; return; }   // first appearance / entrance owns it
  const from=ringsRAF ? ringsLive : prev;     // interrupt a running morph from its current on-screen state
  ringsState=nl;
  if(!ringsRAF && from.radii.length===nl.radii.length){ ringsLive=nl; return; }   // idle & same count (a re-roll, a format morph) -> nothing to glide
  if(reduceMotion()){ cancelRingsMorph(); ringsLive=nl; return; }                 // static swap already painted
  startRingsMorph(gEl, from, nl);
}
/* The base grid's morph-on-change. The CSS entrance owns the very first
   appearance (spread from centre); after that, when the shape or the density
   count changes, the freshly painted (denser) grid is pushed out from the
   centre again, so it reads as multiplying out of the middle. */
let baseGridSig=null, baseGridCount=0;
function syncBaseGrid(){
  const gEl=plys[livePly].querySelector('.hl[data-q="basegrid"]');
  if(!gEl){ baseGridSig=null; baseGridCount=0; return; }
  const isRings=ans('shape')==='circle';
  const inner=gEl.querySelector('g')||gEl;                  // ghosts inherit stroke from the inner group
  const els=[...gEl.querySelectorAll(isRings?'circle':'line')].filter(e=>!e.dataset.gtmp);
  const sig=ans('shape')+':'+(isChosen('density')?ans('density'):'default');
  const prevSig=baseGridSig, oldN=baseGridCount;
  baseGridSig=sig; baseGridCount=els.length;
  if(gEl.classList.contains('enter')) return;              // first appearance owns it (CSS gridGrow)
  if(prevSig===null || prevSig===sig) return;              // nothing changed (a re-roll, a format morph)
  const prevShape=prevSig.split(':')[0];
  if(prevShape!==ans('shape')) return;                     // shape swap: different geometry, no line-diff
  if(reduceMotion() || !oldN || !els.length) return;
  const newN=els.length;
  const SVGNS='http://www.w3.org/2000/svg', EASE='cubic-bezier(.33,1,.68,1)';
  const cx=parseFloat(els[0].getAttribute(isRings?'cx':'x1'));
  const cy=parseFloat(els[0].getAttribute(isRings?'cy':'y1'));
  const maxR=isRings
    ? Math.max(...els.map(c=>parseFloat(c.getAttribute('r'))))
    : Math.hypot(parseFloat(els[0].getAttribute('x2'))-cx, parseFloat(els[0].getAttribute('y2'))-cy);
  const originPx=cx+'px '+cy+'px';
  if(newN>oldN){
    /* DENSER: a line at index k coincides with an old one when (k*oldN)%newN===0
       — those hold still; every other line is NEW and grows out from the centre,
       so density is ADDED from the middle rather than the grid regenerating. */
    els.forEach((el,k)=>{
      const idx=isRings?k+1:k;
      if((idx*oldN)%newN===0) return;
      el.style.transformBox='view-box'; el.style.transformOrigin=originPx;
      const delay=isRings?(parseFloat(el.getAttribute('r'))/maxR)*260:(k/newN)*180;
      el.animate([{transform:'scale(0)'},{transform:'scale(1)'}],
                 {duration:460, delay, easing:EASE, fill:'backwards'});
    });
  } else if(newN<oldN){
    /* SPARSER (the reverse): survivors hold still; the OLD lines that are gone are
       rebuilt as ghosts and retract INTO the centre, then removed. */
    for(let i=(isRings?1:0); i<(isRings?oldN+1:oldN); i++){
      if((i*newN)%oldN===0) continue;                      // this old line survives -> already static in the new grid
      let el;
      if(isRings){
        el=document.createElementNS(SVGNS,'circle');
        el.setAttribute('cx',cx); el.setAttribute('cy',cy); el.setAttribute('r',(maxR*i/oldN).toFixed(2));
      } else {
        const a=i*2*Math.PI/oldN;
        el=document.createElementNS(SVGNS,'line');
        el.setAttribute('x1',cx); el.setAttribute('y1',cy);
        el.setAttribute('x2',(cx+maxR*Math.cos(a)).toFixed(2)); el.setAttribute('y2',(cy+maxR*Math.sin(a)).toFixed(2));
      }
      el.dataset.gtmp='1'; el.setAttribute('fill','none');
      inner.appendChild(el);
      el.style.transformBox='view-box'; el.style.transformOrigin=originPx;
      const delay=isRings?(1-i/oldN)*220:0;                // outer rings collapse first, rippling inward
      const anim=el.animate([{transform:'scale(1)'},{transform:'scale(0)'}],
                            {duration:420, delay, easing:EASE, fill:'forwards'});
      const clean=()=>el.remove();
      anim.onfinish=clean; setTimeout(clean, delay+420+300);   // fallback if the tab paused the animation

    }
  }
}
function paint(){
  const svg=buildSVG();
  if(svg===lastMarkup[livePly]) return;
  lastMarkup[livePly]=svg;
  plys[livePly].innerHTML=svg;
  addHitRects(plys[livePly]);
  markEntries(plys[livePly]);
  syncSnake();
  syncNode();
  syncRings();
  syncBaseGrid();
}
function draw(){
  if(rafId) return;
  rafId=requestAnimationFrame(()=>{ rafId=null; paint(); paintLogo(); });
}
function drawNow(){
  if(rafId){ cancelAnimationFrame(rafId); rafId=null; }
  paint(); paintLogo();
}

/* Dissolve the whole sheet from its current inks to whatever buildSVG paints now
   — used for the colourway swap so the poster's two colours trade places with a
   soft crossfade instead of a hard cut. Same two-ply move as a format change, but
   no geometry morph: the swapped render fades in ON TOP of the old, which stays
   opaque underneath, so the board never shows through. */
function crossfadePoster(){
  const from=livePly, to=1-livePly;
  lastMarkup[to]=buildSVG();
  plys[to].innerHTML=lastMarkup[to];
  plys[to].style.zIndex=2; plys[from].style.zIndex=1;
  plys[from].classList.add('live');           // old holds full opacity beneath
  plys[to].classList.remove('live');
  plys[to].style.transition='none'; void plys[to].offsetWidth; plys[to].style.transition='';
  plys[to].classList.add('live');             // new fades in over it
  livePly=to;
  addHitRects(plys[to]);
  paintLogo();
}

function newSeed(){
  S.seed=(Math.random()*0xFFFFFFFF)>>>0;
  smokeCache={key:'',cells:[]};
  ASKED=pickQuestions(S.seed);
}

/* ---------- reset ---------- */
function resetAll(){
  S.answers={}; S.reached={}; S.done={}; S.touched={}; S.skipped={}; S.rolls={}; lastSig='';
  entered.clear();                            // re-arm every tool's first-appearance entrance
  cancelSnakeMorph(); snakeState=snakeLive=null;   // drop any in-flight snake glide
  cancelNodeMorph(); nodeState=nodeLive=null;      // and any in-flight node glide
  cancelRingsMorph(); ringsState=ringsLive=null;   // and any in-flight ring glide
  stopMonthGrow(); snakeAt=null;            // no frame ticking, no revisit held open
  Object.assign(S,PROFILE_DEFAULTS);          // includes baseDone:false — starts over for real
  openQ=null; pinnedQ=null; finished=false; introOpen=false; cardBox=null;
  clearTimeout(aimGuide.t); guideFrom=null; guideTo=[];   // no line left pointing
  lastMarkup=['',''];                                     // force a repaint
  card.classList.remove('open');
  card.setAttribute('aria-hidden','true');
  newSeed();
  buildLogo();                // a fresh composition, and the R cell back to red
  relayout();
  showIntro();
}
resetBtn.addEventListener('click',resetAll);
mkBtn.addEventListener('click',showFinish);

/* ---------------------------------------------------------------------
   Making the board feel physical: the world pans and tilts a little with
   the pointer, so moving right reveals more space on the right. The status
   strip and reset sit outside the world and never move; the KAIRO mark is
   inside it, so it travels with the grid and stays flush to the cells.
   Motion is eased toward its target rather than snapped, and it freezes
   while a card is open so the controls stay still under the cursor.
   --------------------------------------------------------------------- */
const MOTION = {
  pan: 1.5,        // how many grid cells the world may slide each way
  tilt: 1.15,      // degrees of rotation each way
  ease: 0.075      // 0 = never arrives, 1 = snaps
};
const world=document.getElementById('world');
const still=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let aimX=0, aimY=0, curX=0, curY=0, follow=true, motionRAF=null;

function pointerAim(e){
  if(!follow) return;
  aimX=(e.clientX/window.innerWidth)*2-1;      // -1 .. 1
  aimY=(e.clientY/window.innerHeight)*2-1;
  if(!motionRAF) motionRAF=requestAnimationFrame(driftWorld);
}
function driftWorld(){
  motionRAF=null;
  curX+=(aimX-curX)*MOTION.ease;
  curY+=(aimY-curY)*MOTION.ease;
  /* the real cell, not the sheet's width over a magic 18 — that number was an
     approximation of the old format's column count and would now be wrong */
  const cell=cellSize() || 24;
  const dx=-curX*MOTION.pan*cell;               // pointer right -> world slides left
  const dy=-curY*MOTION.pan*cell;
  world.style.transform=
    'translate3d('+dx.toFixed(2)+'px,'+dy.toFixed(2)+'px,0)'+
    ' rotateY('+(curX*MOTION.tilt).toFixed(3)+'deg)'+
    ' rotateX('+(-curY*MOTION.tilt).toFixed(3)+'deg)';
  if(Math.abs(aimX-curX)>0.0005||Math.abs(aimY-curY)>0.0005)
    motionRAF=requestAnimationFrame(driftWorld);
}
/* STATIC VIEW: the board no longer drifts with the pointer — it stays centred and
   perfectly still. Flip STATIC_VIEW to false to bring the parallax back. */
const STATIC_VIEW=true;
if(!still && !STATIC_VIEW){
  window.addEventListener('pointermove',pointerAim,{passive:true});
  window.addEventListener('pointerleave',()=>{ if(follow){ aimX=aimY=0;
    if(!motionRAF) motionRAF=requestAnimationFrame(driftWorld); } });
}
if(STATIC_VIEW){ follow=false; curX=curY=aimX=aimY=0; world.style.transform='none'; }
/* Hold the board still while a question is open. Clearing `follow` alone is not
   enough: the easing would keep travelling toward the last aim. Park the target
   on the current value so it stops exactly where it stands. */
const holdWorld=on=>{
  follow=!on;
  if(on){ aimX=curX; aimY=curY; }
};

/* =====================================================================
   FORMAT — the shape of the poster

   changeFormat is the only way in, and it does one thing: it hands CSS two
   numbers. The sheet's box and its four bounding lines are both derived from
   those two numbers, so one transition carries them across together and they
   cannot fall out of step.

   Everything else on screen is deliberately NOT derived from them. The grid is
   a function of the viewport alone, the corner chrome is snapped to the grid,
   and the dots are placed clear of every format's footprint at once. So a
   format change moves exactly two things — the four edges of the sheet, and
   the artwork inside them — over an interface that stays completely still.
   That is the whole design, and it is why this function is short.
   ===================================================================== */
const MORPH_MS=620;
let morphTimer=null;

/* The sheet's box, in pixels, SNAPPED to the grid.
   Not centred arithmetically: the left edge is placed a whole number of cells
   from the origin, so all four edges land on grid lines whether the format has
   an even or an odd number of cells. An odd count therefore sits half a cell
   off centre — about ten pixels, invisible — and in exchange the grid keeps
   bounding the sheet exactly, which is the thing you can actually see. */
function syncSheet(){
  const F=FMT(), c=cellSize(), o=gridOrigin(), S2=sheetCols(F);
  root.style.setProperty('--sheet-w', F.cols*c+'px');
  root.style.setProperty('--sheet-h', F.rows*c+'px');
  root.style.setProperty('--sheet-x', (o.x+S2.left*c)+'px');
  root.style.setProperty('--sheet-y', (o.y+S2.top*c)+'px');
}
/* the format's own outline, fitted inside a cap x cap box */
const glyph=(F,cap)=>{
  const s=cap/Math.max(F.cols,F.rows);
  return 'width:'+Math.round(F.cols*s)+'px;height:'+Math.round(F.rows*s)+'px';
};

function buildFmtControl(){
  fmtBtn.innerHTML='<i></i><b></b>';
  fmtMenu.innerHTML=FORMATS.map(F=>
    '<button type="button" role="menuitemradio" data-fmt="'+F.id+'" aria-checked="false">'
    + '<span class="gbox"><i style="'+glyph(F,18)+'"></i></span>'
    + '<span class="lbl">'+F.label+'<span class="use">'+F.use+'</span></span>'
    + '<span class="rat">'+F.ratio+'</span></button>').join('');
}
/* The glyph is resized rather than replaced, so its own 620ms transition runs
   and the control arrives at the new shape alongside the poster. */
function syncFmtControl(){
  const F=FMT(), i=fmtBtn.querySelector('i');
  i.style.cssText=glyph(F, Math.max(13, Math.min(21, FMT_CELLS*cellSize()*0.44)));
  fmtBtn.querySelector('b').textContent=F.ratio;
  fmtBtn.setAttribute('aria-label','Poster format: '+F.label+' '+F.ratio);
  for(const b of fmtMenu.querySelectorAll('button[data-fmt]'))
    b.setAttribute('aria-checked', String(b.dataset.fmt===S.format));
}

const fmtOpen=()=>fmtMenu.classList.contains('open');
function openFmtMenu(){
  /* the display:none takes care of a real pointer, which can never reach an
     element with no box — this guard is for anything that calls the function
     directly, so "disabled" holds even past the click handler that normally
     gates it */
  if(!CONFIG.FORMAT_SWITCHER) return;
  fmtMenu.classList.add('open');
  fmtBtn.setAttribute('aria-expanded','true');
  holdWorld(true);                       // the board holds still under the menu
  const first=fmtMenu.querySelector('button[aria-checked=true]')||fmtMenu.querySelector('button');
  if(first) setTimeout(()=>first.focus(),40);
}
function closeFmtMenu(back){
  if(!fmtOpen()) return;
  fmtMenu.classList.remove('open');
  fmtBtn.setAttribute('aria-expanded','false');
  if(!openQ && !finished) holdWorld(false);   // never unfreeze under an open card
  if(back) fmtBtn.focus();
}

function changeFormat(id){
  if(!FMTS[id] || id===S.format) return;
  S.format=id;

  /* The incoming poster goes into the idle layer at its own viewBox and fades
     in ON TOP of the outgoing one, which keeps full opacity underneath until
     it is completely covered. See the .ply comment: fading both at once would
     let the board show through the pair and dim the poster mid-change. */
  const from=livePly, to=1-livePly;
  lastMarkup[to]=buildSVG();              // keep paint()'s cache honest
  plys[to].innerHTML=lastMarkup[to];
  plys[to].style.zIndex=2;
  plys[from].style.zIndex=1;
  plys[from].classList.add('live');       // stays opaque underneath

  /* Reset the incoming layer to fully transparent with the transition
     suppressed for one frame, so a rapid second change — before the previous
     one has finished tidying up — still starts from zero and dissolves. Adding
     the class to a layer that already had it would be a no-op, and the swap
     would land as a hard cut. */
  plys[to].classList.remove('live');
  plys[to].style.transition='none';
  void plys[to].offsetWidth;
  plys[to].style.transition='';
  plys[to].classList.add('live');
  livePly=to;

  /* .morphing arms the transitions, then the new geometry goes in. The class
     has to be on before the lengths change, or there is nothing to interpolate
     from. Nothing else on the board is derived from the sheet's box, so
     nothing else moves. */
  world.classList.add('morphing');
  syncSheet();
  syncFmtControl();
  submit('partial');                      // the format is part of the record

  /* The one loose end: an open card prefers to sit clear of the sheet, and the
     sheet has just changed shape under it. Re-place it once the edges have
     arrived rather than chase them — the card is pinned to a dot that has not
     moved, so it stays put and correct throughout. */
  clearTimeout(morphTimer);
  morphTimer=setTimeout(()=>{
    morphTimer=null;
    world.classList.remove('morphing');   // resizes go back to being instant
    /* the incoming layer now covers it completely, so dropping the outgoing one
       is invisible — and it has to be dropped, or the next change would find
       both layers opaque and cut instead of dissolving */
    plys[1-livePly].classList.remove('live');
    if(pinnedQ||finished) placeCard();
    renderDots();                         // only to re-check what the card buries
  }, MORPH_MS+40);
}

fmtBtn.addEventListener('click',e=>{
  e.stopPropagation();
  fmtOpen() ? closeFmtMenu() : openFmtMenu();
});
fmtMenu.addEventListener('click',e=>{
  const b=e.target.closest('button[data-fmt]');
  if(!b) return;
  closeFmtMenu(true);
  changeFormat(b.dataset.fmt);
});
/* a click anywhere else shuts the menu, but must not also count as a click on
   the board behind it */
document.addEventListener('click',e=>{
  if(fmtOpen() && !fmtMenu.contains(e.target) && e.target!==fmtBtn) closeFmtMenu();
});
fmtMenu.addEventListener('keydown',e=>{
  const items=[...fmtMenu.querySelectorAll('button[data-fmt]')];
  const at=items.indexOf(document.activeElement);
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    const n=(at+(e.key==='ArrowDown'?1:items.length-1)+items.length)%items.length;
    items[n].focus();
  }
});

/* ---------- wiring ---------- */
function relayout(){
  syncCell();                 // first: everything below is measured in cells
  syncSheet();
  placeChrome();
  placeLogo();                // before computeDots: the mark's box is reserved
  if(CONFIG.FORMAT_SWITCHER) syncFmtControl();
  computeDots();
  if(pinnedQ||finished) placeCard();
  renderDots(); renderStatus(); draw();
}

/* DEV ONLY — jump straight to the last question (colour) so it can be tested
   without answering the whole flow. Not part of the real experience: set
   DEV_SKIP=false (or delete this block) before shipping. */
const DEV_SKIP=true;
function devSkipToLast(){
  if(!S.baseDone) finishBase();                 // dismiss the opening screen
  const last='colorway';
  ASKED.forEach(q=>{
    if(q.id===last) return;
    if(S.answers[q.id]===undefined) S.answers[q.id]=(q.default!==undefined)?q.default:(q.options?q.options[0]:1);
    S.touched[q.id]=true; S.done[q.id]=true; S.reached[q.id]=true;
  });
  S.done[last]=false; S.skipped[last]=false; S.reached[last]=true;
  snakeAt=null;                                  // flow points at the first unanswered = colour
  renderSnake(); draw();
}
if(DEV_SKIP){
  const b=document.createElement('button');
  b.textContent='→ last question (dev)';
  b.style.cssText='position:fixed;left:10px;bottom:10px;z-index:9999;font:11px/1 ui-monospace,monospace;'
    +'padding:6px 9px;background:#111;color:#fff;border:0;border-radius:4px;cursor:pointer;opacity:.55';
  b.addEventListener('mouseenter',()=>b.style.opacity='1');
  b.addEventListener('mouseleave',()=>b.style.opacity='.55');
  b.addEventListener('click',devSkipToLast);
  document.body.appendChild(b);

  /* DEV ONLY — Karin's tuning panel for the sixweek lattice: blend mode and
     opacity, live on the poster. Writes LATTICE_STYLE and repaints; whatever
     is dialled in here is what buildSVG emits, so the export carries it too.
     Once a pair is chosen, bake it into LATTICE_STYLE's defaults and this
     panel (with DEV_SKIP) never ships. */
  const panel=document.createElement('div');
  panel.style.cssText='position:fixed;left:10px;bottom:44px;z-index:9999;display:flex;gap:8px;'
    +'align-items:center;font:11px/1 ui-monospace,monospace;padding:6px 9px;background:#111;'
    +'color:#fff;border-radius:4px;opacity:.55';
  panel.addEventListener('mouseenter',()=>panel.style.opacity='1');
  panel.addEventListener('mouseleave',()=>panel.style.opacity='.55');
  const sel=document.createElement('select');
  ['normal','multiply','screen','overlay','darken','lighten','color-burn','color-dodge',
   'hard-light','soft-light','difference','exclusion','hue','saturation','color','luminosity']
    .forEach(m=>{ const o=document.createElement('option'); o.value=m; o.textContent=m; sel.appendChild(o); });
  sel.value=LATTICE_STYLE.blend;
  sel.style.cssText='font:inherit;background:#222;color:#fff;border:1px solid #444;border-radius:3px';
  const rng=document.createElement('input');
  rng.type='range'; rng.min='0'; rng.max='1'; rng.step='0.05'; rng.value=String(LATTICE_STYLE.opacity);
  rng.style.width='90px';
  const read=document.createElement('span');
  const label=document.createElement('span'); label.textContent='lattice';
  const show=()=>{ read.textContent=Math.round(LATTICE_STYLE.opacity*100)+'%'; };
  sel.addEventListener('input',()=>{ LATTICE_STYLE.blend=sel.value; draw(); });
  rng.addEventListener('input',()=>{ LATTICE_STYLE.opacity=+rng.value; show(); draw(); });
  show();
  panel.append(label,sel,rng,read);
  document.body.appendChild(panel);
}

/* ---------- HOVER NOTES (test: month) ----------
   Hovering an answered poster layer lights it and drops a personal, informal line
   in the free band to the RIGHT of the sheet. Copy is written here, per question,
   from the answer plus what the profile already knows. */
/* Short, human reads — a line about the PERSON their answer implies, not a recap of
   the answer. Kept to two short lines; no hedging, no "based on your choice". */
const MONTH_READ={
  January:"You settle when it’s properly cold. Sharp, fresh air suits you more than warmth ever will.",
  February:"Cold and quiet is your comfort. You’re not waiting for spring. You’re fine right here in the grey.",
  March:"You like it cool, with change on the way. Not warm yet, and that’s the point.",
  April:"Mild is your sweet spot. Warm enough to be out, cool enough to still think straight.",
  May:"You want warmth without the weight: soft air, long light, nothing you have to brace for.",
  June:"You come alive as it warms up. Real heat, but before summer turns heavy.",
  July:"Heat wakes you up instead of wearing you down. The warmer it gets, the more you.",
  August:"You’re built for the peak. Full heat, long days, the kind of warm most people hide from.",
  September:"You like heat on its way out: still warm, with the first cool edge you can feel.",
  October:"Crisp and mild is your weather. Cool enough to think, warm enough to keep moving.",
  November:"You’re easy in the cooling grey. Bare and quiet is where you actually relax.",
  December:"You’re most yourself when it’s cool. A short, grey, quiet day over a bright loud one, any time."
};
/* one line per POSSIBLE answer — no two choices share a read */
