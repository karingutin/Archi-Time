<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Architecture of Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>







  :root{
    /* interface — fixed, never touched by answers */
    /* The board's ground. Off-white, not white: pure white would leave the
       question panel — which IS white — with nothing to sit on. */
    --ink:#ECECEC;
    /* THE INTERFACE PALETTE LIVES HERE AND NOWHERE ELSE.
       The opening screen used to declare its own inverted set, so changing the
       board's colour left it behind. It now inherits every one of these, which
       is the rule from here on: change a colour once and the whole interface
       follows. Only .popup — the old floating card, no longer reached from the
       board — still carries its own, and it is on its way out. */
    --fg:#141414;                       /* interface ink */
    --dim:rgba(0,0,0,.50);              /* secondary ink */
    --line:rgba(0,0,0,.16);             /* hairlines */
    --surface:#ECECEC;                  /* what ink is set on */
    --accent:#141414;
    --picker:none;
    /* Measured off the question-system mock: #2F2F2F on black. Deliberately
       dimmer than the .20 white it was — the snake and its panel are what the
       eye should find on this ground, and a brighter lattice competed. */
    --gridline:#B7B7B7;   /* light grey, Karin 16 Aug — was #D7D4CC */
    --sheetline:rgba(0,0,0,.34);        /* the lines bounding the sheet: darker */
    --dot:#D6D6D6;

    /* THE QUESTION SYSTEM — every value measured off the mock.
       One family, three weights of the same red: the trail behind you, the
       step you are on, and the words themselves. */
    /* The Figma redesign takes the question system to black on white: the ink is
       pure black, an answered step greys back, the panel stays white. */
    --q-past:#D6D6D6;              /* a question already answered — greyed back */
    --q-now:#000000;               /* the step you are on, and SAVE — black */
    --q-panel:#FFFFFF;             /* the panel the question is set on */
    --q-text:#000000;              /* the question, and the chosen value — black */
    --q-face:var(--face);
    /* Answered questions. A light yellow rather than a dimmer white, so the
       three states of a question separate by HUE and not only by strength:
       white = still to do, yellow = settled. It is a pale relative of the
       poster's own morning yellow, which ties the board to the artwork. */
    --done:#F3E09B;

    /* GEOMETRY — and the one rule that matters here:
       THE GRID NEVER MOVES AND NEVER CHANGES SCALE.

       --cell and the two format numbers are all written by JS (cellSize and
       syncSheet); CSS only consumes them. One source of truth, so the pixel
       grid the dots are placed on and the pixel grid the background paints can
       never disagree.

       --cell is a function of the VIEWPORT alone. It does not know which
       format is showing, which is exactly why a format change leaves the grid,
       the dot field and the corner chrome untouched: the only thing that moves
       is the sheet, from one set of grid lines to another. */
    /* All five are written by JS — cellSize() and syncSheet(). CSS only
       consumes them. The sheet is SNAPPED to whole cells from the origin
       rather than centred arithmetically, which is what lets a format have an
       odd number of cells and still land all four edges on grid lines; an odd
       count then sits half a cell off centre, which nobody can see. */
    --cell:20px;
    --sheet-w:420px;
    --sheet-h:600px;
    --sheet-x:510px;
    --sheet-y:150px;
    --over:160px;                  /* world overscan, so panning never shows an edge */
    --morph:620ms;
    --ease:cubic-bezier(.66,0,.34,1);
    --eo:cubic-bezier(.33,1,.68,1);     /* easeOutCubic: the tool-layer entrances/morphs decelerate into rest */

    /* ONE FACE for the whole interface. The three roles stay as separate
       variables — display, ui, mono — because the code says which voice it is
       speaking in and that is worth keeping legible even when all three resolve
       to the same family. Only the POSTER still loads a face of its own
       (ThermoTrial-Zero, and only to be rasterised into a mask). */
    --face:'Wix Madefor Display',system-ui,sans-serif;
    --display:var(--face);
    --ui:var(--face);
    --mono:var(--face);
  }
  /* The month layer's letterforms. Loaded only to be RASTERISED into an
     offscreen mask that circles are packed into — no text is ever set in it on
     the page or on the poster, so nothing here reaches the printed sheet as
     type. If the fetch fails the mask falls back to the display serif and the
     silhouette simply comes out in different letter shapes (see monthLayer). */
  @font-face{
    font-family:'ThermoTrial-Zero';
    src:url('https://base44.app/api/apps/69cbcd44d3da2a5cef013f5e/files/mp/public/69cbcd44d3da2a5cef013f5e/0531d7dcf_font_font_mshiunpu.otf') format('opentype');
    font-weight:400; font-style:normal; font-display:swap;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;overflow:hidden}
  body{background:var(--ink);font-family:var(--ui);line-height:1.5;-webkit-font-smoothing:antialiased}

  /* the grid is the background of the whole interface. it is anchored to the
     sheet's top-left corner, so the sheet sits inside it rather than on it. */
  /* The stage. Holds the perspective; itself never moves. */
  .surface{position:fixed;inset:0;background-color:var(--ink);
           overflow:hidden;perspective:1500px;perspective-origin:50% 50%}

  /* The world: everything that belongs to the board. Panned and tilted as one
     piece, so the grid, the sheet and the dots can never drift apart.
     Oversized by --over on every side, so panning never exposes an edge. */
  /* NOT preserve-3d. Under preserve-3d the browser sorts these children by 3D
     depth and ignores z-index, which makes hit-testing pick the wrong layer at
     random. The world's own rotation still works because .surface holds the
     perspective; the children only need to stay flat. */
  .world{position:absolute;inset:calc(-1 * var(--over));z-index:1;
         transform-style:flat;will-change:transform}

  /* The grid runs unbroken to every edge — no mask, no fade. It covers the
     world including the overscan, so panning never reveals a bare corner.

     Anchored to the CENTRE of the viewport, not to the sheet's corner. That is
     the whole reason a format change leaves it untouched: a line falls exactly
     on the centre and repeats outward, and because every format is an even
     number of cells the centred sheet's four edges land on lines whatever
     format is showing. Anchoring to the sheet's corner would drag the entire
     grid sideways every time the poster changed shape. */
  .gridlayer{position:absolute;inset:0;z-index:0;
    background-image:
      linear-gradient(to right, var(--gridline) 0 1px, transparent 1px),
      linear-gradient(to bottom, var(--gridline) 0 1px, transparent 1px);
    background-size:var(--cell) var(--cell);
    background-position:calc(50vw + var(--over)) calc(50dvh + var(--over))}

  /* THE FOREGROUND GRID. Karin's rule, 16 Aug: the lattice should show THROUGH
     the question numbers and their panels — not just have them snapped to it,
     the lines themselves cross visibly over the white card — everywhere
     EXCEPT the poster itself, which must stay clean.

     Same pattern as .gridlayer (identical background-image/size/position, so
     the lines it draws are pixel-perfect continuations of the base grid, not
     a second misaligned lattice), but on top: z-index 6 clears #qsys (5), so
     every panel, hint, control and step number gets crossed by it, and ties
     with .dots-int (6) — later in the DOM here, so it wins that tie and also
     crosses the answered-question dots. It stays below #mkPoster (7),
     #status/#reset (8) and the format switcher (9), which were never part of
     this request, and, because .world itself is only one stacking level (1)
     against .surface's other children, it can never reach above them anyway.

     NOT a single full-screen layer with z-index: that would draw over the
     poster too, contradicting the one exception. Instead FOUR BANDS frame the
     sheet's live rect (--sheet-x/-y/-w/-h, already tracked by #frame and
     .sheet-lines) and physically stop at its edges — the poster is excluded by
     geometry, not by paint order, so it holds even while dragging a format
     morph. Each band carries the SAME viewport-anchored background-position
     as .gridlayer (vw/vh units, not the band's own box), so the four pick up
     the pattern exactly where the sheet interrupts it, with no seam. The top
     and bottom bands run the FULL width and own the corners; left and right
     only need to fill the sheet's own row between them. */
  .gridlayer-fg{position:absolute;pointer-events:none;z-index:6;
    background-image:
      linear-gradient(to right, var(--gridline) 0 1px, transparent 1px),
      linear-gradient(to bottom, var(--gridline) 0 1px, transparent 1px);
    background-size:var(--cell) var(--cell);
    background-position:calc(50vw + var(--over)) calc(50dvh + var(--over))}
  .gridlayer-fg.gfg-top{top:0;left:0;right:0;
    height:calc(var(--sheet-y) + var(--over))}
  .gridlayer-fg.gfg-bottom{left:0;right:0;bottom:0;
    top:calc(var(--sheet-y) + var(--sheet-h) + var(--over))}
  .gridlayer-fg.gfg-left{left:0;
    top:calc(var(--sheet-y) + var(--over)); height:var(--sheet-h);
    width:calc(var(--sheet-x) + var(--over))}
  .gridlayer-fg.gfg-right{right:0;
    top:calc(var(--sheet-y) + var(--over)); height:var(--sheet-h);
    left:calc(var(--sheet-x) + var(--sheet-w) + var(--over))}
  /* the bands resize on the SAME morph as #frame and .sheet-lines, so a format
     change never shows a stray gap or overlap at the sheet's edge mid-glide */
  .world.morphing .gridlayer-fg{
    transition:top var(--morph) var(--ease), left var(--morph) var(--ease),
               right var(--morph) var(--ease), bottom var(--morph) var(--ease),
               width var(--morph) var(--ease), height var(--morph) var(--ease)}

  /* Viewport-sized box inside the world, so every JS coordinate stays
     viewport-relative exactly as before. */
  /* No z-index: this must NOT become a stacking context, so its children can
     interleave with the sheet lines that sit on the world. */
  .stagebox{position:absolute;left:var(--over);top:var(--over);
            width:100vw;height:100dvh}

  /* Shading that belongs to the board: it sits above the grid but below the
     sheet and the card, so content never gets dimmed by it. */
  .vignette{position:absolute;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(ellipse 92% 92% at 50% 50%,
      transparent 70%, rgba(0,0,0,.22) 100%)}

  .dots{position:absolute;inset:0;pointer-events:none;z-index:4}
  /* This layer covers the whole screen and sits above the card, so it MUST be
     click-through. Only .qdot inside it takes pointer events. */
  .dots-int{position:absolute;inset:0;z-index:6;pointer-events:none}
  /* The dots do not move on a format change at all. They are placed clear of
     the LARGEST footprint any format can occupy, so no format can ever reach
     them — which is what makes the change seamless: only the sheet's four
     edges and the artwork move, over a grid and a dot field that hold still. */
  .dots svg,.dots-int svg{display:block;width:100%;height:100%}
  .dots-int svg{pointer-events:none}

  /* a question dot: ring = unanswered, disc = answered, pulse = do this next */
  .qdot{pointer-events:auto;cursor:pointer;outline:none}
  .qdot .hit{pointer-events:all}
  .qdot .hit{fill:transparent}
  /* THE CATALOGUE — three readings, and only three:
       still to do   white disc, large
       answered      light yellow disc, small
       skipped       light yellow ring, small, broken
     WHITE MEANS "STILL TO DO" and YELLOW MEANS SETTLED, so the states separate
     by hue first and weight second — and the boldest marks on the board are
     always the ones asking for something. On top of that sits the ORDER: radius
     and brightness both fall off with how far ahead of the cursor a question
     sits, so what is next is the biggest, brightest disc and the rest recede
     toward the grid. All of it is set per dot by renderDots. */
  /* r and opacity are NOT transitioned: they are re-derived from the live cell
     size on every frame of a format morph, and a transition would make each
     dot chase its own position a fifth of a second behind the grid. */
  .qdot .core{fill:none;stroke:#FFFFFF;stroke-width:1.2;
              transition:fill .2s ease,stroke .2s ease,stroke-width .15s ease}
  .qdot .core.filled{fill:#FFFFFF}
  /* answered: a small filled disc in the settled colour */
  .qdot .core.done{fill:var(--done);stroke:var(--done)}
  /* skipped: the same colour, but hollow and broken, so the board never claims
     an answer that was never given */
  .qdot .core.passed{fill:none;stroke:var(--done)}
  /* A ring that only shows on hover. Needed because the dots are now mostly
     filled, and thickening a white outline inside a white disc is invisible —
     the hover has to happen OUTSIDE the mark to be seen at all. */
  .qdot .hover{fill:none;stroke:#FFFFFF;stroke-width:1;opacity:0;
               transition:opacity .14s ease}
  .qdot:not(.locked):hover .hover,
  .qdot:focus-visible .hover{opacity:.75}
  .qdot:not(.locked):hover .core,
  .qdot:focus-visible .core{opacity:1}
  /* Locked dots do not answer the pointer AND say so: no hover ring, and the
     cursor stays a plain arrow. Previously they looked and felt identical to
     open ones right up until a click did nothing. */
  .qdot.locked{pointer-events:none;cursor:default}

  /* the mark that says where to begin — only while nothing has been answered */
  .startcue{font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;
            text-transform:uppercase;fill:rgba(255,255,255,.75)}
  /* The line that reaches from the question just answered toward the next one:
     a straight run between the two points, as the crow flies.

     The motion is meant to LEAD rather than announce. It fades up instead of
     switching on, extends on a strong ease-out so it decelerates into the dot
     it is pointing at, rests there long enough to be followed, then leaves
     slowly. Nothing in it snaps — an earlier version drew fast at full opacity
     and read as a flash, which pulled the eye instead of guiding it. */
  /* A WAKE, not a line being drawn.
     The stroke is one short dash in a very long gap, and what animates is the
     offset — so a segment of fixed length TRAVELS the whole curve and leaves at
     the far end. The full path is never visible at once, which is the
     difference between something moving across the board and something being
     drawn onto it. Same idea as a trim path chasing its own start.
     --o0 / --o1 are the two ends of that travel, worked out per curve in JS. */
  /* Two animations rather than one, on purpose: the travel needs a single
     unbroken ease from end to end, and mixing opacity keyframes into it would
     chop that curve into eased fragments and put a kink in the motion. So the
     offset animation holds exactly three keyframes — go, arrive, stay — and the
     fade rides alongside it on its own linear track. */
  /* A SHOOTING STAR.
     Away quickly, decelerating only slightly, and the tail is already
     dissipating before the head lands — so it arrives and is gone in the same
     motion. There is deliberately NO rest at the far end: an earlier version
     held the wake on the target for a beat, and a quarter second of a line
     sitting still next to a dot stops reading as something falling and starts
     reading as a pointer that has been left there. */
  .guide{fill:none;stroke:#FFFFFF;stroke-width:1.1;stroke-linecap:round;
         animation:trail 1150ms cubic-bezier(.12,.62,.3,1) forwards,
                   trailFade 1150ms linear forwards}
  /* the head reaches the target at 92% — it still genuinely arrives, see --o1 —
     and the last 8% is only there so it does not vanish mid-stride */
  @keyframes trail{
    0%  {stroke-dashoffset:var(--o0)}
    92% {stroke-dashoffset:var(--o1)}
    100%{stroke-dashoffset:var(--o1)}
  }
  /* fading from 58% means the streak is thinning out over the last third of its
     flight, which is what makes the arrival dissolve instead of stop */
  @keyframes trailFade{
    0%{opacity:0} 7%{opacity:.7} 58%{opacity:.7} 100%{opacity:0}
  }
  /* The same wake again, clipped to the sheet and a fraction of the weight. It
     has to cross the artwork whenever the two dots sit on opposite sides of it,
     and at full strength that reads as a scratch across the poster. Drawing it
     twice under opposite clips is what lets one gesture change weight partway
     along instead of becoming two — both copies share the timing exactly, so
     they travel as one. */
  .guide.under{animation-name:trail,trailFadeFaint}
  @keyframes trailFadeFaint{
    0%{opacity:0} 7%{opacity:.18} 58%{opacity:.18} 100%{opacity:0}
  }
  .qdot .halo{fill:none;stroke:rgba(255,255,255,.4);stroke-width:1}
  .qdot .pulse{fill:none;stroke:#FFFFFF;stroke-width:1.4;
               transform-box:fill-box;transform-origin:center;
               animation:ring 2.1s cubic-bezier(.2,.7,.3,1) infinite}
  @keyframes ring{0%{transform:scale(1);opacity:.7}70%{opacity:0}100%{transform:scale(3);opacity:0}}

  /* pointer-events off on the strip itself: it must never intercept a click
     meant for a card that happens to sit under it. Only its link takes them. */
  #status{display:none;pointer-events:none;position:absolute;left:max(16px, calc(1.6 * var(--cell)));bottom:max(14px, calc(1.3 * var(--cell)));z-index:8;
          font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
          color:rgba(0,0,0,.46)}
  .statline{display:flex;align-items:center;gap:12px}
  .sep{display:inline-block;width:14px;height:1px;background:rgba(0,0,0,.28)}
  .build{opacity:.4}
  .cue{animation:breathe 2.6s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
  #reset{position:absolute;right:max(16px, calc(1.6 * var(--cell)));bottom:max(14px, calc(1.3 * var(--cell)));z-index:8;
         font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
         background:transparent;border:0;padding:0 0 1px;cursor:pointer;
         color:rgba(0,0,0,.42);border-bottom:1px solid rgba(0,0,0,.22);
         transition:color .15s,border-color .15s}
  #reset:hover{color:#000;border-bottom-color:#000}
  #reset:disabled{opacity:.3;cursor:default;border-bottom-color:transparent}
  #reset:disabled:hover{color:rgba(0,0,0,.42)}

  /* Placeholder, snapped to grid lines by placeChrome(). Drop real content
     inside; sized to 3 x 3 grid cells. */
  .chrome{position:absolute;z-index:8;pointer-events:none}   /* below the card; inert for now */

  /* ---- the KAIRO mark, top right ----
     The five letters, each in one grid cell. The container's box is set to the
     cluster's bounding box (placeLogo) so the dot field can reserve it; the
     tiles are positioned inside it. White cells with black letters on the bare
     ground; the R cell is the one filled cell — the interface red until a
     colourway is chosen, then one of the chosen pair (paintLogo). */
  #kairo{display:none;position:absolute;z-index:3;pointer-events:none}
  #kairo .kt{position:absolute;display:flex;align-items:center;justify-content:center;
             background:var(--fg);border:1px solid transparent;
             font-family:var(--ui);font-weight:600;color:#FFFFFF;
             text-transform:uppercase;line-height:1;letter-spacing:.01em;
             transition:background .45s var(--ease),color .45s var(--ease)}
  /* the filled letter keeps the same white glyph; only its background is the colour */
  #kairo .kt.mark{color:#FFFFFF;border-color:transparent}
  @media (prefers-reduced-motion:reduce){#kairo .kt{transition:none}}

  /* ---- the format control, top right ----
     Two grid cells square instead of the three the grey placeholder took, and
     snapped to the same lines. The glyph inside is the poster's own outline at
     its real ratio, so the control states the format rather than naming it. */
  #fmtBtn{position:absolute;z-index:9;pointer-events:auto;cursor:pointer;
          background:transparent;border:1px solid rgba(255,255,255,.28);padding:0;
          display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
          transition:border-color .15s,background .15s}
  #fmtBtn:hover,#fmtBtn[aria-expanded=true]{border-color:#fff;background:rgba(255,255,255,.07)}
  #fmtBtn:focus-visible{outline:1px solid #fff;outline-offset:3px}
  /* the glyph's own box animates with the same curve as the sheet, so pressing
     a format shows the control and the poster arriving together */
  #fmtBtn i{display:block;border:1.3px solid #fff;box-sizing:border-box;
            transition:width var(--morph) var(--ease),
                       height var(--morph) var(--ease)}
  #fmtBtn b{font-family:var(--mono);font-weight:400;font-size:7.5px;letter-spacing:.1em;
            color:rgba(255,255,255,.7);white-space:nowrap}

  #fmtMenu{position:absolute;z-index:9;background:#080808;
           border:1px solid rgba(255,255,255,.26);padding:5px 0;
           opacity:0;visibility:hidden;transform:translateY(-4px);pointer-events:none;
           transition:opacity .18s ease,transform .18s ease,visibility .18s}
  #fmtMenu.open{opacity:1;visibility:visible;transform:none;pointer-events:auto}
  #fmtMenu button{display:flex;align-items:center;gap:11px;width:100%;
                  background:transparent;border:0;padding:8px 13px;cursor:pointer;
                  text-align:left;color:#fff;transition:background .12s}
  #fmtMenu button:hover{background:rgba(255,255,255,.10)}
  #fmtMenu button:focus-visible{outline:1px solid #fff;outline-offset:-2px}
  #fmtMenu button[aria-checked=true]{background:rgba(255,255,255,.06)}
  /* the ratio glyph, sized by JS: a 22px box holding the format's outline */
  #fmtMenu i{display:block;border:1.2px solid rgba(255,255,255,.85);box-sizing:border-box;flex:none}
  #fmtMenu .gbox{width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex:none}
  #fmtMenu .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
                text-transform:uppercase;flex:1;white-space:nowrap}
  #fmtMenu .rat{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
                color:rgba(255,255,255,.55);flex:none}
  #fmtMenu .use{font-family:var(--mono);font-size:8px;letter-spacing:.06em;
                color:rgba(255,255,255,.34);display:block;margin-top:3px;text-transform:none}
  #fmtMenu button[aria-checked=true] .rat{color:#fff}

  /* The sheet. syncSheet writes its four lengths in one go, so they all change
     at the same instant — and a transition on a length interpolates whatever
     caused the change. That is the format morph: four lengths here, four more
     on the bounding lines, one duration and one curve shared by all of them, so
     they arrive together. No custom-property animation involved, which means it
     behaves the same in every browser that can run the rest of this file. */
  #frame{position:absolute;z-index:2;left:var(--sheet-x);top:var(--sheet-y);
         width:var(--sheet-w);height:var(--sheet-h)}
  /* Scoped to .morphing on purpose. The same four lengths also change when the
     window is resized, and a resize must be instant — animating the sheet
     while someone drags a window corner looks broken and lags the pointer. The
     class is added only for the length of a format change. */
  .world.morphing #frame{
         transition:left var(--morph) var(--ease), top var(--morph) var(--ease),
                    width var(--morph) var(--ease), height var(--morph) var(--ease)}

  /* The single "create the poster" action. Centred under the sheet using the
     same --sheet-x/-w/--cell variables #frame itself is built from, so it
     tracks the sheet through every format and every viewport without its own
     positioning logic. Hidden (not just disabled) until .ready — invisible
     is what "revealed only at the end" means; a disabled button sitting there
     the whole time would still be announcing the ending early. */
  #mkPoster{position:absolute;z-index:7;
    left:calc(var(--sheet-x) + var(--sheet-w) / 2);
    top:calc(var(--sheet-y) + var(--sheet-h) + var(--cell) * 1.1);
    transform:translateX(-50%);
    font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
    padding:12px 26px;border:1px solid #000;background:#000;color:#ECECEC;cursor:pointer;
    opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity .3s ease,visibility .3s,background .15s,color .15s}
  #mkPoster.ready{opacity:1;visibility:visible;pointer-events:auto}
  #mkPoster:hover{background:transparent;color:#000}
  #mkPoster:focus-visible{outline:1px solid #000;outline-offset:3px}

  /* Two poster layers, dissolved into one another on a format change. Both are
     stretched to fill the frame (preserveAspectRatio="none"), and the frame is
     travelling between the two ratios: at the start the outgoing poster sits at
     its own ratio undistorted, at the end the incoming one does, and the
     dissolve covers the squash in between. That is what turns a resize into a
     morph.

     It is NOT a symmetrical crossfade, and that is the point. Fading one out
     while fading the other in leaves both semi-transparent midway, so a
     quarter of the black board shows through the pair and the poster visibly
     dips in brightness halfway through every change — very obvious on a white
     morning ground. Instead the outgoing layer holds full opacity underneath
     while the incoming one fades in ON TOP of it, and is only dropped once it
     is completely covered. Nothing is ever transparent, so nothing dims. */
  .ply{position:absolute;inset:0;opacity:0;
       transition:opacity var(--morph) var(--ease)}
  .ply.live{opacity:1}
  .ply:not(.live){pointer-events:none}   /* the idle buffer must not intercept hovers */
  .ply svg{display:block;width:100%;height:100%}

  /* HOVER NOTES: point at an answered layer and it stays lit while the rest of the
     poster dims, and a personal line appears beside the sheet. */
  .hl{cursor:pointer}
  .art > *{transition:opacity .25s ease}
  .art:has(.hl:hover) > *:not(.hl:hover){opacity:.12}

  /* ENTRY ANIMATIONS: the first time a tool's layer lands on the sheet it plays a
     one-shot entrance. markEntries() tags the layer .enter exactly once (the id is
     remembered in `entered`), so slider re-renders and format morphs stay silent;
     resetAll clears `entered` and re-arms it. The global prefers-reduced-motion
     rule near the end already forces animation:none, so a reduced-motion visitor
     just gets the finished mark — no per-animation guard needed here.

     THE SNAKE (Q4/febdays): its beads unspool head-to-tail. Every bead part carries
     class .sbead and a --bi (its 0-based order); the layer carries --sstep (the
     per-bead delay, sized in JS so ~all 28-31 beads land inside ~0.8s). Each bead
     appears WHOLE at full size — a plain fade, no scale-up — so the snake assembles
     one complete circle after another (Karin: scaling small->big did not suit it).
     The explicit animation-delay sits AFTER the animation shorthand on purpose — the
     shorthand resets delay to 0, so the override has to follow it. */
  @keyframes snakeBeadIn{from{opacity:0}to{opacity:1}}
  .hl.enter[data-q="febdays"] .sbead{
    animation:snakeBeadIn .42s var(--eo) both;
    animation-delay:calc(var(--bi) * var(--sstep,15ms))}

  /* THE NODE (Q2/alarms): the centre square pops first, then the rays shoot outward
     one by one (a stroke draw-on — --rl is each ray's own length) and each blue tip
     pops as its ray lands. --nstep (set in JS off the ray count) keeps the whole fan
     inside ~0.3s however many alarms there are. Same fill-box trick so the square and
     tips scale from their own centres, not the SVG origin. */
  @keyframes nodePop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:none}}
  @keyframes nodeRay{from{stroke-dashoffset:var(--rl)}to{stroke-dashoffset:0}}
  /* THE BASE GRID (shape + density): on first appearance the output RISES from
     the bottom of the sheet to the top — a clip that fills upward, so the lines
     read as coming up from below rather than blooming from the centre. */
  .hl.enter[data-q="basegrid"]{animation:gridRise .95s var(--eo) both}
  @keyframes gridRise{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
  .hl.enter[data-q="alarms"] .nsq{transform-box:fill-box;transform-origin:center;
    animation:nodePop .30s var(--eo) both}
  .hl.enter[data-q="alarms"] .nray{stroke-dasharray:var(--rl);
    animation:nodeRay .36s var(--eo) both;
    animation-delay:calc(.10s + var(--ri) * var(--nstep,40ms))}
  .hl.enter[data-q="alarms"] .nell{transform-box:fill-box;transform-origin:center;
    animation:nodePop .26s var(--eo) both;
    animation-delay:calc(.30s + var(--ri) * var(--nstep,40ms))}
  /* THE RING BLOCK (Q/vacations): the corner triangle RISES onto the canvas first,
     travelling in from beyond the sheet's extreme top-right corner (--rtx,--rty is the
     trim corner the block hangs flush to; --rtdx,--rtdy is the off-canvas start it
     slides from), and then the rings BUD — every one of them
     is tangent to the outer ring at one point (--rpx,--rpy, the middle-right), so
     scaling each about THAT point holds the tangency through the whole entrance
     and they read as growing out of it, outer first. transform-box:view-box puts
     the origin in the sheet's own units, which is what those two vars carry.

     A COUNT CHANGE is the same move under a different driver: startRingsMorph
     scales the very same groups about the very same point from JS, so a ring
     gained grows out of it and a ring lost shrinks back into it. Nothing here
     fights that — the .enter class is off by then. */
  @keyframes ringBud{from{opacity:0;transform:scale(0)}to{opacity:1;transform:none}}
  /* the triangle RISES onto the canvas: it starts one triangle-length up-and-right of
     its resting spot (--rtdx,--rtdy, so it is fully off the top-right corner) and
     slides down-left into place. transform-box:view-box keeps the px offsets in the
     sheet's own units. */
  @keyframes ringTriIn{from{opacity:0;transform:translate(var(--rtdx),var(--rtdy))}to{opacity:1;transform:none}}
  .hl.enter[data-q="vacations"] .rtri{transform-box:view-box;
    animation:ringTriIn .5s var(--eo) both}
  .hl.enter[data-q="vacations"] .rring{transform-box:view-box;
    transform-origin:var(--rpx) var(--rpy);
    animation:ringBud .52s var(--eo) both;
    animation-delay:calc(.14s + var(--ri) * var(--rstep,90ms))}

  /* THE MONTH SILHOUETTE (Q3): on FIRST appearance it grows from the sheet
     centre — a smooth scale of the whole layer group about the viewBox centre,
     the same move as the base grid but keyed to the sheet centre rather than the
     group's own box. A month CHANGE keeps the raster re-grow (startMonthGrow);
     .enter is off by then, so this never fights it. */
  .hl.enter[data-q="month"]{transform-box:view-box;transform-origin:50% 50%;
    animation:monthGrow .72s var(--eo) both}
  @keyframes monthGrow{from{transform:scale(.04)}to{transform:scale(1)}}

  /* THE DECADES BRICK BAND (Q7): on first appearance the checkerboard lays in
     column by column from the left, each brick growing up from its own foot —
     the piece's whole-cell brick language. --cstep (set on the group off the
     column count) keeps the whole band inside ~0.8s however many decades. */
  @keyframes brickLay{from{opacity:0;transform:scaleY(0)}to{opacity:1;transform:none}}
  .hl.enter[data-q="decades"] .brick{transform-box:fill-box;transform-origin:bottom;
    animation:brickLay .42s var(--eo) both;
    animation-delay:calc(var(--ci) * var(--cstep,40ms))}

  /* THE LATTICE (Q8/sixweek): on FIRST appearance only, every cell pops in as a
     true hard cut (no fade) — each cell carries its own reveal delay (--cd),
     baked in JS as an eased distance-from-top-left so the population reads as
     one diagonal wavefront sweeping down-right, easing out as it advances. A
     steps(1,end) animation holds each cell at opacity:0 for its entire duration
     and then snaps straight to opaque — no interpolation, matching the piece's
     no-fade language. Only ever runs once: any later paint (a bar drag, a
     revisit) uses the batched static render, which has no .lcell elements to
     animate at all.

     The duration used to be 0.01s. steps(1,end) only ever shows two states, so
     that read as instant either way — but a 10ms window is short enough that
     the main-thread work landing right after 257 cells are inserted
     (addHitRects' getBBox pass, markEntries' classList pass) could eat the
     whole window before the browser sampled it, and a cell whose step got
     stepped over that way never recovers: fill-mode:both freezes it at
     opacity:0 forever. Karin found 9 cells permanently missing after the
     sweep finished. 240ms is long enough that no plausible stall skips it
     outright, and JS backs the per-cell delay off by the same 240ms so the
     sweep's overall timing and easing feel unchanged. */
  @keyframes latticeCellIn{from{opacity:0}to{opacity:1}}
  .hl.enter[data-q="sixweek"] .lcell{
    opacity:0;
    animation:latticeCellIn .24s steps(1,end) both;
    animation-delay:var(--cd)}

  #hoverCard{position:fixed;z-index:20;background:var(--q-panel);
             font-family:var(--q-face);
             opacity:0;transform:translateY(4px);transition:opacity .2s var(--ease),transform .2s var(--ease);
             pointer-events:none}
  #hoverCard.on{opacity:1;transform:none}
  #hoverCard .hc-t{color:var(--q-text);margin:0;font-weight:700;line-height:1.1}
  #hoverCard .hc-b{color:var(--q-text);margin:0;font-weight:400}
  /* the background-grid reading — the grid's own answers, set quieter and apart */
  #hoverCard .hc-g{color:#9A9A9A;margin:0;font-weight:400}

  /* No frame: these ARE the four grid lines that fall on the sheet's edges,
     drawn brighter than the rest of the grid. Add class "edge" to .sheet-lines
     to clip them to the sheet instead of running the full width and height. */
  /* These live on the world, not on the viewport-sized stage, so they run the
     world's full extent — right through the overscan — and still reach the
     screen edge however far the board has panned. */
  .sheet-lines{position:absolute;inset:0;z-index:3;pointer-events:none}
  .sheet-lines i{position:absolute;background:var(--sheetline)}
  /* the four lines travel on the same duration and curve as the sheet's own
     box, so the frame and its edges can never arrive at different moments */
  .world.morphing .sheet-lines i{
                 transition:left var(--morph) var(--ease), top var(--morph) var(--ease),
                            right var(--morph) var(--ease), bottom var(--morph) var(--ease)}
  .sheet-lines .v{top:0;bottom:0;width:1px}
  .sheet-lines .h{left:0;right:0;height:1px}
  .sheet-lines .v1{left:calc(var(--sheet-x) + var(--over))}
  .sheet-lines .v2{left:calc(var(--sheet-x) + var(--sheet-w) + var(--over))}
  .sheet-lines .h1{top:calc(var(--sheet-y) + var(--over))}
  .sheet-lines .h2{top:calc(var(--sheet-y) + var(--sheet-h) + var(--over))}
  /* add class "edge" to clip them to the sheet instead of running full length */
  .sheet-lines.edge .v{top:calc(var(--sheet-y) + var(--over));
                       bottom:calc(100dvh - var(--sheet-y) - var(--sheet-h) + var(--over))}
  .sheet-lines.edge .h{left:calc(var(--sheet-x) + var(--over));
                       right:calc(100vw - var(--sheet-x) - var(--sheet-w) + var(--over))}
  #frame svg{display:block;width:100%;height:100%}

  /* ---------------------------------------------------------------------
     THE LANDING SCREEN — fully opaque, covers the board AND the chrome, so
     nothing of the poster is visible behind it. Not part of the .popup card
     system on purpose: a question card is meant to float over a visible
     board; this screen is what comes before the board is shown at all.

     --fg/--surface/--dim/--line/--picker are redeclared here, inverted for a
     dark full-bleed screen — which is what lets .btn/.fields/.fld below be
     reused completely unchanged. Those classes read the SAME variable names
     inside .popup (light card, dark text) and here (dark screen, light
     text); custom properties resolve from whichever ancestor set them, so
     one set of rules serves both without a duplicate light/dark copy of
     each control. */
  /* No palette of its own any more — see :root. */
  #landing{
    position:fixed;inset:0;z-index:50;background:var(--ink);
    display:flex;align-items:center;justify-content:center;
    opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity .38s ease,visibility .38s}
  #landing.open{opacity:1;visibility:visible;pointer-events:auto}
  #landingBody{width:min(380px,88vw)}
  .landing-kicker{font-family:var(--mono);font-size:10px;letter-spacing:.24em;
    text-transform:uppercase;color:var(--dim);margin:0 0 20px}
  #landingBody h1{font-family:var(--display);font-weight:800;font-size:34px;
    color:var(--fg);margin:0 0 10px;letter-spacing:-.01em}
  .landing-hint{font-family:var(--ui);font-size:13px;line-height:1.5;
    color:var(--dim);margin:0 0 30px;max-width:34ch}
  #landingBody .fields{margin-bottom:28px}
  #landingBody .btn{width:100%;text-align:center}

  /* ---- APERTURE — the opening screen -------------------------------------
     The one step that is not a 380px column. The hero is not a card sitting ON
     the grid; it is a hole cut OUT of it. #heroField paints a lattice of small
     squares across the whole viewport — one per cell, no ruled lines — and
     simply declines to paint the cells the aperture covers, so the type below
     sits on bare ink with no panel, no border, no shadow. The absence of the
     field IS the container, which is why nothing here draws a box.

     Note which grid this is. The poster's grid (the sheet, the dot field) must
     not be visible behind the opening screen; that spec is untouched. What
     shows is the INTERFACE grid, the same --cell lattice .gridlayer paints
     behind the board, so the frame you will be read against is already there
     before you are.

     Every measurement is in whole --cell units, so the aperture's four edges
     land on gridlines exactly the way the sheet snaps to them later. */
  /* The field is not part of the step's markup. It is a sibling of #landingBody
     that outlives every innerHTML wipe, and the aperture simply re-measures
     itself around whatever the screen is showing. */
  #heroField{position:absolute;inset:0;display:block;width:100%;height:100%;
    z-index:0;pointer-events:none}
  #landingBody{position:relative;z-index:1}
  #landing.hero{align-items:stretch}
  #landing.hero #landingBody{width:100%}

  /* The plate is measured, not positioned by the aperture: JS reads this box
     and grows the hole around it. Doing it the other way (fixed hole, content
     poured in) overflows the moment a name runs long or a font falls back. */
  .hero-plate{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(30rem,76vw);z-index:1}

  /* Frank Ruhl Libre at display scale, one step under the craft ceiling. The
     title is the heading — there is deliberately no kicker above it; the older
     landing steps keep theirs, this one does not need a label to say what it
     is. */
  .hero-title{font-family:var(--display);font-weight:800;
    font-size:clamp(2.25rem,6.4vw,5.25rem);line-height:.94;letter-spacing:-.03em;
    color:var(--fg);margin:0 0 calc(var(--cell)*1.6);text-wrap:balance}
  /* Characters arrive on the beat, hard cut. visibility (not opacity) keeps
     the transition binary — a fade here would turn the staccato into shimmer,
     which is the one thing this direction refuses. Layout is reserved from the
     first frame, so nothing reflows as letters land. */
  .hero-title i{font-style:normal;visibility:hidden}
  .hero-title i.lit{visibility:visible}

  .hero-lede{font-family:var(--ui);font-size:.8125rem;line-height:1.55;
    color:var(--dim);margin:0 0 calc(var(--cell)*1.6);max-width:34ch;
    text-wrap:balance}

  .hero-foot{display:flex;align-items:center;gap:var(--cell)}
  /* the id selector on #landingBody .btn stretches every landing button to the
     full column width, which is right for a 380px step and wrong here: at
     aperture width it becomes the loudest object on the screen. Sized to its
     own label instead. */
  #landing.hero .hero-foot .btn{width:auto;flex:0 0 auto;
    min-width:calc(var(--cell)*7);text-align:center}

  /* browser surfaces the design still owns */
  .hero ::selection{background:var(--done);color:var(--ink)}

  /* On a narrow screen the plate must give ground, or the aperture grows wider
     than the viewport and the field survives only above and below — at which
     point the hole is not a hole, it is a black band. Narrowing the plate keeps
     grid on all four sides, which is the whole idea. */
  @media (max-width:600px){
    .hero-plate{width:calc(100vw - var(--cell)*8)}
    .hero-title{font-size:clamp(2rem,10.5vw,3rem)}
  }

  /* Under reduced motion the field holds one still frame and every character is
     present from the start. The composition is identical; only the beat stops. */
  @media (prefers-reduced-motion:reduce){
    .hero-title i{visibility:visible}
  }

  /* ---- the opening mark: KAIRO in grid tiles + a START cell ---------------
     Replaces the typed title. The name is built from the same cells the
     question controls are: white tiles with a charcoal letter, laid out as a
     checkerboard so the cluster reads as one mark cut from the lattice. START
     is the one dark cell — the first cell the visitor fills, before the board
     and its questions. Both the tiles and START answer the pointer the same way:
     four small marks light on the grid junctions at the cell's corners, so the
     thing under the cursor is plainly a target. */
  /* The plate fills the viewport; the logo box and START are positioned inside
     it in absolute pixels snapped to the grid (see renderLandingHero), so the
     cells' corners land on the same junctions the dot field paints. */
  .hero-kairo{position:absolute;inset:0;left:0;top:0;transform:none;width:auto;display:block}
  .klogo{position:absolute}
  .klogo .kt{position:absolute;display:flex;align-items:center;justify-content:center;
    background:#FFFFFF;color:var(--fg);font-family:var(--display);font-weight:600;
    line-height:1;cursor:default}
  /* the four corner marks — one square on each grid junction the cell touches,
     sized to the lattice. Hidden until the cell is hovered; the hovered cell
     rises above its neighbours (.kt:hover z-index) so all four always show in
     full the way they do on an isolated letter like O. */
  /* the four squares that bound each letter's cell — the same size as the
     aperture's hour marks. They are ON from the start in grey, so the lattice
     already frames every letter; hovering a cell turns its four dark as the
     star's rays sweep in and settle onto them. */
  .kmark{position:absolute;width:calc(var(--cell)*.17);height:calc(var(--cell)*.17);
    background:#C2C2BE;transition:background .14s var(--ease);pointer-events:none}
  .kmark.tl{left:calc(var(--cell)*-.085);top:calc(var(--cell)*-.085)}
  .kmark.tr{right:calc(var(--cell)*-.085);top:calc(var(--cell)*-.085)}
  .kmark.bl{left:calc(var(--cell)*-.085);bottom:calc(var(--cell)*-.085)}
  .kmark.br{right:calc(var(--cell)*-.085);bottom:calc(var(--cell)*-.085)}
  .klogo .kt:hover{z-index:5}
  .klogo .kt:hover .kmark,.kstart:hover .kmark{background:var(--fg)}
  /* START — the one dark cell, filling the empty checkerboard slot between A and
     R (3 cells wide, 1 tall; positioned by JS). The first cell the visitor
     fills, before the board and its questions. */
  .kstart{position:absolute;z-index:2;border:0;background:var(--fg);color:#FFFFFF;
    font-family:var(--display);font-weight:500;letter-spacing:.12em;text-transform:uppercase;
    cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;
    transition:box-shadow .15s var(--ease)}
  .kstart:hover{z-index:6;box-shadow:0 8px 20px -8px rgba(0,0,0,.4)}
  .kstart:focus-visible{outline:none}
  @media (prefers-reduced-motion:reduce){.kmark,.kstart{transition:none}}

  /* ---- the base questions' controls, rescoped -----------------------------
     The base questions moved into the board's own question system (bank Q1 and
     Q2), so the landing carries only the opening screen now — the white panel,
     its markers and its NEXT block all went with them. Their two controls live
     on, rescoped under .qpanel below. */

  /* SHAPE (bank Q1): two circle options, carried over from the landing screens
     with their Figma glyphs (node 2879:6431). The mark sits apart from the
     ring or rides on it; the chosen option inks in, the other rests in grey.
     Placed under the words by shapeDuoMarkup; everything inside is cells, so
     it breathes with the panel.
       box to box    94/45 = 2.089       circle->label 10/45 = .222
       label 14/45 = .311 (12 + Karin's 2pt)   leading 1.33 -> .414           */
  .qpanel .qduo{display:flex;justify-content:center;align-items:flex-start;
    gap:calc(var(--cell)*2.089)}
  /* No width here: each option is exactly the circle's own box wide, and the
     circle takes the FEBDAYS row's diameter, set inline by shapeDuoMarkup —
     Q1's rings and Q4's circles are one size of the same mark, by decision. */
  .qpanel .qduo button{background:transparent;border:0;cursor:pointer;display:flex;
    flex-direction:column;align-items:center;padding:0;gap:calc(var(--cell)*.222)}
  /* overflow:visible — the apart mark lives OUTSIDE the ring's box, to its
     right, and the ring's box is what the label lines up with. position stated
     to beat the .qpanel svg rule that stretches panel SVGs full-bleed; the
     size comes inline from shapeDuoMarkup. */
  .qpanel .qduo svg{position:static;display:block;overflow:visible}
  /* the mark sits still: apart from the ring, or on it. (The slow orbit was
     tried and dropped — it read as confusing.) */
  .qpanel .qduo .ring{fill:none;stroke:#C2C2BE;transition:stroke .16s}
  .qpanel .qduo .dot{fill:#C2C2BE;transition:fill .16s}
  .qpanel .qduo b{font-family:var(--q-face);font-weight:400;
    font-size:calc(var(--cell)*.311);line-height:calc(var(--cell)*.414);
    text-align:center;color:var(--dim);transition:color .16s}
  .qpanel .qduo button[aria-pressed=true] .ring{stroke:var(--q-text)}
  .qpanel .qduo button[aria-pressed=true] .dot{fill:var(--q-text)}
  .qpanel .qduo button[aria-pressed=true] b{color:var(--q-text)}

  /* DENSITY (bank Q2): three circles filling up — a sliver, about half,
     brimming. The landing control's px measures converted to cells at the same
     45px drawing: circle 70/45 = 1.556, gap 26/45 = .578, circle->label
     16/45 = .356, label 13/45 = .289. */
  .qpanel .qfill{display:flex;justify-content:center;align-items:flex-end;
    gap:calc(var(--cell)*.578)}
  .qpanel .qfill button{background:transparent;border:0;cursor:pointer;display:flex;
    flex-direction:column;align-items:center;padding:0;gap:calc(var(--cell)*.356)}
  /* no width/height here: the circle takes the MONTH question's own diameter
     (ringCircleD), set inline by densityFillMarkup, so the two questions'
     circles can never drift into two sizes of the same mark */
  .qpanel .qfill .circ{position:relative;box-sizing:border-box;border-radius:50%;
    border:2px solid #C2C2BE;overflow:hidden;transition:border-color .16s}
  .qpanel .qfill .circ i{position:absolute;left:0;right:0;bottom:0;height:0;background:#C2C2BE;
    transition:background .16s,height 1.1s cubic-bezier(.34,1.2,.5,1)}
  .qpanel .qfill b{font-family:var(--q-face);font-weight:500;
    font-size:calc(var(--cell)*.289);color:var(--dim);transition:color .16s}
  .qpanel .qfill button[aria-pressed=true] .circ{border-color:var(--q-text)}
  .qpanel .qfill button[aria-pressed=true] .circ i{background:var(--q-text)}
  .qpanel .qfill button[aria-pressed=true] b{color:var(--q-text)}

  /* questions arrive as a card floating on the surface, clear of the sheet */
  .popup{
    --fg:#111111; --dim:rgba(0,0,0,.52); --line:rgba(0,0,0,.16);
    --surface:#FFFFFF; --accent:#111111; --picker:none;
    position:absolute;z-index:5;
    left:0;top:0;                      /* replaced by JS once a dot is chosen */
    width:min(400px, 88vw);max-height:84dvh;
    background:var(--surface);color:var(--fg);
    padding:24px 24px 22px;overflow-y:auto;
    box-shadow:0 24px 60px -18px rgba(0,0,0,.9);
    transform-origin:top left;
    opacity:0;visibility:hidden;pointer-events:none;
  }
  /* grows out of the dot it is pinned to. left/top are transitioned so that if
     a format change puts the new sheet under an open card, the card slides out
     of the way on the same curve as the sheet instead of jumping when the morph
     lands. The pop keyframes touch only transform and opacity, so they do not
     fight this. */
  .popup.open{opacity:1;visibility:visible;pointer-events:auto;
              animation:pop .34s cubic-bezier(.2,.85,.25,1) both}
  .world.morphing .popup.open{
              transition:left var(--morph) var(--ease), top var(--morph) var(--ease)}
  /* the card grows out of the dot it is pinned to */
  @keyframes pop{from{opacity:0;transform:scale(.38)}to{opacity:1;transform:scale(1)}}

  .eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:var(--dim);
           text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;
           border-bottom:1px solid var(--line);padding-bottom:9px;gap:12px}
  .eyebrow-right{display:flex;align-items:center;gap:12px;flex-shrink:0}
  .reset{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
         background:transparent;border:0;padding:0 0 1px;cursor:pointer;color:var(--dim);
         border-bottom:1px solid var(--line);transition:color .15s,border-color .15s}
  .reset:hover{color:var(--fg);border-bottom-color:var(--fg)}
  .reset:focus-visible{outline:1px solid var(--fg);outline-offset:3px}
  .reset:disabled{opacity:.35;cursor:default;border-bottom-color:transparent}
  .reset:disabled:hover{color:var(--dim)}

  .prog i{flex:1;height:1px;background:var(--line);transition:background .25s,height .25s}
  .prog i.on{background:var(--fg);height:2px}
  .prog i.cur{background:var(--accent);height:2px}
  .prog s{width:12px;flex:none;height:1px;background:transparent}

  #stepHost{display:block}
  .q{margin:0}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .q h2{font-family:var(--display);font-weight:800;font-size:25px;line-height:1.14;
        margin:16px 0 8px;letter-spacing:-.01em}
  .q .hint{color:var(--dim);font-size:13px;line-height:1.45;margin:0 0 20px}

  .shapes{display:flex;gap:8px}
  .shapes button{flex:1;aspect-ratio:1;border:1px solid var(--line);background:transparent;
                 cursor:pointer;display:flex;flex-direction:column;align-items:center;
                 justify-content:center;gap:9px;transition:.18s;padding:8px}
  .shapes button:hover{border-color:var(--fg)}
  .shapes button svg{width:34px;height:34px}
  .shapes button svg *{fill:var(--fg);transition:fill .18s}
  .shapes button b{font-family:var(--mono);font-weight:400;font-size:8.5px;letter-spacing:.14em;
                   text-transform:uppercase;color:var(--dim);transition:color .18s}
  .shapes button[aria-pressed=true]{background:var(--fg);border-color:var(--fg)}
  .shapes button[aria-pressed=true] svg *{fill:var(--surface)}
  .shapes button[aria-pressed=true] b{color:var(--surface)}

  .duo{display:flex;gap:8px}
  .duo button{flex:1;padding:16px 14px;border:1px solid var(--line);background:transparent;
              cursor:pointer;text-align:left;transition:.18s;color:var(--fg)}
  .duo button:hover{border-color:var(--fg)}
  .duo button strong{display:block;font-family:var(--display);font-weight:800;font-size:19px;margin-bottom:3px}
  .duo button span{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;line-height:1.4;
                   text-transform:uppercase;color:var(--dim);transition:color .18s;display:block}
  .duo button[aria-pressed=true]{background:var(--fg);border-color:var(--fg);color:var(--surface)}
  .duo button[aria-pressed=true] span{color:var(--surface);opacity:.7}

  /* Twelve months, three to a row where there is room, so four rows read as a
     year at a glance. auto-fit rather than a fixed 3, because the card narrows
     to stay anchored to its dot and off the poster (see placeCard) — at the
     tightest widths this drops to two columns instead of crushing SEPTEMBER. */
  .choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:6px}
  .choice button{padding:11px 4px;border:1px solid var(--line);background:transparent;
                 cursor:pointer;transition:.18s;color:var(--fg);
                 font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;
                 text-transform:uppercase;white-space:nowrap}
  .choice button:hover{border-color:var(--fg)}
  .choice button[aria-pressed=true]{background:var(--fg);border-color:var(--fg);color:var(--surface)}

  /* a bar with exactly three marked points — not a free slider, not a duo */
  .tri{display:flex;justify-content:space-between;position:relative;padding:24px 8px 6px}
  .tri::before{content:'';position:absolute;left:16px;right:16px;top:32px;height:1px;background:var(--line)}
  .tri button{position:relative;z-index:1;background:transparent;border:0;padding:4px;cursor:pointer;
              display:flex;flex-direction:column;align-items:center;gap:11px;flex:1}
  .tri button i{display:block;width:10px;height:10px;border-radius:50%;background:var(--surface);
                border:1.3px solid var(--fg);transition:transform .15s,background .15s}
  .tri button[aria-pressed=true] i{background:var(--fg);transform:scale(1.35)}
  .tri button b{font-family:var(--mono);font-weight:400;font-size:9.5px;letter-spacing:.1em;
               text-transform:uppercase;color:var(--dim);transition:color .15s}
  .tri button[aria-pressed=true] b{color:var(--fg)}
  .tri button:focus-visible i{outline:1px solid var(--fg);outline-offset:3px}

  .num{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
  .num input{width:104px;background:transparent;border:0;border-bottom:1px solid var(--fg);
             font-family:var(--display);font-weight:800;font-size:50px;color:var(--fg);
             padding:0;outline:none;text-align:center;-moz-appearance:textfield}
  .num input::-webkit-outer-spin-button,.num input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .num em{font-style:normal;font-family:var(--mono);font-size:9px;letter-spacing:.16em;
          text-transform:uppercase;color:var(--dim)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;background:transparent;margin:4px 0;cursor:grab}
  input[type=range]:active{cursor:grabbing}
  input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--line)}
  input[type=range]::-moz-range-track{height:1px;background:var(--line)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;
    background:var(--fg);border:0;margin-top:-7px;transition:transform .12s}
  input[type=range]:active::-webkit-slider-thumb{transform:scale(1.25)}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:0;background:var(--fg);border:0}
  input[type=range]:focus-visible::-webkit-slider-thumb{outline:1px solid var(--fg);outline-offset:3px}
  .scale{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;
         color:var(--dim);letter-spacing:.1em}

  /* part one — kept in the code, parked until we decide where it goes */
  .fields{display:flex;flex-direction:column;gap:18px}
  .fld label{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.16em;
             text-transform:uppercase;color:var(--dim);margin-bottom:5px}
  .fld label span{text-transform:none;letter-spacing:.04em;opacity:.7}
  .fld input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--fg);
             font-family:var(--display);font-weight:500;font-size:21px;color:var(--fg);
             padding:3px 0;outline:none;-moz-appearance:textfield}
  .fld input::-webkit-outer-spin-button,.fld input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .fld input::placeholder{color:var(--dim);opacity:.45}
  .fld input:focus{border-bottom-width:2px}
  .fld input:disabled{color:var(--dim);border-bottom-style:dotted}
  .fld input[type=date]::-webkit-calendar-picker-indicator{filter:var(--picker);opacity:.55;cursor:pointer}
  .fld .sub{font-family:var(--mono);font-size:9px;color:var(--dim);margin-top:6px;
            letter-spacing:.04em;min-height:13px}
  .duo-fld{display:flex;gap:14px}
  .duo-fld .fld{flex:1}

  /* =====================================================================
     THE QUESTION SYSTEM — cells on the interface lattice.

     Every box here is a whole number of --cell, positioned by JS in pixels
     (see renderSnake). Nothing is centred, nothing is padded in ems: the grid
     decides where things are, which is the entire point of the design.

     It lives inside .stagebox so it pans and tilts with the board exactly as
     the sheet does — the question is ON the grid, not floating above it.
     ===================================================================== */
  /* the layer spans the board but must let hovers reach the poster beneath it in
     its empty areas; its real children (panels, markers) take pointer events back */
  #qsys{position:absolute;inset:0;z-index:5;pointer-events:none}
  #qsys > *{pointer-events:auto}
  #qsys>*{position:absolute;box-sizing:border-box}

  /* the step markers: the snake. One cell each, and the number is the only
     thing in them — no border, no radius, nothing but a filled cell. */
  .qstep{display:flex;align-items:center;justify-content:center;
         font-family:var(--q-face);font-weight:400;color:#FFFFFF;
         background:var(--q-past);cursor:pointer;
         transition:background .18s}
  .qstep.now{background:var(--q-now);cursor:default}
  .qstep.locked{cursor:default}
  .qstep:focus-visible{outline:2px solid #FFFFFF;outline-offset:-4px}
  /* the total, on white — it states the length of the whole thing once, beside
     the step you are on, and never moves relative to it */
  /* On the old black ground a white cell was emphatic; on off-white it is nearly
     nothing, so here the TEXT carries the cell — same coral as the marker beside
     it, at a weight and size that reads on its own. */
  .qtotal{display:flex;align-items:center;justify-content:center;
          background:var(--q-panel);color:var(--q-now);
          font-family:var(--q-face);font-weight:600}

  /* the panel. White, and the question is set in it at the top left with a
     single cell-derived inset — the mock's 19px on a 43px cell. */
  .qpanel{background:var(--q-panel);overflow:hidden}
  /* ONE div owns the panel's spacing (flow panels): the hug is its padding,
     the gaps are its children's top margins, and the panel's height is auto —
     it hugs whatever the column adds up to. */
  .qpanel .qflow{display:flex;flex-direction:column;align-items:stretch}
  /* An svg CONTROL is a flow child too: full panel width (the words carry the
     side hug), height from its own cropped viewBox — so the render stays 1:1
     with the viewBox units and the panel's height follows the control's foot.
     Direct child only: the shape control's ring glyphs (.qduo svg) keep their
     own fixed cell size. */
  .qpanel .qflow>svg{position:static;display:block;width:100%;height:auto}
  .qpanel h2{margin:0;color:var(--q-text);font-family:var(--q-face);
             font-weight:400;letter-spacing:-.01em}
  /* the same #FF0000 as the question — the node sets it in the full red and
     lets size alone make it secondary */
  .qpanel .qhint{color:var(--q-text);font-family:var(--q-face);font-weight:400;
                 letter-spacing:0}
  .qpanel svg{display:block;position:absolute;left:0;top:0;width:100%;height:100%;
              overflow:visible;touch-action:none}
  .qpanel svg.dial{cursor:grab}
  .qpanel svg.dial:active{cursor:grabbing}
  .qpanel svg.bar{cursor:grab}
  .qpanel svg.bar:active{cursor:grabbing}
  /* the horizon. NO transition on the bar: its length and its thickness are
     both written every animation frame, and a CSS transition on top of that
     fights the drag — the shape would lag the finger by its own duration, which
     is the exact feeling being designed out. */
  .qpanel .bar-run{fill:none;stroke:var(--q-text)}
  .qpanel .bar-track{fill:none;stroke:var(--q-past);stroke-width:1;
                     stroke-linecap:round}
  .qpanel .bar-hit{fill:transparent}
  .qpanel .bar-val{fill:var(--q-text);font-family:var(--q-face);font-weight:700}
  .qpanel .bar-unit{fill:var(--q-past);font-weight:400}
  .qpanel .bar-end{fill:var(--q-past);font-family:var(--q-face);font-weight:400}
  .qpanel svg:focus-visible{outline:none}
  .qpanel .dial-arc{fill:none;stroke:var(--q-past)}
  .qpanel .dial-tick{fill:var(--q-past)}
  .qpanel .dial-lab{fill:var(--q-past);font-family:var(--q-face);font-weight:400}
  .qpanel .dial-dot{fill:var(--q-text)}
  .qpanel .dial-val{fill:var(--q-text);font-family:var(--q-face);font-weight:700;
                    text-anchor:middle}
  /* the neighbours are the way you turn the wheel with a pointer, so they need
     a target — but they must not look like buttons */
  .qpanel .dial-hit{fill:transparent;cursor:pointer}

  /* The other two controls. The wheel is right for a count — a ring of numbers
     with one at the top — and wrong for a binary whose sides are called "More
     than enough", so those keep their own shape. What every question shares is
     the PANEL: the white ground, the red question, the cell module and the Save
     hanging off the corner. That is what "opens like the second question" is.

     Both are grids of cells, laid out in the panel's own module rather than in
     ems, so they read as more of the same lattice. */
  .qpanel .qopts{display:grid;gap:1px}
  .qpanel .qopts button{border:0;background:var(--q-past);color:#FFFFFF;
    font-family:var(--q-face);font-weight:400;cursor:pointer;padding:0 .35em;
    display:flex;align-items:center;justify-content:center;text-align:center;
    line-height:1.1;transition:background .14s}
  .qpanel .qopts button:hover{background:var(--q-now)}
  .qpanel .qopts button[aria-pressed=true]{background:var(--q-now)}
  .qpanel .qopts button:focus-visible{outline:2px solid var(--q-text);outline-offset:-3px}
  /* a binary gets two wide cells */
  .qpanel .qopts.duo{grid-template-columns:1fr 1fr}

  /* THE MONTH RING */
  .qpanel svg.mring{cursor:default}
  .mring .mo{cursor:pointer}
  .mring .mo circle{fill:var(--q-text)}
  .mring .mo text{fill:#FFFFFF;font-family:var(--q-face);font-weight:500;
                  letter-spacing:.04em;pointer-events:none}
  .mring .mo:hover circle{fill:var(--q-now)}
  /* the chosen one has no circle at all — see monthRingMarkup */
  .mring .mo.on text{fill:var(--q-text);font-weight:600}
  /* it turns for as long as the answer stands */
  @keyframes moSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  .mring .mo-spin,
  .compass .mo-spin{animation:moSpin 14s linear infinite}
  @media (prefers-reduced-motion:reduce){.mring .mo-spin,.compass .mo-spin{animation:none}}

  /* VACATIONS — five touching circles. Black with white numbers; the chosen one
     inverts to white with a black ring. */
  .qpanel svg.vcirc, .qpanel svg.fcard, .qpanel svg.cway{cursor:default}
  .cway .cw{cursor:pointer}
  .cway .cw path{pointer-events:all}
  .vcirc .vc{cursor:pointer}
  .vcirc .vc circle{fill:var(--q-text)}
  .vcirc .vc text{fill:#FFFFFF;font-family:var(--q-face);font-weight:400;pointer-events:none}
  .vcirc .vc.on circle{fill:var(--q-panel);stroke:var(--q-text);stroke-width:1.5}
  .vcirc .vc.on text{fill:var(--q-text)}
  /* FEBRUARY — four bordered cards. Black outline, black number over a small FEB;
     the chosen card fills black and its type reverses to white. */
  .fcard .fc{cursor:pointer}
  .fcard .fc rect{fill:var(--q-text)}
  .fcard .fc text{fill:var(--q-panel);font-family:var(--q-face);font-weight:400;pointer-events:none}
  .fcard .fc.on rect{fill:var(--q-panel);stroke:var(--q-text);stroke-width:1.5}
  .fcard .fc.on text{fill:var(--q-text)}

  /* Save. Two cells by one, hanging off the panel's bottom-right corner, and
     the only action on the screen. */
  .qsave{display:flex;align-items:center;justify-content:center;
         background:var(--q-now);color:#FFFFFF;border:0;
         font-family:var(--q-face);font-weight:400;text-transform:uppercase;
         cursor:pointer;transition:filter .16s}
  .qsave:hover:not(:disabled){filter:brightness(1.12)}
  /* not ready: still a cell in its place, so the composition does not shift when
     it becomes live — only its weight changes */
  .qsave:disabled{background:var(--q-past);cursor:default}
  .qsave:focus-visible{outline:2px solid #FFFFFF;outline-offset:-4px}

  /* Save on the left, Skip pushed to the far right. The gap between them is the
     point: the two exits are not a pair of equals, so they must not sit side by
     side looking like a choice between two buttons. */
  .nav{padding-top:20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .nav .spacer{flex:1}
  /* Skip is deliberately the least attractive thing in the card: no border, no
     ground, small, dim, and it only acknowledges the pointer at all on hover.
     It is an escape hatch, not an action — anyone who wants it will find it,
     and nobody will reach for it by accident on the way to Save. */
  .skip{font-family:var(--mono);font-size:9px;letter-spacing:.16em;
        text-transform:uppercase;background:transparent;border:0;padding:4px 2px;
        cursor:pointer;color:var(--dim);opacity:.6;
        transition:opacity .15s,color .15s}
  .skip:hover{opacity:1;color:var(--fg);text-decoration:underline;text-underline-offset:3px}
  .skip:focus-visible{outline:1px solid var(--fg);outline-offset:2px;opacity:1}
  .btn{font-family:var(--mono);font-weight:400;font-size:10.5px;letter-spacing:.16em;
       text-transform:uppercase;padding:11px 18px;border:1px solid var(--fg);
       background:var(--fg);color:var(--surface);cursor:pointer;transition:.18s}
  .btn:hover{background:transparent;color:var(--fg)}
  .btn.ghost{background:transparent;color:var(--dim);border-color:var(--line)}
  .btn.ghost:hover{color:var(--fg);border-color:var(--fg)}
  .btn:disabled{opacity:.3;cursor:not-allowed;background:transparent;color:var(--dim);border-color:var(--line)}
  .btn:focus-visible,.shapes button:focus-visible,.duo button:focus-visible{outline:1px solid var(--accent);outline-offset:2px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
  .note{font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:.06em;margin-top:12px}
  .collected{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
  .collected #saveNote{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.14em;
                       text-transform:uppercase;color:var(--dim);margin-bottom:10px}
  .caption{display:flex;justify-content:space-between;font-family:var(--mono);font-size:8.5px;
           color:var(--dim);letter-spacing:.16em;text-transform:uppercase;
           padding-top:16px;margin-top:16px;border-top:1px solid var(--line)}

  /* not enough room beside the sheet — stack the card under it */
  
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<!--
  APERTURE — direction contract for the opening screen (#landing step 1).
  THESIS: the way in is a hole, not a page. This screen refuses the centered
  plate: the interface grid is the ground, and the title is what is left where
  the grid has been switched off.
  AMENDED: the name and birthdate fields this screen was built around are gone,
  and with them the mechanic where typing widened the aperture. The screen asks
  for nothing now — title, one line, Begin. The hole still opens on the beat,
  but it is no longer sized by what the visitor gives.
  OWN-WORLD: inherited whole — ink #000, white at the field's own weights,
  sheetline rgba(255,255,255,.55) for the rays, Frank Ruhl Libre display /
  Miriam Libre UI / IBM Plex Mono. No new palette, no new face; settled-yellow
  #F3E09B is spent only on the caret and the meter, never on the field. The
  lattice is squares alone, unruled. The poster's own grid and sheet stay
  hidden here per the four-step spec.
  STORY: someone arrives, understands this is a made thing about their own
  time, gives a name, and the giving is what opens the way through.
  FIRST VIEWPORT: full-bleed cell field, live in hard-cut beats. Centred in
  it, an aperture of extinguished cells snapped to whole gridlines. Inside:
  "Architecture of Time" in the display serif arriving character by character
  on the beat, one line beneath it, Begin at the aperture's lower edge. On
  Begin it opens to full bleed and the first base question arrives.
  FORM: aperture — candidate 4 of 7, assigned; seed key b66342ad.
  FINISH: unreviewed and undocumented is unfinished; this build ends with the
  finish review, the verdict, and DESIGN.md
-->
<div class="surface">

  <div class="world" id="world">
    <div class="gridlayer"></div>
    <div class="vignette"></div>
    <div class="sheet-lines" id="sheetLines">
      <i class="v v1"></i><i class="v v2"></i><i class="h h1"></i><i class="h h2"></i>
    </div>
    <div class="stagebox">
      <div id="frame">
        <div class="ply live" id="plyA"></div>
        <div class="ply" id="plyB"></div>
      </div>
      <!-- The one and only way to create the poster: hidden until every board
           question is behind you (see renderStatus's mkBtn.classList.toggle),
           and deliberately NOT inside a question card or the status strip —
           it is its own action, taken only once, on nothing but the poster
           itself. A sibling of #frame inside .stagebox so it pans and tilts
           with the sheet exactly like the dots and the card do, using the
           same --sheet-*/--cell variables that already position the sheet. -->
      <button type="button" id="mkPoster">Create Poster</button>
      <!-- the KAIRO mark: the name's five letters in grid cells, top-right, in
           a composition chosen at random each load. A sibling of the dots inside
           .stagebox so it pans and tilts on the same grid it is snapped to.
           Built by buildLogo(), placed by placeLogo(), coloured by paintLogo(). -->
      <div id="kairo" role="img" aria-label="KAIRO"></div>
      <div class="dots" id="dots"></div>
      <aside class="popup" aria-hidden="true" aria-live="polite">
        <div id="cardBody"></div>
      </aside>
      <div class="dots-int" id="dotsInt"></div>
      <!-- The question system: step markers, panel and Save, all on the
           lattice. A sibling of #frame inside .stagebox for the same reason
           #mkPoster is one — it has to pan and tilt with the sheet, because it
           is drawn on the same grid the sheet is snapped to. -->
      <div id="qsys"></div>
    </div>
    <!-- the foreground grid: four bands framing the sheet's live rect, so the
         lattice crosses visibly over every question, number and dot but is
         physically excluded from the poster itself (see .gridlayer-fg). A
         direct child of .world, not .stagebox, and placed AFTER it, so it
         paints over everything stagebox holds (#qsys included) whatever the
         tie-break, while staying inside the same stacking context as the
         sheet it has to track. -->
    <div class="gridlayer-fg gfg-top"></div>
    <div class="gridlayer-fg gfg-bottom"></div>
    <div class="gridlayer-fg gfg-left"></div>
    <div class="gridlayer-fg gfg-right"></div>
  </div>

  <!-- fixed chrome: not part of the board, never moves -->
  <!-- the grey corner square is gone: it was a placeholder for a mark that
       never arrived, and on a ground this bare it read as a stray cell.
       The KAIRO mark that replaced it is NOT here — it lives inside .stagebox
       so it pans and tilts with the grid it is snapped to. -->
  <button type="button" id="fmtBtn" aria-haspopup="true" aria-expanded="false"
          aria-label="Poster format"></button>
  <div id="fmtMenu" role="menu" aria-label="Poster format"></div>
  <div id="status"></div>
  <button type="button" id="reset" aria-label="Reset all answers">Reset</button>

</div>

<!-- The landing screen: fixed, opaque, covers the board AND the chrome above.
     Deliberately a SIBLING of .surface, not a descendant — .surface sets
     `perspective` for the board's pointer-tilt effect, and `perspective`
     (like `transform`) makes an element a containing block for its own
     position:fixed descendants. A #landing nested inside it would compute
     its fixed inset against that 3D-perspective box instead of the true
     viewport, and visibly drift off (confirmed: showed up ~150px short of
     the bottom edge). Living outside .surface entirely keeps its containing
     block the real viewport, full stop. -->
<div id="landing" role="dialog" aria-modal="true" aria-label="Before we begin" aria-hidden="true">
  <div id="landingBody"></div>
</div>

<script>
/* =====================================================================
   ARCHITECTURE OF TIME

   PART ONE  — profile: full name, date of birth (optional), age.
               Today's date is available to every question via derive().
   PART TWO  — questions drawn at random from QUESTION_BANK.

   ADDING A QUESTION: append an entry to QUESTION_BANK below. Every entry
   needs an id, a type, and a default (used when the draw skips it).
   title / hint / min / max may each be a function receiving the derived
   context D — that is how a question becomes relative to age or to today.
   Set pinned:true on a question that must always be asked.
   ===================================================================== */
const BUILD='b291310';   // shown bottom-left, so you can confirm which build you are looking at
const CONFIG = {
  DATA_ENDPOINT: "",            // e.g. "https://hook.eu2.make.com/xxxxx"
  POST_TO_PARENT: true,
  QUESTIONS_PER_SESSION: 10,    // how many bank questions to draw
  SHUFFLE_TAIL: false,          // true = shuffle everything after the pinned lead.
                                // false keeps the bank's authored order, which is
                                // deliberate: the questions build on each other.
  /* The opening screen — title, one line, Begin. It collects nothing: the name
     and birthdate fields it used to carry are gone, since the poster has no
     text on it and neither value ever drove a mark. Off drops the screen and
     opens straight onto the board and its first question. (Was ASK_PROFILE,
     which named a job this screen no longer has. S.name/S.dob remain in the
     state and in payload() so already-collected responses keep their shape —
     they are just never filled now; see the note in payload.) */
  SHOW_OPENING: true,
  FORMAT: 'sheet',              // the format the board opens on
  /* Off for now: the format control is hidden and the board is locked to
     CONFIG.FORMAT. The FORMATS list, the morph, and the whole switcher stay in
     the code — set this back to true to bring the control back rather than
     rebuilding it. */
  FORMAT_SWITCHER: false,

  /* ---- how the sequence opens up ----
     The first LINEAR_LEAD questions are answered strictly in order: they are
     the base of the poster, and each one changes the ground the next is asked
     against. Only after them does the path fork, and then any of the next
     OPEN_AHEAD is available — so there is always a choice of where to go
     without ever losing the thread.
     Five, not three: shape and density (the two questions that used to open
     the landing sequence, and now lay the base grid) joined the front of the
     bank, so the strict walk covers them plus the month/snake/node trio it
     always covered. */
  LINEAR_LEAD: 5,
  OPEN_AHEAD: 2,

  /* the wake that travels from the question just answered toward the next one.
     Runs after every answer. Set false to drop the gesture entirely. */
  GUIDE_LINE: true
};

/* =====================================================================
   FORMATS

   A format is measured in grid cells, never in pixels. That is deliberate:
   because every format is a whole number of cells, all four of the sheet's
   edges land on grid lines at EVERY format, not just at the default one —
   which is the same property the original 18-cell sheet was built around.

   It also lets the ratios be exact rather than approximate:
     20 x 25 = 4:5      18 x 32 = 9:16     32 x 18 = 16:9
     20 x 28 = 5:7      18 x 27 = 2:3      22 x 22 = 1:1
   The only compromise is A-series: 17 x 24 is 0.7083 against 1:√2's 0.7071,
   off by 0.17%, which is finer than the print tolerance anyway.

   ADDING A FORMAT: append an entry. Nothing else needs to change — the
   poster, the sheet, the grid and the dot field are all derived.
   ===================================================================== */
/* CELL COUNTS ARE THE INTERFACE LATTICE. That is the whole reason they are what
   they are: the sheet is snapped to whole cells from the grid's origin, so the
   number of cells across a format IS the coarseness of the lattice the whole
   board is drawn on. The question system's mock puts ~13 cells across the
   sheet, which is where these counts come from — the previous 21×30 drew a
   lattice about 1.6x finer than the design.

   Ratio accuracy is unharmed and in two places improved: 14:20 is 7:10 exactly,
   12:15 is 4:5 exactly, 9:16 is 9:16 exactly, and A-series is 12:17 = 0.7059
   against 1:√2's 0.7071 — out by 0.17%, the same as the 17:24 it replaces.

   CELL rises with the counts so the poster's own units do not move: 14 x 75 is
   the same 1050 as 21 x 50. */
const FORMATS=[
  /* print */
  {id:'sheet',    label:'Sheet',     ratio:'7:10', cols:14, rows:20, use:'70 × 100 cm print'},
  {id:'iso',      label:'A-series',  ratio:'1:√2', cols:12, rows:17, use:'A2 / A3 / A4'},
  /* social */
  {id:'feed',     label:'Portrait',  ratio:'4:5',  cols:12, rows:15, use:'Instagram feed'},
