const ALARM_READ={
  0:"None. It rings once and you’re up. The morning doesn’t get a vote.",
  1:"One. You take a single stretch, and then you go. That’s the whole of it.",
  2:"Two. Never one, never many. A small ritual you keep without thinking.",
  3:"Three. You’ve built the delay into the plan and set the alarm early to cover it.",
  4:"Four. Mornings are a negotiation, and you’ve stopped pretending they aren’t.",
  5:"Five. You don’t wake so much as get worn down until the day wins.",
  6:"Six. Half a dozen tries, and you’ve made peace with needing a running start.",
  7:"Seven. Not really waking any more; a ritual you sleep straight through on purpose.",
  8:"Eight. Less a wake-up, more a slow siege on your own sleep.",
  9:"Nine. You’ve handed your willpower to your phone, and you sleep fine about it.",
  10:"Ten. Not waking up. A system, layered, redundant, quietly overbuilt.",
  11:"Eleven. Somewhere in there is someone who really does not want to leave the bed.",
  12:"Twelve, a full clock of them. Sleep isn’t a phase you exit, it’s a place you’re pulled from."
};
const VAC_READ={
  '1':"One memory that never leaves. Everything else fades, but that one moment built you.",
  '2':"Two that keep surfacing. Your whole sense of yourself hangs on those two.",
  '3':"Three that shaped you. Enough to know who you are, few enough to hold all at once.",
  '4+':"More than a handful. Your past isn’t a blur, it’s moments you can still name."
};
const BORN_READ={
  '28':"Twenty-eight, February. You started in the short month, the one that never quite fits the calendar.",
  '29':"Twenty-nine, a leap-year February. Your month only fills out once every four years.",
  '30':"Thirty days: April, June, September or November. One of the even, unhurried months.",
  '31':"Thirty-one, a long month. You were born in one of the ones that takes its time."
};
/* one line per stop on the bar — how much runway you think you have left */
const DECADE_READ={
  10:"One decade. You count time close and short, and you’d rather spend it than save it.",
  20:"Two decades. Not endless, and you seem to like it that way. Enough to plan, too little to waste.",
  30:"Three decades. A careful figure. You give yourself room without letting yourself off the hook.",
  40:"Four decades. You picture a long middle stretch, steady and unhurried, most of it still ahead.",
  50:"Five decades. Half a century, give or take. You treat the future as something you’ll actually live in.",
  60:"Six decades. A generous horizon. You plan like there’s plenty, and mostly you believe it.",
  70:"Seven decades. You bet high on time. The far end is so far off it barely feels like a limit.",
  80:"Eight decades. You expect the long game, the kind of span that outlasts most plans you’ll make.",
  90:"Nine decades. Near the top of the dial. You imagine yourself among the ones who really stay.",
  100:"A full century. You’ve set the marker as far as it goes. Time, to you, is the thing that won’t run out."
};
/* The week/weekend bar has twenty-one stops, so the read works in BANDS rather
   than one line per stop — the two ends, the two leans, and the dead centre.
   Band edges agree with the question's own display() (below 45 reads as the
   week, above 55 as the weekend), so the card's title and its line never
   disagree about which side you are on. */
function sixweekRead(v){
  if(v<=15) return "The week is the real thing and the weekend is a pause in it. You like your time structured, and you keep it that way.";
  if(v<=40) return "The week carries more weight for you. Free days are good, but the shape of your time is built on the working ones.";
  if(v<=55) return "Dead even. The plan and the pause weigh the same to you, and you won’t rank one over the other.";
  if(v<=80) return "You tilt toward the weekend. The week runs fine, but it mostly exists to get you to the open days.";
  return "You live for the weekend. The week is the price of it, and the free days are the point.";
}
function personalNote(qid){
  const D=derive();
  if(qid==='month'){
    const m=val(ans('month'),D);
    return {t:m, b:MONTH_READ[m]||''};
  }
  if(qid==='alarms'){
    const n=rayCountFromAnswers();
    return {t:(n===0?'No snooze':n===1?'1 snooze':n+' snoozes'), b:ALARM_READ[n]||''};
  }
  if(qid==='vacations'){
    const v=String(ans('vacations'));
    return {t:(v==='4+'?'4+ memories':v+(v==='1'?' memory':' memories')), b:VAC_READ[v]||''};
  }
  if(qid==='febdays'){
    const v=String(ans('febdays'));
    return {t:v+' days', b:BORN_READ[v]||''};
  }
  if(qid==='decades'){
    const R=barRing(BANK.decades);
    return {t:R.cur+' years', b:DECADE_READ[R.cur]||''};
  }
  if(qid==='sixweek'){
    /* same guard as the lattice itself: a non-numeric answer falls to the
       bar's centre, so the card can never read a side nobody picked */
    const raw=ans('sixweek');
    const v=Number.isFinite(+raw)?+raw:50;
    return {t:BANK.sixweek.display(v), b:sixweekRead(v)};
  }
  if(qid==='saying'){
    const v=String(ans('saying'));
    return {t:v, b:SAYING_READ[v]||''};
  }
  if(qid==='grid'){
    /* the grid's OWN card: a plain statement of what its two questions (shape,
       density) told the system about you. Nothing to state until at least the
       shape is chosen — before that the ground is bare and says nothing. */
    if(!isChosen('shape')) return null;
    return {t:'Your time', b:gridNote()};
  }
  return null;
}
/* one line per word — the read behind the pair the poster prints */
const SAYING_READ={
  Trust:"Still here. You let time hold you, and it does. What matters doesn’t leave.",
  Worry:"What now. You live a step ahead of the moment, scanning for the next thing.",
  Presence:"Right now. You keep arriving in the moment you’re actually in.",
  Regret:"Long gone. Part of you stays turned toward what already happened."
};
const hoverCard=document.createElement('div');
hoverCard.id='hoverCard';
hoverCard.innerHTML='<p class="hc-t"></p><p class="hc-b"></p>';

/* The BACKGROUND GRID's reading, shown on its OWN hover card. It states plainly
   what its two questions established about you: how you experience time (shape)
   and how much of it you feel you have (density). Kept factual, not poetic.
   The density line only prints once its question has actually been chosen —
   the grid may be standing on density's default while question two is still
   ahead, and that default is nobody's answer. */
function gridNote(){
  const shape = ans('shape')==='circle'
    ? 'You feel time carries you along with it.'
    : 'You feel time moves on without you.';
  const DENS={little:'You feel you have too little of it.',
              enough:'You feel you have about enough of it.',
              plenty:'You feel you have plenty of it.'};
  const dens = isChosen('density') ? (DENS[ans('density')]||DENS.enough) : '';
  return dens ? shape+' '+dens : shape;
}
document.body.appendChild(hoverCard);
function showHoverNote(qid, hl){
  const note=personalNote(qid); if(!note) return;
  const t=hoverCard.querySelector('.hc-t'), b=hoverCard.querySelector('.hc-b');
  t.textContent=note.t; b.textContent=note.b;
  const fr=frame.getBoundingClientRect(), cell=cellSize(), o=gridOrigin();
  /* type + padding measured in cells, exactly like the question cards */
  hoverCard.style.width=(NOTE_CELLS*cell).toFixed(1)+'px';
  hoverCard.style.height='auto';
  hoverCard.style.padding=(Q_INSET*cell).toFixed(1)+'px';
  t.style.fontSize=(Q_HFS*1.15*cell).toFixed(1)+'px';
  t.style.marginBottom=(Q_HGAP*cell).toFixed(1)+'px';
  b.style.fontSize=(Q_HFS*cell).toFixed(1)+'px';
  b.style.lineHeight=(Q_HLH*cell).toFixed(1)+'px';
  hoverCard.classList.add('on');
  /* The box's natural height (title + body + padding) almost never lands on a
     whole cell, so it used to end partway through a square — the one part of
     this card that wasn't on the lattice. Rounded up to the next whole cell,
     same as the question panels (see panelHeightCells). */
  const ch=Math.ceil(hoverCard.offsetHeight/cell-0.01)*cell;
  hoverCard.style.height=ch.toFixed(1)+'px';
  /* PINNED TO THE RIGHT MARGIN, not to the sheet: its right edge sits SIDE_CELLS
     in from the screen's right edge, the same inset the questions take on the
     left, so the two columns balance the poster between them (Karin, 16 Aug).
     Vertically CENTRED on the hovered element. Both edges snapped to the grid. */
  const phaseX=((o.x%cell)+cell)%cell, phaseY=((o.y%cell)+cell)%cell;
  const er=(hl&&hl.getBoundingClientRect)?hl.getBoundingClientRect():fr;
  const cw=NOTE_CELLS*cell;
  /* the last grid line at or before the right edge, then SIDE_CELLS back in and
     the card's own width — and never so far left that it lands on the sheet.
     No extra cell of air off the sheet: the union already carries one, which is
     the cell the width budget hands the note (see SIDE_CELLS).
     Shifted one further cell in from that margin (Karin): the note sat right at
     the SIDE_CELLS inset the questions use, which read as flush with the edge
     rather than sitting comfortably inside it. */
  const lastLineX=phaseX+Math.floor((window.innerWidth-phaseX)/cell)*cell;
  const wantLeft=lastLineX-(SIDE_CELLS+NOTE_CELLS)*cell+cell;
  const minLeft =phaseX+Math.ceil((fr.right-phaseX)/cell)*cell+cell;
  const left=Math.max(wantLeft, minLeft);
  let top=phaseY+Math.round(((er.top+er.height/2)-ch/2-phaseY)/cell)*cell;
  /* keep the card's FOOT at least one cell above the sheet's bottom line — a mark
     at the very foot (the decades band) would otherwise centre the card off the
     bottom edge. Snap the ceiling down to a grid line so it stays on the lattice. */
  const maxTop=phaseY+Math.floor((fr.bottom-cell-ch-phaseY)/cell)*cell;
  top=Math.max(phaseY, Math.min(top, maxTop));
  hoverCard.style.left=left.toFixed(1)+'px';
  hoverCard.style.top=top.toFixed(1)+'px';
}
const hideHoverNote=()=>hoverCard.classList.remove('on');
world.addEventListener('mouseover',e=>{

/* =====================================================================
   Data collection

   Three destinations, all optional and independent:
     1. A webhook. Set CONFIG.DATA_ENDPOINT, or append ?endpoint=https://...
        to the page URL to test one without editing the file.
     2. The browser itself. Every response is kept in localStorage so they
        accumulate while you test, and can be exported as JSON or CSV.
     3. postMessage to the parent frame, for when this is embedded.
   submit() runs after every answer, so a response that is abandoned
   half-way through is still captured.
   ===================================================================== */
const STORE_KEY='timeArch.responses';
let RESPONSES=[];
try{ RESPONSES=JSON.parse(localStorage.getItem(STORE_KEY)||'[]'); }catch(e){ RESPONSES=[]; }
function persist(){
  try{ localStorage.setItem(STORE_KEY,JSON.stringify(RESPONSES)); }catch(e){}
}
try{
  const ep=new URLSearchParams(location.search).get('endpoint');
  if(ep && /^https:\/\//.test(ep)) CONFIG.DATA_ENDPOINT=ep;
}catch(e){}

function payload(status){
  const D=derive();
  /* A skipped question reports null, not its default. Recording the default
     would put an answer in the data that nobody gave, and it would be
     indistinguishable from someone who genuinely accepted it. */
  const answers={}, touched={}, skipped={};
  ASKED.forEach(q=>{
    skipped[q.id]=isSkipped(q.id);
    answers[q.id]=isSkipped(q.id) ? null : ans(q.id);
    touched[q.id]=!!S.touched[q.id];
  });
  return {
    type:'timeArch',
    status,                                  // 'partial' | 'complete'
    id:'TA-'+S.seed.toString(16).toUpperCase().slice(0,6),
    at:new Date().toISOString(),
    seed:S.seed,
    /* Always null now — nothing collects a name or a birthdate since the
       opening screen dropped its fields. The block stays so responses already
       in storage keep the same shape, and so restoring the fields does not
       need a schema change; see CONFIG.SHOW_OPENING. */
    profile:{
      name:S.name.trim()||null,
      date_of_birth:S.dob||null,
      age:D.age||null,
      age_source:D.knownAge?(D.ageFromDob?'date_of_birth':'entered'):null
    },
    context:{
      today:D.today.toISOString().slice(0,10),
      days_lived:D.daysLived,
      days_to_birthday:D.daysToBirthday,
      viewport:window.innerWidth+'x'+window.innerHeight,
      /* the format is not an answer, but the poster cannot be reproduced from
         the seed without it, so it belongs in the record */
      format:S.format,
      format_ratio:FMT().ratio
    },
    /* Not answers — nobody chose these and they say nothing about the person.
       Recorded anyway because the poster cannot be rebuilt without them: only
       the ids that were actually rolled, so an untouched session stays empty
       rather than reporting three defaults as if they were decisions. */
    rolls:{...S.rolls},
    asked:ASKED.map(q=>q.id),
    answered:ASKED.filter(q=>isAnswered(q.id)).map(q=>q.id),
    passed:ASKED.filter(q=>isSkipped(q.id)).map(q=>q.id),
    answers,
    touched,                                 // did the person actually choose, or is this the standing value
    skipped                                  // ...or did they decline to answer at all
  };
}

let lastPayload=null, lastSig='';
function submit(status){
  const data=payload(status||'partial');
  lastPayload=data;
  /* skip a resubmit that carries nothing new */
  const sig=data.status+'|'+JSON.stringify(data.answers)+'|'+JSON.stringify(data.answered)
          + '|'+JSON.stringify(data.rolls);   // a re-roll alone changes the poster
  if(sig===lastSig) return data;
  lastSig=sig;

  /* one record per session, updated in place as answers come in */
  const at=RESPONSES.findIndex(r=>r.seed===data.seed);
  if(at>=0) RESPONSES[at]=data; else RESPONSES.push(data);
  persist();

  if(CONFIG.POST_TO_PARENT && window.parent!==window){
    try{ window.parent.postMessage(data,'*'); }catch(e){}
  }
  if(CONFIG.DATA_ENDPOINT){
    fetch(CONFIG.DATA_ENDPOINT,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify(data)
    }).catch(err=>console.warn('[timeArch] endpoint failed:',err));
  }
  console.log('[timeArch]',data.status,data.id,data.answers);
  renderStatus();
  return data;
}

/* ---- export what has been collected ---- */
function responsesCSV(){
  const ids=[...new Set(RESPONSES.flatMap(r=>r.asked))];
  const head=['id','status','at','seed','name','date_of_birth','age','age_source',
              'days_lived','days_to_birthday','viewport','format','format_ratio',
              ...ids, ...ids.map(i=>i+'_touched'), ...ids.map(i=>i+'_skipped')];
  const cell=v=>{
    if(v===null||v===undefined) return '';
    const t=String(v);
    return /[",\n]/.test(t) ? '"'+t.replace(/"/g,'""')+'"' : t;
  };
  const rows=RESPONSES.map(r=>[
    r.id,r.status,r.at,r.seed,r.profile.name,r.profile.date_of_birth,r.profile.age,r.profile.age_source,
    r.context.days_lived,r.context.days_to_birthday,r.context.viewport,
    r.context.format,r.context.format_ratio,
    ...ids.map(i=>r.answers?r.answers[i]:''),
    ...ids.map(i=>r.touched?r.touched[i]:''),
    ...ids.map(i=>r.skipped?r.skipped[i]:'')
  ].map(cell).join(','));
  return [head.join(','),...rows].join('\n');
}
function downloadResponses(kind){
  if(kind==='csv') download(new Blob([responsesCSV()],{type:'text/csv;charset=utf-8'}),'time-responses.csv');
  else download(new Blob([JSON.stringify(RESPONSES,null,2)],{type:'application/json'}),'time-responses.json');
}
async function copyPayload(){
  const text=JSON.stringify(lastPayload||payload('partial'),null,2);
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){ console.log(text); return false; }
}

/* ---------- export ---------- */
/* the format goes in the filename, so exporting the same poster at three
   formats gives three files rather than three overwrites */
const fileBase=()=>'time-'+((S.name.trim()||'poster').replace(/\s+/g,'-').toLowerCase())
                 +'-'+S.format;
function download(blob,name){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1200);
}
function exportSVG(){ download(new Blob([buildSVG()],{type:'image/svg+xml'}), fileBase()+'.svg'); }

/* No font embedding step: the poster carries no text, so there is nothing to
   embed. This used to fetch Google Fonts and base64-inline two woff2 files on
   the first export — a real round-trip — and then splice them into a <style>
   tag that buildSVG no longer emits, so the splice silently did nothing. */
async function exportPNG(){
  const btn=document.getElementById('dlPng'), old=btn.textContent;
  btn.textContent='Exporting…'; btn.disabled=true;
  try{
    const svg=buildSVG();
    const img=new Image(), scale=2.6;
    const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}));
    await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src=url; });
    const c=document.createElement('canvas');
    const B=box();                       // the current format's own pixel box
    c.width=B.w*scale; c.height=B.h*scale;
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url);
    c.toBlob(b=>{ if(b) download(b, fileBase()+'.png'); },'image/png');
  }catch(e){ exportSVG(); }
  finally{ btn.textContent=old; btn.disabled=false; }
}



/* ---------------------------------------------------------------------
   The snake's events, delegated once on #qsys — renderSnake replaces its
   innerHTML on every repaint, so per-element listeners would have to be
   re-bound each time and one missed rebind is a dead control.
   --------------------------------------------------------------------- */
let dialDrag=null, barDrag=null;
qsys.addEventListener('click',e=>{
  const save=e.target.closest('.qsave');
  if(save){ saveAnswer(); renderSnake(); return; }
  const mo=e.target.closest('.mring .mo');
  if(mo){
    const cur=snakeQ();
    if(cur){
      S.answers[cur.id]=mo.dataset.val; S.touched[cur.id]=true;
      const q=BANK[cur.id];
      if(q && q.onPick) q.onPick(); else draw();
      renderSnake();
    }
    return;
  }
  /* .qduo/.qfill are the shape and density controls, carried over from the old
     landing screens — HTML buttons like .qopts, registering the same way */
  const opt=e.target.closest('.qopts button, .qduo button, .qfill button');
  if(opt){
    const cur=snakeQ();
    if(cur){
      S.answers[cur.id]=opt.dataset.val; S.touched[cur.id]=true;
      const q=BANK[cur.id];
      if(q && q.onPick) q.onPick(); else draw();
      renderSnake();
    }
    return;
  }
  /* the vacations circles and the february cards register the same way a card does */
  const disc=e.target.closest('.vcirc .vc, .fcard .fc, .cway .cw');
  if(disc){
    const cur=snakeQ();
    if(cur){
      /* colourway has a twist: clicking the ALREADY-chosen swatch flips its two
         inks (the ⇄ glyph on it advertises this); a different swatch just selects
         it, in its natural orientation. */
      if(cur.id==='colorway'){
        const val=disc.dataset.val, isRandom=(val==='random');
        if(String(S.answers.colorway)===String(val)){
          /* re-picking the chosen swatch: a fixed pair FLIPS its two inks; 'random'
             ROLLS a fresh pair. Either way the sheet dissolves to the new colours
             while the swatch spins, then the panel settles. */
          if(isRandom) rollRandomPair(); else S.colorSwap=!S.colorSwap;
          if(reduceMotion && reduceMotion()) draw(); else crossfadePoster();
          spinSwatch(disc, ()=>renderSnake());
        } else {
          S.colorSwap=false;
          if(isRandom) rollRandomPair();          // first pick rolls the opening pair
          S.answers.colorway=val; S.touched.colorway=true;
          draw(); renderSnake();
        }
        return;
      }
      S.answers[cur.id]=disc.dataset.val; S.touched[cur.id]=true;
      const q=BANK[cur.id];
      if(q && q.onPick) q.onPick(); else draw();
      renderSnake();
    }
    return;
  }
  /* dial taps are handled in pointerup (pointerdown preventDefault eats this click) */
  const past=e.target.closest('.qstep.past');
  if(past){
    const n=ASKED.findIndex(q=>q.id===past.dataset.qid);
    if(n>=0){ snakeAt=n; closeCard(false); renderSnake(); draw(); }
  }
});
qsys.addEventListener('keydown',e=>{
  const barSvg=e.target.closest('.qpanel svg.bar');
  if(barSvg){
    const k = e.key==='ArrowRight'||e.key==='ArrowUp' ? 1
            : e.key==='ArrowLeft' ||e.key==='ArrowDown' ? -1 : 0;
    if(k){ e.preventDefault();
      const cur=snakeQ();
      if(cur) barTurn(cur.id, barRing(BANK[cur.id]).idx + k); }
    return;
  }
  const svg=e.target.closest('.qpanel svg.dial');
  if(svg){
    const k = e.key==='ArrowRight'||e.key==='ArrowUp' ? 1
            : e.key==='ArrowLeft' ||e.key==='ArrowDown' ? -1 : 0;
    if(k){
      e.preventDefault();
      const cur=snakeQ();
      if(cur) dialTurn(cur.id,k);
    }
    return;
  }
  const cell=e.target.closest('.qstep.past');
  if(cell && (e.key==='Enter'||e.key===' ')){ e.preventDefault();
    const n=ASKED.findIndex(q=>q.id===cell.dataset.qid);
    if(n>=0){ snakeAt=n; closeCard(false); renderSnake(); draw(); } }
});
/* Dragging the wheel. Travel is measured in CELLS, not pixels, so the wheel
   turns at the same rate relative to the design at any window size. */
qsys.addEventListener('pointerdown',e=>{
  /* the horizon first. A CLICK springs to the stop under the point pressed; a DRAG
     moves the handle 1:1 with the finger along the track, RELATIVE to where the
     press landed — so the handle never jumps out from under you on touch-down the
     way an absolute slider does. Past either end the travel is damped rather than
     stopped (see barRubber), and the release settles onto the nearest stop. */
  const barSvg=e.target.closest('.qpanel svg.bar');
  if(barSvg){
    const cur=snakeQ(); if(!cur) return;
    cancelAnimationFrame(barRAF);
    const R=barRing(BANK[cur.id]);
    const p0=R.n>1 ? R.idx/(R.n-1) : 0;
    barDrag={qid:cur.id, moved:false, startX:e.clientX, startP:p0, pid:e.pointerId,
             tw:barTrackClient(barSvg), downIdx:barIdxFromEvent(barSvg,e.clientX)};
    barLive={qid:cur.id, p:p0};
    /* CAPTURE ON qsys, NOT ON THE SVG. Every stop the finger crosses banks the
       answer, and banking re-renders the panel — which destroys the svg the
       capture was on. The capture dies with it, and from then on the drag only
       survives while the pointer happens to still be over the new svg: slide a
       few pixels off the control, or off the panel, and the move events stop
       arriving and the handle sticks. qsys is the element the listeners are on
       and the one thing here that is never rebuilt. */
    qsys.setPointerCapture(e.pointerId);
    e.preventDefault();
    return;
  }
  /* .dial, not any svg in the panel: the month ring is an svg too, and capturing
     the pointer here killed the click that chose a month. */
  const svg=e.target.closest('.qpanel svg.dial');
  if(!svg) return;
  const cur=snakeQ();
  if(!cur) return;
  /* remember the number under the finger: if the press ends without turning into
     a drag, that is a TAP and we jump straight to it (preventDefault below eats
     the click event, so tap-to-select is handled here, not by the click handler). */
  dialDrag={x:e.clientX, qid:cur.id, taken:0, hit:e.target.closest('.dial-hit')};
  svg.setPointerCapture(e.pointerId);
  e.preventDefault();
});
qsys.addEventListener('pointermove',e=>{
  if(barDrag){
    const R=barRing(BANK[barDrag.qid]);
    const dx=e.clientX-barDrag.startX;
    if(Math.abs(dx)>3) barDrag.moved=true;
    const p=barRubber(barDrag.startP + dx/barDrag.tw);
    barLive={qid:barDrag.qid, p};
    /* the stop the handle is nearest, from the UNSTRETCHED position, so the
       rubber band at the ends cannot ask for an index that is not there */
    const want=Math.max(0,Math.min(R.n-1, Math.round(Math.max(0,Math.min(1,p))*(R.n-1))));
    /* crossing a stop banks the answer and repaints the poster's brick band; the
       rebuilt panel reads barLive, so the handle stays under the finger. Between
       crossings nothing is rebuilt and the handle is just moved. */
    if(want!==R.idx) barTurn(barDrag.qid, want, true);
    else paintBar(p);
    return;
  }
  if(!dialDrag) return;
  const per=DIAL.dragPerStep*cellSize();
  const want=Math.round((e.clientX-dialDrag.x)/per);
  /* animate every step the drag crosses — the swap must be seen turning, not cut,
     so dragging spins with the same grow/shrink settle as a click (no noSpin). */
  if(want!==dialDrag.taken){ dialTurn(dialDrag.qid, want-dialDrag.taken); dialDrag.taken=want; }
});
qsys.addEventListener('pointerup',()=>{
  /* a press that never became a drag is a tap on the track — spring to that stop */
  if(barDrag){
    const d=barDrag; barDrag=null;
    try{ qsys.releasePointerCapture(d.pid); }catch(_){}
    if(!d.moved){ barLive=null; barTurn(d.qid, d.downIdx); return; }
    /* THE RECOIL. Let go of something stretched and it does not glide to rest,
       it springs past and comes back — so the release uses the back curve, not
       the flat one. It is the same easing a tap uses, and deliberately: letting
       go IS the same event as arriving, and the bar should behave the one way. */
    const R=barRing(BANK[d.qid]);
    const to=R.n>1 ? R.idx/(R.n-1) : 0;
    runBar(barLive?barLive.p:to, to, true, ()=>{ barLive=null; renderSnake(); });
    return;
  }
  /* a press that never became a drag is a tap on a number — select it, animated */
  if(dialDrag && dialDrag.taken===0 && dialDrag.hit){
    dialTurn(dialDrag.qid, +dialDrag.hit.dataset.step);
  }
  dialDrag=null;
});
qsys.addEventListener('pointercancel',()=>{
  dialDrag=null;
  if(barDrag){
    try{ qsys.releasePointerCapture(barDrag.pid); }catch(_){}
    barDrag=null; barLive=null; cancelAnimationFrame(barRAF); renderSnake();
  }
});

/* ---------- boot ---------- */
if(CONFIG.FORMAT_SWITCHER){
  buildFmtControl();
} else {
  /* switcher off: the control is fully inert rather than merely unstyled —
     display:none takes it out of layout AND out of hit-testing, so there is no
     empty 2x2-cell dead zone sitting in the corner. computeDots already stops
     reserving space for it (see the FORMAT_SWITCHER check above), and its click
     listeners below never fire because nothing is there to click. */
  fmtBtn.style.display='none';
  fmtMenu.style.display='none';
}
/* Preload the month layer's font at boot, well before Q3 can be reached (it is
   the third LINEAR_LEAD question, so there are always at least two other picks
   first). ensureMonthFont's own redraw-on-load still fires as a safety net if
   the load is somehow still pending, but by Q3 it is normally already 'ready',
   so the grow-in entrance starts on the SAME frame as the pick — no visible
   delay waiting on a font fetch. */
ensureMonthFont();
newSeed();
buildLogo();
relayout();

/* SKIP THE OPENING — a development convenience, not a feature.
   Add ?skip to the URL and the opening screen is bypassed: the board opens on
   question one, exactly where START would have landed you. Nothing else
   behaves differently, so what you see past this point is what everyone sees.

   Driven by the URL rather than by CONFIG on purpose: a flag in the source is
   one someone forgets to turn back off before sharing the file, and this one
   would silently rob every visitor of the opening. A query string cannot
   travel by accident.

   file:///.../architecture-of-time.html?skip                                */
const SKIP_OPENING=/(^|[?&])skip(=|&|$)/.test(location.search);
if(SKIP_OPENING){
  skipOpening();
} else if(!S.baseDone) showIntro();
</script>
