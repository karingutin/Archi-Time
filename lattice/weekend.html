  const rect = canvas.getBoundingClientRect();
  const clientX = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
  const clientY = (e.touches && e.touches[0]) ? e.touches[0].clientY : e.clientY;
  const px = (clientX - rect.left) * (canvas.width / rect.width);
  const py = (clientY - rect.top) * (canvas.height / rect.height);
  const g = gridGeom;
  const col = Math.floor((px - g.offsetX) / g.cellSize);
  const row = Math.floor((py - g.offsetY) / g.cellSize);
  return { col, row };
}

// Apply the brush footprint (square block, brush_size cells) around col/row.
function applyBrush(col, row) {
  const g = gridGeom;
  const brush = Math.max(1, Math.round(controls.get('brush_size') || 1));
  const rad = Math.floor((brush - 1) / 2);
  const extra = (brush - 1) % 2;   // even sizes bias +1 on the high side
  for (let dr = -rad; dr <= rad + extra; dr++) {
    for (let dc = -rad; dc <= rad + extra; dc++) {
      const cc = col + dc;
      const rr = row + dr;
      if (cc < 0 || rr < 0 || cc >= g.cols || rr >= g.rows) continue;
      // Normalize by CELL COUNT so the position tracks the grid across
      // resolution changes (u = col/cols, v = row/rows).
      const u = g.cols > 0 ? cc / g.cols : 0;
      const v = g.rows > 0 ? rr / g.rows : 0;
      const key = normKey(u, v);
      // Guard per (mode, cell) so the same cell can be erased then painted
      // (or vice versa) within one stroke if Alt is toggled mid-drag, while
      // still ignoring jitter that re-touches a cell in the same mode.
      const guardKey = (erasing ? 'e:' : 'p:') + key;
      if (strokeTouched.has(guardKey)) continue;
      strokeTouched.add(guardKey);
      if (erasing) {
        // Erase removes any painted cell AND records an erased override so a
        // generated cell under the cursor stays gone across re-render.
        paintedStore.delete(key);
        erasedStore.set(key, { u, v });
      } else {
        // Paint adds a cell and clears any prior erase at this spot.
        erasedStore.delete(key);
        paintedStore.set(key, { u, v });
      }
    }
  }
}

canvas.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;    // left button only
  painting = true;
  // Combine the live Alt state with the event flag — a stationary Alt-click
  // erases even if the keydown listener hasn't fired yet.
  erasing = altHeld || e.altKey;
  strokeTouched = new Set();
  const { col, row } = eventToCell(e);
  applyBrush(col, row);
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
});

canvas.addEventListener('pointermove', (e) => {
  if (!painting) return;
  // Re-read Alt each move so switching the key mid-drag flips the mode.
  erasing = altHeld || e.altKey;
  const { col, row } = eventToCell(e);
  applyBrush(col, row);
});

function endStroke() {
  if (!painting) return;
  painting = false;
  erasing = false;
  strokeTouched = new Set();
  controls.set('canvasState', snapshotState());   // persist on stroke end
}

canvas.addEventListener('pointerup', endStroke);
canvas.addEventListener('pointercancel', endStroke);

// Clear both stores.
controls.onAction('clear_painted', () => {
  paintedStore.clear();
  erasedStore.clear();
  controls.set('canvasState', snapshotState());
});

// Initial cursor — paint mode until Alt is held.
updateCursor();

// Restore persisted edits, and rebuild on Reset / external set.
applyState(controls.get('canvasState'));
controls.onChange('canvasState', applyState);

function draw() {
  const w = canvas.width;
  const h = canvas.height;

  ctx.clearRect(0, 0, w, h);

  // ---- DERIVE GRID FROM CELL SIZE ----------------------------------------
  // Square Size is an absolute pixel cell size. cols/rows derive from it and
  // the canvas. Leftover remainder is split evenly as margin to center.
  const cellSize = Math.max(4, controls.get('square_size') || 24);
  const cols = Math.max(1, Math.floor(w / cellSize));
  const rows = Math.max(1, Math.floor(h / cellSize));
  const offsetX = (w - cols * cellSize) / 2;
  const offsetY = (h - rows * cellSize) / 2;

  // Rebuild the grid whenever structure OR manual edits change. Folding the
  // store sizes into the signature means each edit re-runs generation from a
  // clean base, so un-erasing (removing from erasedStore) restores the
  // original generated cell instead of leaving a stale deactivation.
  const sig = structuralSig(cols, rows) + '|' + paintedStore.size + '|' + erasedStore.size;
  if (sig !== lastSig) {
    generateGrid(cols, rows);
    lastSig = sig;
  }

  // Capture geometry so pointer handlers map to the CURRENT resolution.
  gridGeom = { cellSize, cols, rows, offsetX, offsetY };

  // ---- MERGE MANUAL OVERRIDES ONTO THE GENERATED GRID --------------------
  // Erased first (removes generated + painted), then painted (adds). Both are
  // keyed by normalized u,v and mapped back to col/row for the current grid,
  // so manual edits survive Square Size changes. The merged result flows into
  // the same two-pass fill/stroke render below — never drawn on top after.
  if (erasedStore.size) {
    for (const e of erasedStore.values()) {
      const c = Math.round(e.u * cols);
      const r = Math.round(e.v * rows);
      if (c < 0 || r < 0 || c >= cols || r >= rows) continue;
      if (cells[r] && cells[r][c]) cells[r][c].active = false;
    }
  }
  if (paintedStore.size) {
    for (const e of paintedStore.values()) {
      const c = Math.round(e.u * cols);
      const r = Math.round(e.v * rows);
      if (c < 0 || r < 0 || c >= cols || r >= rows) continue;
      if (!cells[r] || !cells[r][c]) continue;
      if (!cells[r][c].active || !cells[r][c].__painted) {
        const nc = makePaintedCell(c, r);
        nc.__painted = true;
        cells[r][c] = nc;
      }
    }
  }

  const fillColor = controls.get('fill_color');
  const shapeColor = controls.getColorWithAlpha('shape_color');
  const shapeColorSolid = controls.get('shape_color');
  const invertRatio = (controls.get('invert_ratio') || 0) / 100;
  const lineThickness = controls.get('line_thickness');
  const shapeScale = controls.get('shape_scale') / 100;
  const showFrames = controls.get('show_frames');
  const frameOpacity = controls.get('frame_opacity') / 100;
  const showStroke = controls.get('show_stroke');
  const mouseReaction = controls.get('mouse_reaction');
  const reactionRadius = controls.get('reaction_radius');
  const reactionIntensity = controls.get('reaction_intensity') / 5;

  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // All shape geometry is a FRACTION of the current cell size — nothing is
  // scaled from a baseline drawing.
  const radius = cellSize * shapeScale * 0.5;
  const dpr = window.devicePixelRatio || 1;

  // ---- PHASE 1: FILL PASS (entire grid, before any stroke) ---------------
  // Normal cell  → filled with Square Fill Color.
  // Inverted cell → filled with Stroke (shape) Color.
  // Fill rects use integer bounds that perfectly abut (ceil next edge − floor
  // this edge) so adjacent inverted cells leave NO sub-pixel background seam.
  if (showFrames && frameOpacity > 0) {
    ctx.save();
    ctx.globalAlpha = frameOpacity;
    for (let r = 0; r < gridRows; r++) {
      for (let c = 0; c < gridCols; c++) {
        const cell = cells[r][c];
        if (!cell.active) continue;
        const inverted = isInverted(cell, invertRatio);
        const x0 = Math.floor(offsetX + c * cellSize);
        const y0 = Math.floor(offsetY + r * cellSize);
        const x1 = Math.ceil(offsetX + (c + 1) * cellSize);
        const y1 = Math.ceil(offsetY + (r + 1) * cellSize);
        ctx.fillStyle = inverted ? shapeColorSolid : fillColor;
        ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
      }
    }
    ctx.restore();
  }

  // ---- PHASE 2: SEGMENT COLLECTION (split by invert flag) -----------------
  const normalSegments = [];    // { x1, y1, x2, y2 }
  const invertedSegments = [];
  const normalArcs = [];        // { cx, cy, r }
  const invertedArcs = [];

  function xform(px, py, cx, cy, rot, scl) {
    const dx = px * scl;
    const dy = py * scl;
    const cs = Math.cos(rot);
    const sn = Math.sin(rot);
    return [cx + dx * cs - dy * sn, cy + dx * sn + dy * cs];
  }

  let curSegs = normalSegments;   // retargeted per cell to its bucket
  function addSeg(x1, y1, x2, y2) {
    curSegs.push({ x1, y1, x2, y2 });
  }

  for (let r = 0; r < gridRows; r++) {
    for (let c = 0; c < gridCols; c++) {
      const cell = cells[r][c];
      if (!cell.active) continue;

      const inverted = isInverted(cell, invertRatio);
      // Only the INNER MARK flips color on an inverted cell. The square border
      // stays Stroke Color on every cell, so it always lands in the normal
      // buckets. The mark routes to the inverted buckets only when inverted.
      const curArcs = inverted ? invertedArcs : normalArcs;

      const cx = offsetX + (c + 0.5) * cellSize;
      const cy = offsetY + (r + 0.5) * cellSize;
      const half = cellSize * 0.5;

      // Cell border segments — ALWAYS Stroke Color (normal bucket), inverted
      // or not, so the red lattice stays intact. Shared edges deduped later.
      if (showStroke) {
        curSegs = normalSegments;
        const l = cx - half, rr = cx + half, t = cy - half, b = cy + half;
        addSeg(l, t, rr, t);
        addSeg(rr, t, rr, b);
        addSeg(rr, b, l, b);
        addSeg(l, b, l, t);
      }

      // Inner mark segments route to the cell's bucket (inverted flips color).
      curSegs = inverted ? invertedSegments : normalSegments;

      // Mouse-reaction transform (absolute-space rotation/scale).
      let targetRot = 0;
      let targetScale = 1;
      if (mouseReaction && mouse.active) {
        const dist = Math.hypot(mouse.x - cx, mouse.y - cy);
        if (dist < reactionRadius) {
          const factor = (1 - dist / reactionRadius) * reactionIntensity;
          targetRot = factor * Math.PI * 0.75;
          targetScale = 1 + factor * 0.45;
        }
      }
      cell.currentRotation += (targetRot - cell.currentRotation) * 0.12;
      cell.currentScale += (targetScale - cell.currentScale) * 0.12;
      const rot = cell.currentRotation;
      const scl = cell.currentScale;

      switch (cell.shape) {
        case 'circle': {
          curArcs.push({ cx, cy, r: radius * scl });
          break;
        }
        case 'plus': {
          let a = xform(-radius, 0, cx, cy, rot, scl);
          let bb = xform(radius, 0, cx, cy, rot, scl);
          addSeg(a[0], a[1], bb[0], bb[1]);
          a = xform(0, -radius, cx, cy, rot, scl);
          bb = xform(0, radius, cx, cy, rot, scl);
          addSeg(a[0], a[1], bb[0], bb[1]);
          break;
        }
        case 'cross': {
          let a = xform(-radius, -radius, cx, cy, rot, scl);
          let bb = xform(radius, radius, cx, cy, rot, scl);
          addSeg(a[0], a[1], bb[0], bb[1]);
          a = xform(radius, -radius, cx, cy, rot, scl);
          bb = xform(-radius, radius, cx, cy, rot, scl);
          addSeg(a[0], a[1], bb[0], bb[1]);
          break;
        }
        case 'diagonal': {
          const dir = cell.diagonalDirection;
          const a = xform(-radius, -radius * dir, cx, cy, rot, scl);
          const bb = xform(radius, radius * dir, cx, cy, rot, scl);
          addSeg(a[0], a[1], bb[0], bb[1]);
          break;
        }
      }
    }
  }

  // ---- PHASE 3: DEDUPE (each bucket independently) ------------------------
  const qp = (v) => Math.round(v * 100) / 100;
  function dedupe(segs) {
    const seen = new Set();
    const out = [];
    for (const s of segs) {
      let a = [qp(s.x1), qp(s.y1)];
      let b = [qp(s.x2), qp(s.y2)];
      if (a[0] > b[0] || (a[0] === b[0] && a[1] > b[1])) { const tmp = a; a = b; b = tmp; }
      const key = a[0] + ',' + a[1] + '-' + b[0] + ',' + b[1];
      if (seen.has(key)) continue;
      seen.add(key);
      out.push(s);
    }
    return out;
  }
  const normalUnique = dedupe(normalSegments);
  const invertedUnique = dedupe(invertedSegments);

  // ---- PHASE 4: PIXEL SNAP + PHASE 5: UNIFIED STROKE (ordered) -----------
  const lw = Math.max(1, Math.round(lineThickness));
  const oddOffset = (lw % 2 === 1) ? (0.5 / dpr) : 0;
  const snap = (v) => Math.round(v * dpr) / dpr + oddOffset;

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.lineWidth = lw;   // absolute — no scale/transform ever applied

  function strokePass(segs, arcList, color) {
    if (segs.length === 0 && arcList.length === 0) return;
    ctx.strokeStyle = color;
    ctx.beginPath();
    for (const s of segs) {
      ctx.moveTo(snap(s.x1), snap(s.y1));
      ctx.lineTo(snap(s.x2), snap(s.y2));
    }
    for (const arc of arcList) {
      const acx = snap(arc.cx);
      const acy = snap(arc.cy);
      ctx.moveTo(acx + arc.r, acy);
      ctx.arc(acx, acy, arc.r, 0, Math.PI * 2);
    }
    ctx.stroke();
  }

  // Normal cells first — Stroke Color on marks/borders.
  strokePass(normalUnique, normalArcs, shapeColor);
  // Inverted cells last — Square Fill Color, so a shared edge with a normal
  // neighbour always resolves to the inverted color (drawn on top).
  strokePass(invertedUnique, invertedArcs, fillColor);

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
    }

    // System Background Wiring
    if (typeof CanvasRuntimeAPI !== 'undefined') {
      var __sysBgVal = controls.get('__sys_bg');
      if (__sysBgVal) CanvasRuntimeAPI.setBackground(__sysBgVal);
    }
  </script>
