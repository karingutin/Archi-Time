   left to right through the sweep, the field states the sequence.
   --------------------------------------------------------------------- */
const R_STEP=0.17, R_FLOOR=0.52;      // radius falloff per step, and its floor
const O_STEP=0.26, O_FLOOR=0.32;      // brightness falloff per step, and its floor
                                      // — the floor is what keeps the furthest
                                      // question findable rather than merely dim
/* FILL MEANS "STILL TO DO". A filled disc is work waiting; an empty ring is
   work spent. So the loudest marks on the board are always the ones asking for
   something, and answering a question quiets it down.

   This is the reverse of the first version, which filled the ANSWERED dots.
   That read as a progress meter and it fought the eye: completed work was the
   boldest thing on screen while the question you actually had to do next was a
   thin ring. If anyone is tempted to flip it back, that is the reason not to. */
function hierarchy(qid,cell){
  const base=Math.max(7, Math.min(12, cell*0.40));
  /* Behind us: settled. Small, and in the yellow rather than the white — it
     still reads quieter than anything pending, but the hue is now doing that
     work, so it does not have to be faded to the point where the colour stops
     being legible as a colour. Skipped is the same size and hue, hollow and
     broken, and dimmer again. */
  if(isDone(qid)) return isSkipped(qid)
    ? {r:base*0.60, op:0.45, fill:false, done:true, passed:true,  d:-1}
    : {r:base*0.60, op:0.72, fill:false, done:true, passed:false, d:-1};
  const cursor=ASKED.findIndex(q=>!isDone(q.id));
  const rank=ASKED.findIndex(q=>q.id===qid);
  const d=cursor<0 ? 0 : Math.max(0, rank-cursor);
  return {r:base*Math.max(R_FLOOR, 1-R_STEP*d),
          op:Math.max(O_FLOOR, 1-O_STEP*d), fill:true, done:false, passed:false, d};
}

/* =====================================================================
   THE SNAKE — the question system, laid on the interface lattice.

   Measured off the mock (Figma node 2720:3101) and expressed in whole cells,
   because that is what the design is: not a card that floats near a grid, but
   boxes that ARE grid cells.

   THE ONE RULE OF THE COMPOSITION: every part hangs off the previous part's
   corner. The step marker, then the total beside it, then the panel off the
   total's corner, then Save off the panel's corner. Nothing is centred against
   anything, and nothing is spaced by a gap — the parts touch at corners, which
   is what makes the whole thing read as one figure walking down the screen.

   THE SNAKE. Each question's marker steps one cell diagonally from the last.
   When the walk reaches the edge of the free band it reverses its horizontal
   direction and keeps descending — so the trail of answered markers draws a
   serpentine down the board. The trail IS the progress bar; there is no other.

   NOTHING MAY TOUCH THE POSTER. The band is computed against unionBox(), the
   largest footprint ANY format can take — not against the sheet currently
   showing. So a format change can never bring the poster onto a question, in
   exactly the way the old dot field was protected.
   ===================================================================== */
const SNAKE={
  /* every offset below is in cells, from the step marker's own top-left, in the
     mock's own arrangement (the panel opening down and to the right) */
  total:{dx:1, dy:0, w:1, h:1},
  /* Six by SIX, not the mock's six by four. The figure was 5.6% of a 1920x1080
     screen and read as an afterthought beside a poster taking 24%. Width could
     not grow — the clear band beside the poster is 13 cells and the figure is
     11, and those two spare cells are the snake's whole amplitude — but there
     are 24 rows and the figure used 6, so downward was free. Everything inside
     the panel is expressed as a fraction of PANEL_H below, so the interior
     scaled with it instead of being retuned by hand. */
  /* panel.h is NOT here: every question sizes its own panel (see panelSize),
     because a fixed height left the short questions with a field of white
     between the words and the answer. Width stays 6 — that is what the clear
     band beside the poster affords. */
  /* w here is the WIDEST a panel may be — the band is sized for it, so spanW and
     the snake's lanes are computed from this one number whatever an individual
     question asks for. Per-question widths live in PANEL_W. */
  panel:{dx:2, dy:1, w:10},
  /* dx follows the panel's width and dy its height, so Save keeps hanging off
     the panel's lower-right corner whatever size the panel is */
  save: {w:2, h:1},
  /* the figure's worst-case extent, for fitting */
  spanW:14, spanH:10,
  /* Zero. This was a cell of clearance I had added between the figure and the
     poster's keep-out box; spending it on the panel is what the extra width
     costs, and Save may sit flush against that edge. The keep-out box already
     carries a cell of air of its own (see unionBox), so the poster is still
     never touched. */
  air:0,
  /* Cells of drop from the top of the viewport before the first marker. The
     snake used to start hard against the top edge; three cells down gives it
     somewhere to begin from rather than arriving already cut off. Clamped in
     snakeBand so it can never push the last question's Save off the bottom. */
  top:3
};

/* The free band, in grid cells from the origin. Two numbers per axis: the
   viewport's own limit, and the poster union's near edge. */
function snakeBand(){
  const cell=cellSize(), vw=window.innerWidth, vh=window.innerHeight;
  const halfW=Math.floor((vw/2)/cell), halfH=Math.floor((vh/2)/cell);
  /* the union's LEFT edge in cells, since the sheet is no longer centred */
  const uL=unionBox().cl-SNAKE.air;
  /* The marker's column is bounded by where the WHOLE FIGURE still clears the
     poster, not by where the marker alone does. The figure is 11 cells across
     and the clear band beside the poster is about 16 at a desktop width, so the
     slack is only a few columns — which is exactly the amplitude the mock's own
     step from column 1 to column 2 implies. Bounding the marker instead of the
     figure was a bug: it let the walk wander to the union's edge and then had
     nowhere legal to open, and the fallback put the panel on the poster. */
  const iMax=uL-SNAKE.spanW-1;
  /* The drop, but never further than the last question can afford: the figure
     reaches spanH rows below its own marker, and the final marker is (N-1) rows
     below the first, so the whole run has to end above the viewport's edge. */
  /* One row per question, plus the figure reaching below the last marker. */
  const need=Math.max(0, ASKED.length-1) + SNAKE.spanH;
  const jMin=Math.min(-halfH+SNAKE.top, halfH-need);
  return {
    iMin:-halfW, iMax:Math.max(-halfW, Math.min(iMax, uL-SNAKE.spanW-1)),
    jMin, jMax:halfH-1,
    uL, halfW, halfH, cell
  };
}

/* LENGTHWISE — the snake descends. One row down per question, the column
   turning back and forth across the few it has, so every step is diagonal and
   consecutive markers meet at a corner.

   It ran horizontally for one pass and the arithmetic would not close: nine
   markers across plus an eleven-column figure needs twenty columns, and the
   clear band beside the poster is thirteen. Running lengthwise spends the band
   on the FIGURE and the screen's height on the SEQUENCE, which is the way round
   that fits — the figure gets all thirteen columns at every question, so the
   panel can always hang off its own marker's corner.

   A triangle wave, not a sawtooth: reflecting by restarting on the edge column
   would put two questions in the same column, and a step that does not change
   column is a vertical step — the one thing this composition cannot take, since
   every part of it hangs off a CORNER. The wave turns without repeating:
   ...-22,-21,-20,-21,-22,-21... */
function snakeCell(n){
  const B=snakeBand();
  /* TWO columns, alternating — the reference, not a wave across however many the
     band happens to afford. Odd questions on the left column, even on the right,
     one row down each time, so every step is a diagonal of exactly one cell.
     The band is sized so both columns can host the figure (see snakeBand). */
  const lanes=Math.max(1, B.iMax-B.iMin+1);
  return {i:B.iMin+(lanes>1 ? n%2 : 0), j:B.jMin+n};
}

/* The four rects of the figure, given a marker cell and which way it opens.
   sx/sy are ±1; the mock is (+1,+1). Mirroring reflects every offset about the
   marker, so the corners still touch and the figure keeps its shape. */
/* HOW BIG THE PANEL HAS TO BE for this question, in whole cells.

   A fixed 6x6 gave the short questions a field of white between the words and
   the answer and crowded the long ones. So the height is computed: how many
   lines the title wraps to at the panel's width, plus the room this question's
   own control needs, rounded up to whole cells — the grid still decides the
   edges, it just decides a different number of them per question.

   The line count is estimated from the string rather than measured in the DOM
   on purpose: renderSnake builds one markup string with no layout pass in the
   middle, and reading back an element's height would force one on every repaint
   and every keystroke of a drag. An estimate that is occasionally a line out
   costs a cell of white; a layout thrash costs the drag's smoothness. */
/* 0.62 of a cell, up from 0.52 and 0.372 before that: the question is the loudest
   thing in the piece and was reading as caption-sized. The panel is 7 cells wide
   now rather than 6 — the widest the band allows while still leaving the zigzag
   its second column. Only the panel grew; markers and Save are untouched. */
/* ONE HUG FOR THE WHOLE PANEL.
   Q_INSET is the only inset any child of the panel may use, and every one of
   them uses it: the title, the month circles, the binary's two cells, and the
   wheel's arc. They were drifting apart — the title sat 0.44 of a cell off the
   frame and the circles a whole one — and the eye reads that as two different
   panels stacked, because a shared edge is the only thing that says they belong
   to one. If this number changes, everything inside moves together. */
/* MEASURED OFF THE FIGMA NODE (2739:3508), not chosen: the panel there is
   365 x 263, and each number below is that drawing's pixel measure divided by
   its width and multiplied by the panel's ten cells. So they are proportions,
   and they hold at any cell size.
     inset   15/365   title  22/365   leading 32/365
     hint  13.5/365   hint leading 20/365   gap 15/365                        */
const Q_FS=0.603, Q_LH=0.877, Q_INSET=0.411;
const Q_GAP=0.411;                          // cells between the words and the control
/* The small line under the question. Quieter than the question in size and in
   weight of red, because it is an aside — it opens the question up rather than
   restating it, and it must never compete with it for the first read. */
const Q_HFS=0.370, Q_HLH=0.548, Q_HGAP=0.411;
/* WIDTH PER QUESTION, in cells, capped by SNAKE.panel.w.
   The wheel wants the full ten — it is a wide shallow arc and narrowing it makes
   it steep. The month grid reads better square, and at nine the four tangent
   circles and three rows come out 9x9. */
const PANEL_W={number:10, choice:10, duo:10};
const panelW=q=>Math.min(SNAKE.panel.w, PANEL_W[q&&q.type] || SNAKE.panel.w);
/* A HEIGHT A QUESTION IS HELD TO, in cells, overriding what its content adds up
   to. The month panel's own arithmetic came out at 12 — the estimator reads the
   small line as two lines where it sets as one — and 11 is the height it is
   meant to be. Where a question is pinned like this the control is fitted to the
   room left rather than the room asked for, so nothing overflows and no band of
   white is left at the foot. */
/* 1.388 is the node's ratio, so ten cells across is seven down.

   choice is TWELVE, not eleven. The month grid's one hug can only hold on all
   three sides it reaches if the circles are the diameter the WIDTH implies —
   (10 - 2*hug)/4 — and three rows of that need 6.885 cells of room. Eleven left
   6.506, so the diameter was capped, the grid came out narrower than the hugged
   width, and it re-centred to 0.662 from the sides while its foot stayed at
   0.411. Matching the hug is the rule; the height is what follows from it. */
const PANEL_H_FIX={choice:12, number:7};
function panelSize(q){
  const w=panelW(q);
  const inner=w-2*Q_INSET;
  /* average glyph advance for this face at this size, as a fraction of the em */
  const cpl=Math.max(8, Math.floor(inner/(Q_FS*0.52)));
  const title=String(val(q.title,derive()));
  const lines=Math.max(1, Math.ceil(title.length/cpl));
  const hint=String(val(q.hint,derive())||'');
  const hcpl=Math.max(8, Math.floor(inner/(Q_HFS*0.52)));
  const hlines=hint ? Math.max(1, Math.ceil(hint.length/hcpl)) : 0;
  const hintH=hlines ? Q_HGAP + hlines*Q_HLH : 0;
  const ctrl = q.type==='number' ? DIAL_CELLS
             /* the circle grid's REAL height: three rows of a diameter that is
                the hugged width over four, not the raw panel width over four.
                The old figure reserved 0.66 of a cell that nothing occupied,
                which rounded the panel up a whole cell too tall. */
             : q.type==='choice' ? 3*((w-2*Q_INSET)/4)
             : 1.1;
  const h=Q_INSET + lines*Q_LH + hintH + Q_GAP + ctrl + Q_INSET;
  const fixed=PANEL_H_FIX[q&&q.type];
  const H=fixed!==undefined ? fixed : Math.max(3, Math.ceil(h));
  /* what is actually left for the control once the words have taken theirs —
     the pinned case can be tighter than `ctrl` asked for */
  const room=H - (Q_INSET + lines*Q_LH + hintH + Q_GAP + Q_INSET);
  return {w, h:H, titleLines:lines, hintLines:hlines, room:Math.max(0.5, room)};
}

function snakeParts(i,j,sx,sy){
  const PH=snakeParts.h||6, PW=snakeParts.w||SNAKE.panel.w;
  const put=(o)=>({
    c: sx>0 ? i+o.dx : i-o.dx-(o.w-1),
    r: sy>0 ? j+o.dy : j-o.dy-(o.h-1),
    w:o.w, h:o.h
  });
  return {
    step:{c:i, r:j, w:1, h:1},
    total:put(SNAKE.total),
    panel:put({...SNAKE.panel, w:PW, h:PH}),
    /* Save hangs off the panel's lower-right corner, so its row follows the
       panel's height rather than being a constant */
    save:put({...SNAKE.save, dx:SNAKE.panel.dx+PW, dy:1+PH})
  };
}

/* Does every part sit inside the viewport and clear of the union? */
function snakeFits(P,B){
  const U=unionBox(), uH=Math.ceil(MAXR/2+1)+SNAKE.air;
  for(const k of ['step','total','panel','save']){
    const r=P[k];
    if(r.c<B.iMin || r.c+r.w>B.halfW) return false;
    if(r.r<B.jMin || r.r+r.h>B.halfH) return false;
    /* clear of the union: entirely left of it, right of it, above or below */
    const clearX = (r.c+r.w<=U.cl) || (r.c>=U.cr);
    const clearY = (r.r+r.h<=-uH) || (r.r>=uH);
    if(!clearX && !clearY) return false;
  }
  return true;
}

/* The figure for question n: its marker, and the first opening direction that
   fits. Down-right is the mock and is always tried first. */
function snakeFigure(n){
  const B=snakeBand(), m=snakeCell(n);
  /* the panel's height is this question's, and snakeParts needs it before it
     can place anything below the panel */
  const PS = ASKED[n] ? panelSize(ASKED[n]) : {w:SNAKE.panel.w, h:6};
  snakeParts.h=PS.h; snakeParts.w=PS.w;
  for(const [sx,sy] of [[1,1],[1,-1],[-1,1],[-1,-1]]){
    const P=snakeParts(m.i,m.j,sx,sy);
    if(snakeFits(P,B)) return {...P, sx, sy, i:m.i, j:m.j, fitted:true};
  }
  /* NO DIRECTION FITS, and with a horizontal snake that is the normal case
     rather than the edge one: the run is 9 columns, the figure is 11, and the
     clear band beside the poster is 13 — so the two cannot both hang off the
     same column once the markers have marched right.

     Rather than let the fallback drop the panel on the poster, the panel and
     Save anchor to the snake's OWN START, under the first marker, where 11
     columns always fit. The step and total stay on the live marker.

     This BREAKS the corner rule for the panel — it no longer touches the marker
     it belongs to — and that is a real loss which wants a decision, not a
     default. Flagged rather than hidden. */
  const anchored=snakeParts(B.iMin, B.jMin+2, 1, 1);
  return {step:{c:m.i, r:m.j, w:1, h:1},
          total:snakeParts(m.i,m.j,1,1).total,
          panel:anchored.panel, save:anchored.save,
          sx:1, sy:1, i:m.i, j:m.j, fitted:false, anchored:true};
}

/* cells -> pixels, against the same origin and cell every other layer uses */
function cellBox(r){
  const o=gridOrigin(), c=cellSize();
  return {left:o.x+r.c*c, top:o.y+r.r*c, w:r.w*c, h:r.h*c};
}
const cssBox=b=>'left:'+b.left.toFixed(1)+'px;top:'+b.top.toFixed(1)+'px;'
              + 'width:'+b.w.toFixed(1)+'px;height:'+b.h.toFixed(1)+'px';

/* ---------- draw the dots ---------- */
function renderDots(){
  const vw=window.innerWidth, vh=window.innerHeight, cell=cellSize();
  const o=gridOrigin();
  const at=d=>({x:o.x+d.i*cell, y:o.y+d.j*cell});
  const wrap=inner=>'<svg viewBox="0 0 '+vw+' '+vh+'" preserveAspectRatio="none">'+inner+'</svg>';
  const c=card.classList.contains('open') ? cardBox : null;
  const buried=(p,r,qid)=>c && qid!==pinnedQ &&
    p.x>c.left-r && p.x<c.right+r && p.y>c.top-r && p.y<c.bottom+r;

  /* the decorative layer is deliberately empty — the starfield is gone (see
     computeDots). The element stays because the question dots are z-indexed
     against it, and because emptying it is one assignment rather than a
     rework of the stack. */
  dotsDeco.innerHTML='';

  /* EVERY open question pulses, not just the first of them. During the linear
     lead that is one dot; at the fork it is both of the questions you may
     answer, which is what makes the choice visible — a single pulse there would
     read as an instruction rather than an option. */
  const avail=availableQs();
  const marks=DOTS.filter(d=>d.qid).map(d=>{
    const H=hierarchy(d.qid,cell), p=at(d);
    if(buried(p,H.r,d.qid)) return '';
    const q=BANK[d.qid];
    const open=d.qid===pinnedQ;
    const next=avail.includes(d.qid) && !open;
    const locked=!canOpen(d.qid);
    const cx=p.x.toFixed(1), cy=p.y.toFixed(1);
    const n=ASKED.findIndex(x=>x.id===d.qid)+1;
    let g='<g class="qdot'+(open?' is-open':'')+(locked?' locked':'')+'" data-qid="'+d.qid+'"'
        + (locked?'':' tabindex="0" role="button"')
        + ' aria-label="'+pad2(n)+' of '+pad2(ASKED.length)+'. '
        + (q?q.title.replace(/"/g,''):d.qid)
        + (H.passed?' (skipped)':H.done?' (answered)':
           locked?' (locked, answer earlier questions first)':'')+'">';
    if(next) g+='<circle class="pulse" cx="'+cx+'" cy="'+cy+'" r="'+(H.r+2).toFixed(1)+'"/>';
    if(open) g+='<circle class="halo" cx="'+cx+'" cy="'+cy+'" r="'+(H.r+7).toFixed(1)+'"/>';
    /* generous target when shut — and never smaller than half a cell, so a
       receded dot stays as easy to hit as a near one; shrunk while its card is
       open, so it cannot swallow clicks meant for the controls beside it */
    g+='<circle class="hit" cx="'+cx+'" cy="'+cy+'"'
      + ' r="'+(open?H.r+2:Math.max(H.r+13, cell*0.5)).toFixed(1)+'"/>';
    if(!locked) g+='<circle class="hover" cx="'+cx+'" cy="'+cy+'" r="'+(H.r+5).toFixed(1)+'"/>';
    /* a broken ring for skipped: same weight as answered, but visibly not the
       same thing. The dash is derived from the radius so it stays four even
       gaps at any size. */
    const dash=H.passed
      ? ' stroke-dasharray="'+(H.r*0.9).toFixed(1)+' '+(H.r*0.62).toFixed(1)+'"' : '';
    const state=H.fill?' filled':H.passed?' passed':' done';
    g+='<circle class="core'+state+'" cx="'+cx+'" cy="'+cy+'"'
      + ' r="'+H.r.toFixed(1)+'" opacity="'+H.op.toFixed(2)+'"'+dash+'/>';
    return g+'</g>';
  }).join('');

  /* The question dots are gone too, and with them the guide line and the start
     cue that pointed at them: the snake states the sequence and the position in
     it, so a second notation for the same thing was noise. `marks` is still
     built above because hierarchy() is what decides a question's state and that
     is worth keeping in one place — it is simply no longer drawn here. */
  void marks;
  dotsInt.innerHTML='';
  renderSnake();
}

/* =====================================================================
   THE WHEEL — the number question's control.

   A circle LARGER than the panel, centred below it, so what shows is the top
   cap of it: measured off the mock at radius 2.31 cells with its centre 0.79
   cells below the panel's lower edge, which is what puts the ±70° of arc on
   screen and no more. At 28° per step that is exactly five values — the one you
   have chosen and two either side, which is what the mock draws.

   It WRAPS. The mock shows 12 to the left of 01 with 02 selected, so the values
   run as a ring rather than a bar with two ends: turning past the first value
   arrives at the last. On a clock of alarms that is the truth of the thing.

   The chosen value is always at the top. You do not move a marker along a
   scale — you turn the scale until what you mean is at the top, which is why
   the number is set above the arc rather than beside a handle.
   ===================================================================== */
/* The wheel is a FIXED SIZE now. It used to be a fraction of the panel's
   height, which was fine while every panel was the same height and wrong the
   moment they were not: a short question would have got a small wheel and a
   long one a big one, for no reason a reader could see.

   So the radius is the constant, and the panel only decides where the centre
   goes. cy = panelHeight + 0.342 * r is not a taste number: 0.342 is cos(70
   degrees), so the panel's lower edge cuts the circle at exactly +-70 degrees
   whatever its height — which is what keeps five values on screen and no more.
   Every other measure is the mock's, divided by the mock's own radius. */
/* DERIVED, not chosen. The arc's widest point is where the panel's lower edge
   cuts it, at +-70 degrees, so its visible half-width is r*sin(70). Setting that
   equal to half the panel minus the hug makes the arc's ends land on exactly the
   same line as the title's first and last letters — the panel's one inset, obeyed
   by the wheel as well.

   Change Q_INSET or the panel's width and the wheel follows on its own. */
/* The radius the WIDTH allows: the arc's widest point sits on the hug line. */
const DIAL_R_MAX=(PANEL_W.number/2-Q_INSET)/Math.sin(70*Math.PI/180);
/* The radius the ROOM allows: the visible cap is r*(1-cos70) tall and keeps the
   hug below it. On a panel pinned to the node's 1.388 the room is the tighter of
   the two, so the arc comes in a little inside the side hug rather than the
   panel growing to suit the arc. */
/* THE ARC IS NOT THE TALLEST THING IN THE WHEEL.
   The number ring sits 19% outside the arc, and the chosen value sits above that
   again — so fitting the ARC to the room let the labels and the value climb into
   the question's text. What has to fit is the topmost thing drawn:
     labelR*(1-cos70) + half the value's own size + the hug
   which in terms of r is 0.783r + 0.061r + inset. */
const DIAL_LR=2.75/2.31;                // label ring, as a multiple of r
const DIAL_TS=0.28/2.31;                // label and value size, as a multiple of r
const DIAL_RISE=DIAL_LR*(1-Math.cos(70*Math.PI/180)) + DIAL_TS*0.5;
const dialR=room=>Math.max(1.0, Math.min(DIAL_R_MAX, (room-Q_INSET)/DIAL_RISE));
const DIAL_R=DIAL_R_MAX;                // what an unpinned panel would ask for
/* rows the visible cap needs: its height, plus the hug it now keeps below it */
const DIAL_CELLS=DIAL_R*DIAL_RISE+Q_INSET;        // unpinned ask, room and all
/* Fractions OF THE PANEL'S HEIGHT, not absolute cells. Each one was divided out
   of the mock's measurement at its 4-row panel — cy 4.79/4, r 2.31/4, and so on
   — so at PANEL_H 4 this reproduces the mock to the tenth of a pixel, and at any
   other height the wheel keeps the same relationship to the panel that clips it.
   That relationship is what puts exactly +-70 degrees of arc on screen, which is
   what shows five values and no more. */
const DIAL={
  step:28,                              // degrees per value
  sweep:70,                             // degrees of arc drawn either side
  dragPerStep:0.62,                     // cells of pointer travel per value
  r:DIAL_R,
  labelR:DIAL_R*(2.75/2.31),
  dotR:DIAL_R*(0.15/2.31),
  labelSize:DIAL_R*(0.28/2.31),
  valueSize:DIAL_R*(0.28/2.31),
  cx:PANEL_W.number/2,                  // the panel's horizontal centre
  /* The cut lands on +-70 degrees, and it lands Q_INSET ABOVE the panel's lower
     edge rather than on it — so the wheel is hugged on all three sides it
     reaches, exactly as the title and the cards are. */
  cyFor:PH=>(PH-Q_INSET)+0.342*DIAL_R
};
const dialSteps=()=>Math.floor(DIAL.sweep/DIAL.step);   // values shown either side

/* the ring of values for a number question, wrapping at both ends */
function dialRing(q){
  const D=derive();
  const min=val(q.min,D), max=val(q.max,D);
  const n=max-min+1, cur=Math.max(min,Math.min(max,Math.round(ans(q.id))));
  return {min, max, n, cur, at:k=>min+(((cur-min+k)%n)+n)%n};
}

function dialMarkup(q,c,PH,W){
  const R=dialRing(q);
  /* sized to the room this panel actually leaves — see dialR */
  const rC=dialR(panelSize(q).room);
  /* never louder than the small line above it — the wheel's numbers are read
     after the question, not with it */
  const ts=Math.min(rC*DIAL_TS, Q_HFS*0.92)*c;
  const cx=(W/2)*c, cy=((PH-Q_INSET)+Math.cos(70*Math.PI/180)*rC)*c;
  const r=rC*c, lr=rC*DIAL_LR*c;
  const pt=(rad,deg)=>{const a=(deg-90)*Math.PI/180;
    return [cx+rad*Math.cos(a), cy+rad*Math.sin(a)];};
  const a0=pt(r,-DIAL.sweep), a1=pt(r,DIAL.sweep);
  let s='<svg class="dial" viewBox="0 0 '+(W*c).toFixed(1)+' '+(PH*c).toFixed(1)+'"'
      + ' tabindex="0" role="slider" aria-label="'+esc(q.title)+'"'
      + ' aria-valuemin="'+R.min+'" aria-valuemax="'+R.max+'" aria-valuenow="'+R.cur+'">';
  /* the arc, drawn as one sweep so its ends are where the panel cuts it */
  s+='<path class="dial-arc" stroke-width="'+Math.max(1,c*0.024).toFixed(2)+'"'
    + ' d="M'+a0[0].toFixed(1)+' '+a0[1].toFixed(1)
    + ' A'+r.toFixed(1)+' '+r.toFixed(1)+' 0 0 1 '+a1[0].toFixed(1)+' '+a1[1].toFixed(1)+'"/>';
  const K=dialSteps();
  for(let k=-K;k<=K;k++){
    const deg=k*DIAL.step, [lx,ly]=pt(lr,deg), lab=pad2(R.at(k));
    if(k===0){
      const [dx,dy]=pt(r,0);
      s+='<circle class="dial-dot" cx="'+dx.toFixed(1)+'" cy="'+dy.toFixed(1)+'"'
        + ' r="'+(rC*(0.15/2.31)*c).toFixed(1)+'"/>';
      s+='<text class="dial-val" x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'"'
        + ' dominant-baseline="central" font-size="'+ts.toFixed(1)+'">'+lab+'</text>';
      continue;
    }
    const [tx,ty]=pt(r,deg);
    s+='<circle class="dial-tick" cx="'+tx.toFixed(1)+'" cy="'+ty.toFixed(1)+'"'
      + ' r="'+(c*0.028).toFixed(1)+'"/>';
    /* rotated to the tangent, so the ring of numbers reads as a dial face
       rather than as a row of labels scattered around a curve */
    s+='<text class="dial-lab" x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'"'
      + ' text-anchor="middle" dominant-baseline="central"'
      + ' font-size="'+ts.toFixed(1)+'"'
      + ' transform="rotate('+deg.toFixed(1)+' '+lx.toFixed(1)+' '+ly.toFixed(1)+')">'+lab+'</text>';
    /* a target on the neighbour, so the wheel can be turned by naming a value
       as well as by dragging it round */
    s+='<circle class="dial-hit" data-step="'+k+'" cx="'+lx.toFixed(1)+'" cy="'+ly.toFixed(1)+'"'
      + ' r="'+(c*0.34).toFixed(1)+'"/>';
  }
  return s+'</svg>';
}

/* Turn the wheel by `k` values, wrapping, and repaint. */
function dialTurn(qid,k){
  const q=BANK[qid]; if(!q) return;
  const R=dialRing(q);
  S.answers[qid]=R.at(k); S.touched[qid]=true;
  if(q.onPick) q.onPick(); else draw();
  renderSnake();
}

/* =====================================================================
   Drawing the snake. Past markers, the current figure, and nothing else —
   a question not yet reached has no mark, exactly as the mock has no 3.
   ===================================================================== */
/* WHICH QUESTION THE PANEL IS SHOWING.
   null means "the one the flow is on" — the first still unanswered. Going back
   to a marker sets it to that question's index, and Save clears it, so the
   panel returns to the front of the flow once the revisit is banked.
   This exists because there was no notion of it: going back called
   openQuestion(), which draws the OLD floating card, so a revisited question
   appeared in the previous design's clothes. The board must never call that. */
let snakeAt=null;
function snakeIndex(){
  const first=ASKED.findIndex(q=>!isDone(q.id));
  if(snakeAt!=null && snakeAt>=0 && snakeAt<ASKED.length) return snakeAt;
  return first;
}
const snakeQ=()=>{ const i=snakeIndex(); return i<0 ? null : ASKED[i]; };

function renderSnake(){
  if(!S.baseDone){ qsys.innerHTML=''; return; }
  const c=cellSize();
  const cur=snakeIndex();
  let html='';

  /* The trail: every question behind us EXCEPT the one being shown. Keyed on
     each question's own state rather than on "index below the cursor", so a
     revisit keeps the whole trail drawn instead of truncating it. */
  for(let n=0;n<ASKED.length;n++){
    if(n===cur || !isDone(ASKED[n].id)) continue;
    const q=ASKED[n], F=snakeFigure(n);
    html+='<div class="qstep past" data-qid="'+q.id+'" tabindex="0" role="button"'
        + ' aria-label="'+pad2(n+1)+' of '+pad2(ASKED.length)+'. '+esc(q.title)+' (answered)"'
        + ' style="'+cssBox(cellBox(F.step))+';font-size:'+(0.33*c).toFixed(1)+'px">'
        + (n+1)+'</div>';
  }
  if(cur<0){ qsys.innerHTML=html; return; }    // everything answered

  /* the current figure */
  const q=ASKED[cur], F=snakeFigure(cur);
  /* TRICKLE DOWN. The four parts cut in one after another, in the order the eye
     builds them: which question, of how many, what it asks, and then the way
     out. It is a stagger of the SAME 110ms beat the opening screen runs on, so
     the piece keeps one clock.

     Only on ARRIVAL. Tagging every repaint would replay the stagger on every
     keystroke of a drag, so the class goes on only when the question showing
     has actually changed. */
  const arriving = renderSnake.last!==q.id;
  renderSnake.last=q.id;
  const A='';
  html+='<div class="qstep now'+A+'" style="'+cssBox(cellBox(F.step))
      + ';font-size:'+(0.33*c).toFixed(1)+'px">'+(cur+1)+'</div>';
  html+='<div class="qtotal'+A+'" style="'+cssBox(cellBox(F.total))
      + ';font-size:'+(0.40*c).toFixed(1)+'px">/'+ASKED.length+'</div>';

  const PH=F.panel.h;
  const pb=cellBox(F.panel);
  /* 0.52 of a cell, not 0.372. The mock's 16px was measured on its own 43px
     cell and came out too small to read at this size — the first question was
     the tell. Every question is set at this one size; nothing is scaled per
     question except the panel that holds it. */
  html+='<div class="qpanel'+A+'" style="'+cssBox(pb)+'">'
      + '<h2 style="margin:'+(Q_INSET*c).toFixed(1)+'px '+(Q_INSET*c).toFixed(1)+'px 0;'
      +          'font-size:'+(Q_FS*c).toFixed(1)+'px;line-height:'+(Q_LH*c).toFixed(1)+'px">'
      + esc(val(q.title,derive())) + '</h2>'
      + (val(q.hint,derive())
          ? '<p class="qhint" style="margin:'+(Q_HGAP*c).toFixed(1)+'px '+(Q_INSET*c).toFixed(1)+'px 0;'
            + 'font-size:'+(Q_HFS*c).toFixed(1)+'px;line-height:'+(Q_HLH*c).toFixed(1)+'px">'
            + esc(val(q.hint,derive())) + '</p>'
          : '')
      + panelControl(q,c,PH,F.panel.w)
      + '</div>';

  /* Shut until a card has been picked. With no standing default there is nothing
     to bank, and a live Save would either record an answer nobody gave or do
     nothing when pressed — both worse than a button that is visibly not ready. */
  const locked=needsPick(q) && !isChosen(q.id);
  html+='<button type="button" class="qsave'+A+(locked?' locked':'')+'"'
      + (locked?' disabled aria-disabled="true"':'')
      + ' style="'+cssBox(cellBox(F.save))
      + ';font-size:'+(0.26*c).toFixed(1)+'px;letter-spacing:'+(0.03*c).toFixed(2)+'px">Save</button>';

  qsys.innerHTML=html;

  /* THE TRICKLE-DOWN, on timers rather than on a CSS animation.
     It was an animation with a staggered delay, and that is how the /9 cell
     disappeared: a CSS animation is PAUSED in a backgrounded tab, and the
     fill-mode held its from-state — opacity 0 — for as long as it never ran.
     Whatever hides a thing must be the same thing that shows it again, and a
     timer fires eventually in every state a tab can be in.

     Order is the order the eye builds the question: which one, of how many, what
     it asks, then the way out. Beat is HERO_BEAT, the opening screen's clock, so
     the piece keeps one. Everything CUTS — visibility, never opacity. */
  if(arriving){
    const parts=[qsys.querySelector('.qstep.now'), qsys.querySelector('.qtotal'),
                 qsys.querySelector('.qpanel'),   qsys.querySelector('.qsave')];
    clearTimeout(renderSnake.t);
    parts.forEach(el=>{ if(el) el.style.visibility='hidden'; });
    const show=k=>{
      if(k>=parts.length) return;
      if(parts[k] && parts[k].isConnected) parts[k].style.visibility='';
      renderSnake.t=setTimeout(()=>show(k+1), HERO_BEAT);
    };
    show(0);
  }

  /* EVERY question opens in the panel now — the old floating card is no longer
     reached from the board at all. What openQuestion used to do besides drawing
     the card still has to happen, though: mark the question reached so the
     sheet starts responding, and register the standing default so the record is
     explicit rather than implied by a fallback. */
  S.reached[q.id]=true;
  /* only the scale-shaped questions open on a value — see needsPick */
  if(!needsPick(q) && S.answers[q.id]===undefined) S.answers[q.id]=q.default;
}

/* The control the panel holds. One per question TYPE, and the panel is what
   they have in common — see the .qopts rules for why the binary and the months
   are not wheels. Positioned in the panel's own cell module: the question takes
   the top two rows, the control the bottom one and a half. */
/* =====================================================================
   THE MONTH RING — twelve circles, four across and three down, touching.

   The name sits inside its circle until it is chosen; then it LEAVES the middle
   and runs around the circle's edge, repeated as many times as the circumference
   will take, turning for as long as the answer stands. Nothing else marks it —
   no stroke, no dot in the middle. The turning name IS the state.

   The repeat count is computed from the circumference rather than fixed, so the
   names never collide and never leave a gap: a three-letter month at this size
   takes a known arc, and however many fit is however many are set.

   Circles TOUCH. There is no gap between them and no cell around them — they
   are one field with a hole opened in it, which is the whole reason the chosen
   one reads as chosen.
   ===================================================================== */
function monthRingMarkup(q,c,PH,W){
  /* Four across, three down, tangent — so the white between them is the diamond
     four touching circles leave, not a gap. Inset by Q_INSET, the panel's one
     hug, so the grid's outer edge lines up exactly with the title's. */
  const cols=4, rows=3;
  const Q_LEFT=Q_INSET;
  /* The diameter the hug implies. The cap on the room below is a SAFETY, not the
     working path: while it binds, the grid is narrower than the hugged width and
     its side inset no longer matches the text's — so the panel's pinned height
     is chosen to keep the cap off (see PANEL_H_FIX). If it ever bites, the grid
     re-centres rather than spilling over the words. */
  const room=(panelSize(q).room)/rows;
  const d=Math.min((W-2*Q_LEFT)/cols, room);
  const gridW=d*cols;
  const Q_SHIFT=(W-gridW)/2;                   // re-centred if the cap bit
  const top=PH-Q_INSET-rows*d;
  const R=d/2, cur=picked(q.id);
  const fs=d*0.235*c;                          // the name, inside its circle
  const ringFs=d*0.185*c;                      // the name, running round
  let g='<svg viewBox="0 0 '+(W*c).toFixed(1)+' '+(PH*c).toFixed(1)+'" class="mring">';
  q.options.forEach((m,k)=>{
    const col=k%cols, row=Math.floor(k/cols);
    const cx=(Q_SHIFT+d*(col+0.5))*c, cy=(top+d*(row+0.5))*c, r=R*c;
    const on=cur===m;
    /* Three letters, in the grid AND on the ring. The full name was tried and
       dropped: it forced a single pass, which read as a label bent round a curve
       rather than as something running. */
    const lab=String(m).slice(0,3).toUpperCase();
    if(!on){
      g+='<g class="mo" data-val="'+esc(String(m))+'">'
       + '<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+r.toFixed(1)+'"/>'
       + '<text x="'+cx.toFixed(1)+'" y="'+cy.toFixed(1)+'" text-anchor="middle"'
       + ' dominant-baseline="central" font-size="'+fs.toFixed(1)+'">'+lab+'</text></g>';
      return;
    }
    /* The chosen one, per the sketch: THE CIRCLE IS GONE. Not hollowed, not
       stroked — absent. What marks the answer is the name alone, turning where
       the circle was, and the hole it leaves in the field is the whole signal.
       The ring sits well inside the circle's own footprint — 0.55, not 0.70 —
       so there is clear white between the type and the circles it touches. The
       gap belongs to the name, not to its neighbours. */
    const rr=r*0.55;                           // the path the name runs on
    const id='mring'+k;
    const circ=2*Math.PI*rr;
    /* THE RING IS FILLED, EXACTLY.
       The name repeats as many times as the circumference naturally takes, and
       then the whole run is stretched to the circumference with textLength — so
       the last separator meets the first letter and there is neither a gap nor a
       glyph pushed off the end of the path. A glyph that falls off a textPath is
       not clipped, it is simply not drawn, which is how letters were going
       missing: the run was centred on twelve o'clock and whatever hung past the
       path's ends vanished.

       At least three passes: two read as a label repeated, not as something
       running round. */
    /* Three passes, and the TYPE SIZE is what bends to fit them — not the
       spacing. lengthAdjust only stretches the gaps between glyphs, so asking a
       run 137 units long to sit on a 90-unit ring squeezed the letters into each
       other. So the size is derived: whatever makes three passes of this name
       fill this circumference naturally, floored so it never becomes a smear.
       textLength then only has to take up the rounding. */
    const reps=3;
    const run=Array.from({length:reps},()=>lab).join(' \u00b7 ')+' \u00b7';
    const ringFit=Math.max(6.5, circ/(run.length*0.58));
    g+='<g class="mo on" data-val="'+esc(String(m))+'">'
     /* the turn: its own group so only the type rotates, about the circle's
        centre, stated in px because an SVG group has no box of its own */
     + '<g class="mo-spin" style="transform-origin:'+cx.toFixed(1)+'px '+cy.toFixed(1)+'px">'
     + '<path id="'+id+'" fill="none" d="M'+(cx-rr).toFixed(1)+','+cy.toFixed(1)
     +   ' a'+rr.toFixed(1)+','+rr.toFixed(1)+' 0 1,1 '+(rr*2).toFixed(1)+',0'
     +   ' a'+rr.toFixed(1)+','+rr.toFixed(1)+' 0 1,1 -'+(rr*2).toFixed(1)+',0"/>'
     /* From the path's start and all the way round: startOffset 0, no anchoring,
        and textLength set to the circumference so the run closes on itself. The
        slack goes into the spacing between glyphs, never into dropping them. */
     + '<text font-size="'+ringFit.toFixed(1)+'">'
     +   '<textPath href="#'+id+'" startOffset="0"'
     +     ' textLength="'+circ.toFixed(1)+'" lengthAdjust="spacing">'+run+'</textPath></text>'
     + '</g></g>';
  });
  return g+'</svg>';
}

function panelControl(q,c,PH,W){
  if(q.type==='number') return dialMarkup(q,c,PH,W);
  if(q.type==='choice') return monthRingMarkup(q,c,PH,W);
  const opts = q.type==='choice'
    ? q.options.map(v=>[v, q.display(v)])
    : q.options.map(o=>[o[0], o[1]]);
  const rows = q.type==='choice' ? 2 : 1;
  /* the block sits inset by the same 0.44 cell the question is, and fills the
     panel's lower band — 6 cells wide by the rows it needs */
  /* Anchored to the panel's FOOT, not to a fraction of its height: the answer
     belongs directly under the question however long the question ran, and a
     proportional position would have floated it away from short ones. */
  const inset=Q_INSET*c;
  const hgt=(rows===2 ? 1.9 : 1.1)*c;
  const top=PH*c-inset-hgt;
  const fs=(q.type==='choice' ? 0.26 : 0.30)*c;
  return '<div class="qopts '+q.type+'" style="left:'+inset.toFixed(1)+'px;'
       + 'top:'+top.toFixed(1)+'px;width:'+(W*c-inset*2).toFixed(1)+'px;'
       + 'height:'+hgt.toFixed(1)+'px;font-size:'+fs.toFixed(1)+'px">'
       + opts.map(([v,label])=>
           '<button type="button" data-val="'+esc(String(v))+'"'
         + ' aria-pressed="'+String(picked(q.id)===v)+'">'
         + esc(q.type==='choice' ? String(label).slice(0,3).toUpperCase() : label)
         + '</button>').join('')
       + '</div>';
}

/* ---- where to begin ----
   A word beside the first question, and only while nothing has been answered:
   once you have started, the board itself is the instruction and this is noise.
   Sits to the right of its dot by default and flips to the left if that would
   put it over the sheet. */
function startCue(at,cell){
  if(!ASKED.length) return '';
  if(!S.baseDone) return '';   // nothing to point at yet
  if(ASKED.some(q=>isDone(q.id))) return '';
  const d=DOTS.find(x=>x.qid===ASKED[0].id);
  if(!d) return '';
  const H=hierarchy(ASKED[0].id,cell), p=at(d), U=unionBox();
  const gap=H.r+10;
  const right = p.x+gap+74 < U.l || p.x > U.r;    // room before the sheet?
  return '<text class="startcue" x="'+(right?p.x+gap:p.x-gap).toFixed(1)+'"'
       + ' y="'+(p.y+3).toFixed(1)+'" text-anchor="'+(right?'start':'end')+'">'
       + 'Start here</text>';
}

/* ---- the guide line ----
   Reaches from the question just answered toward whatever opened up, then
   fades. Not a straight run and not along the grid: a gentle arc that takes the
   long way round, bowing AWAY from the centre of the sheet. That does two jobs
   at once — it gives the gesture some travel instead of geometry, and it leans
   the line around the artwork rather than straight over the middle of it.

   The bow is derived from the two positions, never random, so it is identical
   on every re-render. A random curve would twitch each time the board relaid.

   Where it does cross the sheet it is drawn at a quarter of the weight. That is
   done by drawing the same curve twice under opposite clips — one keeping what
   is outside the sheet, one keeping what is inside — so a single gesture
   changes weight halfway along without becoming two lines. */
let guideFrom=null, guideTo=[];
function guideMarkup(at,cell){
  if(!CONFIG.GUIDE_LINE || !guideFrom || !guideTo.length) return '';
  const a=DOTS.find(x=>x.qid===guideFrom);
  if(!a) return '';
  const A=at(a), f=sheetRect(), vw=window.innerWidth, vh=window.innerHeight;
  const mid={x:f.left+f.width/2, y:f.top+f.height/2};
  let out='';
  for(const id of guideTo){
    const b=DOTS.find(x=>x.qid===id);
    if(!b) continue;
    const B=at(b);
    /* spring from the edge of one mark and land on the edge of the other,
       rather than burying both ends under the dots */
    const hA=hierarchy(guideFrom,cell).r+3, hB=hierarchy(id,cell).r+3;
    const dx=B.x-A.x, dy=B.y-A.y, dist=Math.hypot(dx,dy);
    if(dist<=hA+hB+8) continue;                 // too close to be worth a line
    const ux=dx/dist, uy=dy/dist;
    const x1=A.x+ux*hA, y1=A.y+uy*hA;
    const x2=B.x-ux*hB, y2=B.y-uy*hB;

    /* bow perpendicular to the chord, on whichever side leads further from the
       middle of the sheet */
    let nx=-uy, ny=ux;
    const cxm=(x1+x2)/2, cym=(y1+y2)/2;
    if(Math.hypot(cxm+nx-mid.x, cym+ny-mid.y) < Math.hypot(cxm-nx-mid.x, cym-ny-mid.y)){
      nx=-nx; ny=-ny;
    }
    const k=Math.min(dist*0.17, 6*cell);
    /* two control points at a third and two thirds, bowed by slightly different
       amounts — a symmetrical arc reads as drafted, an uneven one as travelled */
    const c1={x:x1+ux*dist*0.33+nx*k*0.85, y:y1+uy*dist*0.33+ny*k*0.85};
    const c2={x:x1+ux*dist*0.67+nx*k*1.10, y:y1+uy*dist*0.67+ny*k*1.10};
    const d='M '+x1.toFixed(1)+' '+y1.toFixed(1)
          + ' C '+c1.x.toFixed(1)+' '+c1.y.toFixed(1)
          + ' '+c2.x.toFixed(1)+' '+c2.y.toFixed(1)
          + ' '+x2.toFixed(1)+' '+y2.toFixed(1);
    /* THE WAKE.
       len is an over-estimate of the arc length — a gentle bow is a little
       longer than its chord, and guessing long only means the segment leaves a
       fraction early, whereas guessing short would cut it off mid-curve. No
       getTotalLength call, so this stays a pure string with no measuring pass.

       seg is how much of the curve is lit at once — a streak, not a line: about
       a quarter, floored so a short hop still reads as something moving rather
       than a dot, capped so a long one does not turn back into a drawn path.

       The gap is three times the path, which guarantees only ONE segment can
       ever intersect the visible stroke — a shorter gap and a second copy of
       the dash walks in behind the first.

       The offset runs from +seg to seg-len. The dash sits on [-o, seg-o], so at
       o = seg it is entirely before the start (invisible), and at o = seg-len
       its LEADING EDGE is exactly at len — on the target dot — with the tail
       still strung out behind it. That is the arrival. Running it to -len
       instead would carry the whole segment off the far end, which reads as
       overshooting the question it is pointing at. */
    const len=Math.round(dist*1.2+12);
    const seg=Math.round(Math.max(52, Math.min(len*0.26, 165)));
    const sty='--o0:'+seg+';--o1:'+(seg-len)+';stroke-dasharray:'+seg+' '+(len*3);
    out+='<path class="guide" clip-path="url(#gOut)" style="'+sty+'" d="'+d+'"/>'
       + '<path class="guide under" clip-path="url(#gIn)" style="'+sty+'" d="'+d+'"/>';
  }
  if(!out) return '';
  /* gOut keeps everything except the sheet — a full-bleed rect with the sheet
     punched out of it by the even-odd rule. gIn keeps only the sheet. */
  const R=(x,y,w,h)=>'M '+x+' '+y+' H '+(x+w)+' V '+(y+h)+' H '+x+' Z ';
  return '<defs>'
    + '<clipPath id="gOut"><path clip-rule="evenodd" d="'
    +   R(0,0,vw,vh) + R(f.left.toFixed(1),f.top.toFixed(1),f.width.toFixed(1),f.height.toFixed(1))
    + '"/></clipPath>'
    + '<clipPath id="gIn"><rect x="'+f.left.toFixed(1)+'" y="'+f.top.toFixed(1)
    +   '" width="'+f.width.toFixed(1)+'" height="'+f.height.toFixed(1)+'"/></clipPath>'
    + '</defs>' + out;
}
/* Called when a question is banked. Points at everything that just opened up —
   one dot during the linear lead, two once the path forks, so at the fork the
   wake shows the choice rather than a single destination.

   It runs after EVERY question, all the way through the session. It can afford
   to: a travelling segment that clears the screen in a little over a second is
   a hand-off, not a permanent line, so repeating it never accumulates into
   furniture the way a persistent path would. */
function aimGuide(fromId){
  if(!CONFIG.GUIDE_LINE) return;
  guideFrom=fromId;
  guideTo=availableQs();
  clearTimeout(aimGuide.t);
  aimGuide.t=setTimeout(()=>{ guideFrom=null; guideTo=[]; renderDots(); }, 1300);
}

/* No per-frame dot work exists here on purpose. The dots are on the grid, the
   grid does not move when the format changes, and they are placed clear of
   every format's footprint — so there is nothing to keep in step. */

/* ---------- open / close ---------- */
function placeCard(){
  const vw=window.innerWidth, vh=window.innerHeight;
  const f=sheetRect();
  /* pinnedQ==null must NOT search DOTS at all: decorative dots also carry
     qid:null, so x.qid===pinnedQ would match the first one of THOSE and anchor
     the card to a random background mark instead of falling through to the
     centred fallback below. Only a real question id is a valid anchor. */
  const anchor=pinnedQ==null ? null : DOTS.find(x=>x.qid===pinnedQ);
  const d=anchor ? dotXY(anchor) : null;      // grid coordinates -> pixels
  let cw=0, ch=0;
  const setW=w=>{                             // '' restores the CSS width
    card.style.width = w ? Math.round(w)+'px' : '';
    cw=card.offsetWidth||cardWidth();
    ch=card.offsetHeight;                     // re-read: narrower reflows taller
  };
  const settle=(l,t,origin)=>{
    card.style.left=Math.round(l)+'px';
    card.style.top=Math.round(t)+'px';
    card.style.transformOrigin=origin;
    cardBox={left:Math.round(l),top:Math.round(t),right:Math.round(l)+cw,bottom:Math.round(t)+ch};
  };

  /* THE CARD COMES OUT OF ITS DOT, and it never covers the poster. Those two
     want opposite things once the window is tight: a dot sits in the strip of
     screen beside the sheet, and a card hung off that dot by one corner
     reaches either across the sheet or off the edge. At 1000px wide with a
     390px sheet the strips are only ~300px, so corner-anchoring is impossible
     at ANY width the card can survive at.

     So the gesture is kept, not the geometry. Best case the card still hangs
     off the dot by a corner. Otherwise it is placed as CLOSE to its dot as the
     clear space allows, and transform-origin is aimed at the dot — so it still
     grows out of that circle, just from a card whose corner is not exactly on
     it. Both cases are tried narrowest-need-first: widths descend so the card
     is never smaller than it has to be, and each step reflows to re-measure.  */
  const widths=[];
  for(let w=cardWidth(); w>=CARD_MIN_W; w-=18) widths.push(w);
  if(widths[widths.length-1]!==CARD_MIN_W) widths.push(CARD_MIN_W);

  if(d){
    for(const w of widths){
      setW(w===cardWidth()?0:w);              // full width uses the stylesheet's own
      const hit=fitAt(d,cw,ch,vw,vh,f,false);
      if(hit){ settle(hit.left, hit.top, hit.origin); return; }
    }
    /* Scan ALL widths and keep the one that lands NEAREST the dot, rather than
       the first that merely fits. The two differ sharply: a 292px card fits the
       right-hand strip while the dot is in the left one, so "first fit" parks
       the question 600px from the circle it belongs to. Eighteen pixels
       narrower and the left strip opens up and the card lands on its dot. Ties
       within 20px go to the wider card, so it only pays width for real
       proximity. */
    let best=null;
    for(const w of widths){
      setW(w===cardWidth()?0:w);
      const near=nearestClear(d,cw,ch,vw,vh,f);
      if(!near) continue;
      const gap=Math.hypot(Math.max(near.left,Math.min(d.x,near.left+cw))-d.x,
                           Math.max(near.top, Math.min(d.y,near.top+ch))-d.y);
      if(!best || gap<best.gap-20) best={...near, gap, w};
    }
    if(best){
      setW(best.w===cardWidth()?0:best.w);
      settle(best.left, best.top, originFromDot(best.left,best.top,cw,ch,d));
      return;
    }
  }
  /* no dot to speak from (the finish card): just stay off the poster */
  for(const w of widths){
    setW(w===cardWidth()?0:w);
    const clear=clearOfSheet(cw,ch,vw,vh,f);
    if(clear){ settle(clear.left, clear.top, 'center'); return; }
  }

  setW(0);
  const last = d && (fitAt(d,cw,ch,vw,vh,f,true)
                  || fitAt(d,cw,Math.min(ch,vh-2*EDGE),vw,vh,f,true));
  if(last) settle(last.left, last.top, last.origin);
  else     settle(Math.max(EDGE,(vw-cw)/2), Math.max(EDGE,(vh-ch)/2), 'center');
}

/* Where on the card the dot is, as a transform-origin. The pop keyframes scale
   the card from this point, so aiming it at the dot is what makes the card
   read as coming OUT of that circle even when its corner cannot sit on it.
   Clamped to the card's own edges: a dot further away than the card is wide
   would otherwise throw the origin far outside it and the card would appear to
   fly in rather than grow. */
function originFromDot(l,t,cw,ch,d){
  const clamp=(v)=>Math.max(0,Math.min(100,v));
  return clamp((d.x-l)/cw*100).toFixed(1)+'% '+clamp((d.y-t)/ch*100).toFixed(1)+'%';
}

/* The placement closest to the dot that is still clear of the sheet, the
   chrome and the screen edge. Same four bands as clearOfSheet, but instead of
   centring in the roomiest it centres ON THE DOT and clamps into each band,
   then keeps whichever lands nearest. */
function nearestClear(d,cw,ch,vw,vh,f){
  const G=8;
  const zones=[
    {l:EDGE, r:f.left-G, t:EDGE, b:vh-EDGE},
    {l:f.right+G, r:vw-EDGE, t:EDGE, b:vh-EDGE},
    {l:EDGE, r:vw-EDGE, t:EDGE, b:f.top-G},
    {l:EDGE, r:vw-EDGE, t:f.bottom+G, b:vh-EDGE}
  ].filter(z=>z.r-z.l>=cw && z.b-z.t>=ch);
  if(!zones.length) return null;
  const avoid=chromeBoxes();
  const hits=(l,t)=>avoid.some(x=>l<x.right+6 && l+cw>x.left-6 && t<x.bottom+6 && t+ch>x.top-6);
  let best=null;
  for(const z of zones){
    const l=Math.min(Math.max(d.x-cw/2, z.l), z.r-cw);
    let t=Math.min(Math.max(d.y-ch/2, z.t), z.b-ch);
    if(hits(l,t)){
      /* slide along the band, nearest offset first, to step over the chrome */
      let ok=false;
      for(let s=16; s<=z.b-z.t; s+=16){
        for(const cand of [t+s, t-s]){
          if(cand<z.t || cand>z.b-ch) continue;
          if(!hits(l,cand)){ t=cand; ok=true; break; }
        }
        if(ok) break;
      }
      if(!ok) continue;
    }
    const dist=Math.hypot(l+cw/2-d.x, t+ch/2-d.y);
    if(!best || dist<best.dist) best={left:l, top:t, dist};
  }
  return best;
}

/* The best position that does not touch the sheet: take the four bands the
   sheet leaves against the viewport, keep the ones the card actually fits in,
   and centre it in the roomiest. Returns null when the sheet leaves no band
   wide enough — the only case where the card is allowed to overlap it. */
function clearOfSheet(cw,ch,vw,vh,f){
  const G=8;                                   // the same breathing room fitAt uses
  const bands=[
    {l:EDGE,        r:f.left-G,   t:EDGE, b:vh-EDGE},   // left of the sheet
    {l:f.right+G,   r:vw-EDGE,    t:EDGE, b:vh-EDGE},   // right of it
    {l:EDGE,        r:vw-EDGE,    t:EDGE, b:f.top-G},   // above
    {l:EDGE,        r:vw-EDGE,    t:f.bottom+G, b:vh-EDGE}
  ].filter(z=>z.r-z.l>=cw && z.b-z.t>=ch);
  if(!bands.length) return null;
  /* widest first: on a normal viewport that is the side of the sheet with the
     most air, which is where the card is least in the way */
  bands.sort((a,b)=>(b.r-b.l)*(b.b-b.t)-(a.r-a.l)*(a.b-a.t));
  const avoid=chromeBoxes();
  const hits=(l,t)=>avoid.some(x=>l<x.right+6 && l+cw>x.left-6 && t<x.bottom+6 && t+ch>x.top-6);
  for(const z of bands){
    const cl=(z.l+z.r)/2-cw/2, ct=(z.t+z.b)/2-ch/2;
    if(!hits(cl,ct)) return {left:cl, top:ct};
    /* centred lands on the chrome — slide down the band before giving up on it */
    for(let t=z.t; t<=z.b-ch; t+=24) if(!hits(cl,t)) return {left:cl, top:t};
  }
  const z=bands[0];
  return {left:(z.l+z.r)/2-cw/2, top:(z.t+z.b)/2-ch/2};
}

/* =====================================================================
   THE LANDING SEQUENCE — profile, then the three base questions, before
   anything else opens and before the poster is shown at all.

   Deliberately NOT part of the card/popup system that every later question
   uses. A question card floats over the board on purpose — you can see the
   sheet and the grid through it, because by then you are already inside the
   piece. This sequence is the opposite: it is what brings you in, and per
   spec the poster must not be visible — not even a live preview — for any of
   these four steps. Giving it its own element (#landing) rather than reusing
   `card` is what makes that possible: the popup card is deliberately
   translucent-adjacent (drop shadow, floats beside the sheet), and
   retrofitting "fully opaque, covers the chrome too" onto it would have
   fought the CSS that makes it work as a question card everywhere else.

   It also means this sequence owes nothing to placeCard/cardBox/pinnedQ at
   all — those exist to anchor a card to a dot, and this sequence anchors to
   nothing; it just IS the screen, one step at a time.

   The three base questions write S.baseShape/S.baseDensity/S.baseFrac and
   NOTHING ELSE reads or writes them once finishBase() runs — no dot, no
   card, no revisiting. That permanence is the entire point: the rest of the
   session builds on top of a foundation that cannot shift under it. */
const LANDING_STEPS=(CONFIG.SHOW_OPENING?['hero']:[]).concat(['shape','density','arrival']);
let landingStep=0;

/* the Continue/Back row shared by every step — only the validity check and
   the label differ, so those are the only things each step passes in */
function landingNav(cont,{canBack=true,label='Continue',valid=()=>true}={}){
  const foot=document.createElement('div');
  foot.className='nav';
  if(canBack && landingStep>0){
    const back=document.createElement('button');
    back.className='skip'; back.type='button'; back.textContent='Back';
    back.addEventListener('click',()=>{ landingStep--; renderLandingStep(); });
    foot.appendChild(back);
    const spacer=document.createElement('span'); spacer.className='spacer';
    foot.appendChild(spacer);
  }
  const btn=document.createElement('button');
  btn.className='btn'; btn.type='button'; btn.textContent=label;
  btn.disabled=!valid();
  btn.addEventListener('click',advanceLanding);
  foot.appendChild(btn);
  landingBody.appendChild(foot);
  return btn;
}
function landingHead(kicker){
  const p=document.createElement('p');
  p.className='eyebrow';
  p.innerHTML='<span>'+kicker+'</span><span class="eyebrow-right">'
    + (landingStep+1)+' / '+LANDING_STEPS.length+'</span>';
  landingBody.appendChild(p);
}

/* ---- APERTURE: the opening screen -----------------------------------------
   Step one, and the only step that owns the whole viewport rather than the
   380px column. It asks for nothing: a title, a line about what is coming, and
   Begin.

   The mechanic: the interface grid is painted across the entire viewport and
   then a rectangle of it is cleared away. The title sits in that cleared
   rectangle, on bare ink — there is no panel behind it, no border, no shadow.
   The hole is the container.

   The hole used to be sized by the name you typed, which was the argument for
   collecting one here. With the fields gone that reading goes too, and what is
   left is the hole opening on the beat as the title arrives — the way in is
   still something that opens rather than a page that loads, but it is no
   longer something the visitor sizes.

   ONE CLOCK. The title's characters, the field's flicker and the aperture's
   growth all land on the same beat. Three animations on three timers would
   read as ambient shimmer; on a single beat it reads as a mechanism running.
   Everything cuts — visibility, not opacity; whole cells, not sub-pixels. */
const HERO_BEAT=110;                       /* ms; the whole screen's clock */
const HERO_TITLE='Architecture of Time';
const HERO_PAD=2;                          /* whole cells of clearance round the plate */
let FIELD=null;

/* Built once, on the first landing step, and kept alive until the sequence
   hands over to the board. Every step re-renders #landingBody from scratch;
   the canvas is deliberately not in there. */
function ensureField(){
  if(FIELD) return FIELD;
  const cv=document.createElement('canvas'); cv.id='heroField';
  cv.setAttribute('aria-hidden','true');   /* decorative; the steps carry the meaning */
  landing.insertBefore(cv,landingBody);
  FIELD=heroField(cv,()=>landingBody.querySelector('.hero-plate')||landingBody);
  return FIELD;
}
function teardownHero(){
  if(FIELD){ FIELD.stop(); FIELD=null; }
  const cv=landing.querySelector('#heroField');
  if(cv) cv.remove();
  landing.classList.remove('hero');
}

/* Straight to the board, skipping the three base questions. The base answers
   take the values they already default to (square / enough / on time, from
   PROFILE_DEFAULTS), so the poster has a foundation to stand on — it is the
   ASKING that is skipped, not the answering.

   Two ways in and one implementation: the link on the opening screen, and ?skip
   on the URL. Neither may drift from the other. */
function skipOpening(){
  teardownHero();
  landing.classList.remove('open');
  landing.setAttribute('aria-hidden','true');
  S.baseDone=true;
  finishBase();
}

function renderLandingHero(){
  const plate=document.createElement('div'); plate.className='hero-plate';

  /* One <i> per character so the reveal can cut them in individually. Words are
     grouped and the spaces between them stay REAL text nodes: a space wrapped
     in an element (or turned into &nbsp;) would stop the line breaking where a
     line should break, and the title has to wrap on a narrow screen. */
  const h=document.createElement('h1'); h.className='hero-title';
  h.setAttribute('aria-label',HERO_TITLE);
  HERO_TITLE.split(' ').forEach((word,wi)=>{
    if(wi) h.appendChild(document.createTextNode(' '));
    for(const ch of word){
      const i=document.createElement('i'); i.textContent=ch; h.appendChild(i);
    }
  });
  plate.appendChild(h);

  const lede=document.createElement('p'); lede.className='hero-lede';
  lede.textContent=CONFIG.QUESTIONS_PER_SESSION+' questions about how time feels to you. '
                 + 'What they draw is a poster with no words in it.';
  plate.appendChild(lede);

  /* Nothing is asked here. The screen used to collect a name and a birthdate,
     and the name sized the aperture — give more, open more. Both fields are
     gone by decision: the poster carries no text, neither value drove a single
     mark on it, and a form standing between someone and the first question
     bought nothing. What remains is the one act the screen is actually for. */
  const foot=document.createElement('div'); foot.className='hero-foot';
  const btn=document.createElement('button');
  btn.className='btn'; btn.type='button'; btn.textContent='Begin';
  foot.appendChild(btn);
  /* The way straight through. Set in the .skip voice already defined for the
     card — mono, small, dim, acknowledging the pointer only on hover — because
     it is a bypass and must not compete with Begin for the eye. */
  const jump=document.createElement('button');
  jump.className='skip'; jump.type='button'; jump.textContent='Skip to the poster';
  jump.setAttribute('aria-label','Skip the opening questions and go straight to the poster');
  jump.addEventListener('click',skipOpening);
  foot.appendChild(jump);
  plate.appendChild(foot);

  landingBody.appendChild(plate);

  const field=ensureField();
  field.setChars([...h.querySelectorAll('i')]);   /* only this step has a title to reveal */

  btn.addEventListener('click',advanceLanding);
  /* Focus is NOT taken here: openLanding() renders the step before it adds
     .open, so at this moment the whole screen is still visibility:hidden and
     nothing inside it can take focus. renderLandingStep's deferred focus is
     the mechanism that works, and Begin is in its selector list. */
}

/* The field itself. Paints the lattice over the whole viewport, then clears the
   aperture out of it — the clear is what makes the hole, so no step needs a
   background of its own and none can ever disagree with the field.

   It is built once and runs for the whole landing sequence. frameOf() is asked
   every time for the element the hole should clear, so when a step re-renders
   #landingBody the aperture just resizes around whatever is there now: wide for
   the opening plate, narrow for the 380px question column. That resize IS the
   transition between steps.

   Note what is NOT painted here: the sheet, the dot field, anything of the
   poster. All four steps are spec'd to show none of it, and this holds that
   line while still standing the visitor inside the lattice the finished poster
   will be read against. */
function heroField(cv,frameOf){
  const ctx=cv.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  let chars=[];                             /* only the opening step has a title */
  /* READ FROM THE PALETTE, not hard-coded. These were white because the screen
     was black; now the screen is whatever --ink is, and these follow --sheetline
     and the interface ink with it. That is the rule: one place to change. */
  const cssVar=(k,fb)=>getComputedStyle(document.documentElement)
                        .getPropertyValue(k).trim()||fb;
  const RAY=cssVar('--sheetline','rgba(0,0,0,.34)');
  /* the field stays monochrome on purpose: --done yellow means "this question
     is settled" everywhere else in the piece, and spending it on decoration
     here would blunt it before it has been earned */
  const MARK_LO=cssVar('--line','rgba(0,0,0,.16)');

  /* The squares sit every STEP_CELLS cells, not in every cell. A mark per cell
     made a texture; at this spacing it is a field of countable objects, which
     is what the reference has and what lets a single square carry weight.
     The aperture still measures itself in whole --cell units — the hole belongs
     to the piece's grid, the lattice is just what makes that grid visible. */
  const STEP_CELLS=2;
  const R_STEPS=4.4;      /* how far the light reaches, in lattice steps */
  /* How fast the light falls off. Squared kept the bloom tight, which read
     fine when there was a mark in every cell — on the sparse lattice it left
     nothing lit but the twelve ray ends. Below 2 the neighbours come back. */
  const FALLOFF=1.35;
  const RAY_STEPS=2;      /* where the twelve rays end */
  /* Twelve, at 30°, snapped to the lattice: the ring-2 points a square lattice
     offers are exactly (±2,0) (0,±2) (±2,±1) (±1,±2) — twelve of them, the
     reference's star with nothing forced. It is a clock, and the piece is
     about time. */
  const RAYS=12;

  /* The far field never changes, so it is painted once into an offscreen canvas
     and blitted each frame. Only the ~130 cells inside the light get computed
     per frame, which is what makes a 60fps cursor affordable on a full-viewport
     lattice — repainting every cell every frame would be ~5000 rects a frame to
     redraw a picture that is identical everywhere the cursor is not. */
  const bg=document.createElement('canvas');
  const bx=bg.getContext('2d');

  let W=0,H=0,cell=20,cols=0,rows=0,dpr=1,rect={left:0,top:0};
  let step=40,sox=0,soy=0,scols=0,srows=0;   /* the square lattice */
  let apW=0,apH=0,tgtW=0,tgtH=0;            /* aperture, in whole cells */
  let lit=0,acc=0,last=0,raf=null;
  /* fx,fy is where the light actually is; px,py is where it is being pulled.
     The gap between them is the whole feel of the thing: the field follows the
     hand, it does not teleport with it. */
  let fx=0,fy=0,px=0,py=0,pointer=false;

  function measure(){
    dpr=Math.min(2,window.devicePixelRatio||1);
    W=cv.clientWidth; H=cv.clientHeight;
    if(!W||!H) return;
    cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    rect=cv.getBoundingClientRect();
    cell=parseFloat(getComputedStyle(document.documentElement)
      .getPropertyValue('--cell'))||20;
    /* put a cell boundary through the exact centre of the viewport. That is
       what lets an aperture of N whole cells, centred, land all four edges on
       the piece's grid — the same trick syncSheet() uses to snap the sheet. */
    cols=Math.ceil(W/cell)+2; rows=Math.ceil(H/cell)+2;
    /* the lattice, on its own coarser step, also centred */
    step=cell*STEP_CELLS;
    sox=(W/2)%step; soy=(H/2)%step;
    scols=Math.ceil(W/step)+2; srows=Math.ceil(H/step)+2;
    if(!pointer){ fx=px=W/2; fy=py=H/2; }
    paintBg();
    retarget();
  }

  /* lattice point for an index, and the nearest index to a point */
  const cxOf=c=>sox+c*step+step/2, cyOf=r=>soy+r*step+step/2;
  const cAt=x=>Math.round((x-sox-step/2)/step), rAt=y=>Math.round((y-soy-step/2)/step);

  function paintBg(){
    bg.width=cv.width; bg.height=cv.height;
    bx.setTransform(dpr,0,0,dpr,0,0);
    bx.clearRect(0,0,W,H);

    /* No ruled lines. The lattice is stated by the squares alone — where they
       stop, the aperture begins, and that edge is legible without anything
       being drawn around it. Ruling it as well was belt and braces, and it
       made the field read as graph paper rather than as a field.
       (.gridlayer behind the board still rules its own lines; that is the
       board's language, and #landing covers it completely anyway.)

       At rest the squares are barely there; the light is what gives them
       size. */
    const m=Math.max(2,Math.round(step*.055));
    bx.fillStyle=MARK_LO;
    for(let c=-1;c<scols;c++) for(let r=-1;r<srows;r++){
      bx.fillRect(Math.round(cxOf(c)-m/2),Math.round(cyOf(r)-m/2),m,m);
    }
  }

  function retarget(){
    const el=frameOf();
    if(!el) return;
    const r=el.getBoundingClientRect();
    if(!r.width) return;
    /* the smallest hole that still clears the plate — the floor a clamp may
       never cut into, or the type would end up sitting back on the grid */
    const minW=Math.ceil(r.width/cell)+2, minH=Math.ceil(r.height/cell)+2;
    /* and the largest that still leaves two cells of field on every side, so
       the aperture always reads as cut OUT of something */
    const maxW=Math.max(minW,cols-4), maxH=Math.max(minH,rows-4);
    tgtW=Math.min(maxW,Math.ceil(r.width/cell)+HERO_PAD*2);
    tgtH=Math.min(maxH,Math.ceil(r.height/cell)+HERO_PAD*2);
    if(reduce){ apW=tgtW; apH=tgtH; paint(); }
  }

  function paint(){
    if(!W||!H) return;
    ctx.clearRect(0,0,W,H);
    ctx.drawImage(bg,0,0,W,H);

    const R=R_STEPS*step;
    const base=Math.max(2,Math.round(step*.055));
    const peak=Math.max(4,Math.round(step*.22));
    const span=Math.ceil(R_STEPS)+1;
    const c0=cAt(fx), r0=rAt(fy);

    /* The squares inside the light, sized and brightened by how near they are.
       These are the point of the effect — a neighbourhood waking up, not just
       twelve lit ends. The ray endpoints stay the brightest thing, but they
       should be the peak of a bloom rather than the whole of it. */
    for(let c=c0-span;c<=c0+span;c++){
      for(let r=r0-span;r<=r0+span;r++){
        const x=cxOf(c), y=cyOf(r);
        const d=Math.hypot(x-fx,y-fy);
        if(d>R) continue;
        const t=1-d/R, f=Math.pow(t,FALLOFF);
        const s=Math.max(base,Math.round(base+(peak-base)*f));
        ctx.fillStyle='rgba(20,20,20,'+(0.16+0.72*f).toFixed(3)+')';
        ctx.fillRect(Math.round(x-s/2),Math.round(y-s/2),s,s);
      }
    }

    /* Twelve rays at 30°, each ending on the lattice point nearest that hour.
       Snapping the ends to real cells is what keeps this reading as the grid
       being lit rather than as a graphic laid over it. */
    ctx.strokeStyle=RAY; ctx.lineWidth=1; ctx.beginPath();
    const ends=[];
    for(let k=0;k<RAYS;k++){
      const a=k*(Math.PI*2/RAYS)-Math.PI/2;
      const c=cAt(fx+Math.cos(a)*RAY_STEPS*step), r=rAt(fy+Math.sin(a)*RAY_STEPS*step);
      const x=cxOf(c), y=cyOf(r);
      ends.push([x,y]);
      ctx.moveTo(fx,fy); ctx.lineTo(x,y);
    }
    ctx.stroke();

    /* the hour marks sit on top of their rays, so the line reads as arriving at
       the square rather than crossing it */
    ctx.fillStyle=cssVar('--fg','#141414');
    const hm=Math.max(4,Math.round(step*.17));
    for(const [x,y] of ends) ctx.fillRect(Math.round(x-hm/2),Math.round(y-hm/2),hm,hm);

    /* the centre: the only mark not on the lattice, because it is you */
    const fm=Math.max(6,Math.round(step*.26));
    ctx.fillRect(Math.round(fx-fm/2),Math.round(fy-fm/2),fm,fm);

    /* the hole, cut last so nothing — squares, rays, centre — reaches into it.
       Left edge is a whole number of cells from the centre line, so both edges
       sit on gridlines however odd the cell count is. */
    if(apW>0&&apH>0){
      ctx.clearRect(W/2-Math.floor(apW/2)*cell, H/2-Math.floor(apH/2)*cell,
                    apW*cell, apH*cell);
    }
  }

  function tick(now){
    raf=requestAnimationFrame(tick);
    if(!last) last=now;
    const dt=now-last; last=now;

    /* Before the hand arrives — and on any device that has no hand — the light
       drifts on its own, so the screen is never dead on first sight. */
    if(!pointer){
      px=W/2+W*0.34*Math.sin(now*0.00021);
      py=H/2+H*0.30*Math.sin(now*0.00029+1.1);
    }
    /* frame-rate independent ease-out: same feel at 60 and 120Hz */
    const k=1-Math.pow(0.0016,dt/1000);
    fx+=(px-fx)*k; fy+=(py-fy)*k;

    acc+=dt;
    if(acc>=HERO_BEAT){
      acc=0;
      if(lit<chars.length) chars[lit++].classList.add('lit');
      /* two cells per beat in each axis — a hard step, never a tween */
      if(apW!==tgtW) apW += apW<tgtW ? Math.min(2,tgtW-apW) : -Math.min(2,apW-tgtW);
      if(apH!==tgtH) apH += apH<tgtH ? Math.min(2,tgtH-apH) : -Math.min(2,apH-tgtH);
    }
    paint();
  }

  const onMove=e=>{
    pointer=true;
    px=e.clientX-rect.left; py=e.clientY-rect.top;
    if(reduce){ fx=px; fy=py; paint(); }
  };
  const onLeave=()=>{ pointer=false; };
  const onResize=()=>{ measure(); paint(); };
  window.addEventListener('resize',onResize);
  landing.addEventListener('pointermove',onMove);
  landing.addEventListener('pointerleave',onLeave);
  /* a step's height depends on the display serif, so its box is wrong until the
     webfont lands; retarget once it has */
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ measure(); paint(); });

  measure();
  if(reduce){
    /* no autonomous motion: no drift, no ease, no beat. The light still answers
       the hand, because that is the visitor moving, not the page. */
    apW=tgtW; apH=tgtH; paint();
  } else raf=requestAnimationFrame(tick);

  return {
    retarget,
    /* Handed the current step's title characters, or an empty list when the
       step has none. The beat reveals them; nothing else knows about them. */
    setChars(list){
      chars=list||[]; lit=0;
      if(reduce) chars.forEach(i=>i.classList.add('lit'));
    },
    stop(){
      if(raf) cancelAnimationFrame(raf);
      window.removeEventListener('resize',onResize);
      landing.removeEventListener('pointermove',onMove);
      landing.removeEventListener('pointerleave',onLeave);
    }
  };
}

function renderLandingShape(){
  landingHead('Shape');
  const h=document.createElement('h1'); h.textContent='How do you experience time?';
  landingBody.appendChild(h);
  const el=document.createElement('div'); el.className='duo';
  [['square','It moves on without me'],['circle','It carries me along with it']].forEach(([k,t])=>{
    const b=document.createElement('button');
    b.type='button';
    b.innerHTML='<strong>'+t+'</strong>';
    b.setAttribute('aria-pressed',String(S.baseShape===k));
    b.addEventListener('click',()=>{
      S.baseShape=k;
      [...el.children].forEach(c=>c.setAttribute('aria-pressed',String(c===b)));
    });
    el.appendChild(b);
  });
  landingBody.appendChild(el);
  landingNav();
}

function renderLandingDensity(){
  landingHead('Density');
  const h=document.createElement('h1'); h.textContent='How much time do you feel like you have?';
  landingBody.appendChild(h);
  const el=document.createElement('div'); el.className='tri';
  [['little','Too little'],['enough','Enough'],['plenty','Plenty']].forEach(([k,t])=>{
    const b=document.createElement('button');
    b.type='button'; b.setAttribute('role','radio');
    b.innerHTML='<i></i><b>'+t+'</b>';
    b.setAttribute('aria-pressed',String(S.baseDensity===k));
    b.addEventListener('click',()=>{
      S.baseDensity=k;
      [...el.children].forEach(c=>c.setAttribute('aria-pressed',String(c===b)));
    });
    el.appendChild(b);
  });
  landingBody.appendChild(el);
  landingNav();
}

/* ---- Q3: the arrival dial ----
   A bespoke semicircle drag control. 18:00 sits at the left end, 20:00 at
   the right, 19:00 at the apex — frac 0..1 across that span, read back into
   S.baseFrac on every move. The arc's OWN stroke live-previews
   lineStyleFromFrac() as you drag, using the exact function that will later
   style the real base grid — that is feedback about the CONTROL, not a
   preview of the poster, which per spec must stay hidden through this
   entire sequence. */
const ARC={cx:150,cy:150,r:120};
function arcPoint(frac){
  const a=Math.PI*(1-frac);
  return {x:ARC.cx+ARC.r*Math.cos(a), y:ARC.cy-ARC.r*Math.sin(a)};
}
function arcFracFromClient(svg,clientX,clientY){
  const pt=svg.createSVGPoint(); pt.x=clientX; pt.y=clientY;
  const p=pt.matrixTransform(svg.getScreenCTM().inverse());
  let a=Math.atan2(-(p.y-ARC.cy), p.x-ARC.cx);
  if(a<0) a = (p.x>ARC.cx) ? 0 : Math.PI;
  a=Math.max(0,Math.min(Math.PI,a));
  return 1-a/Math.PI;
}
function fracToClock(frac){
  const total=Math.round(frac*120);              // minutes from 18:00
  let hh=18+Math.floor(total/60), mm=total%60;
  return pad2(hh)+':'+pad2(mm);
}
function renderLandingArrival(){
  landingHead('Arrival');
  const h=document.createElement('h1'); h.textContent='We said 19:00. When will you actually be there?';
  landingBody.appendChild(h);

  const wrap=document.createElement('div'); wrap.className='arcwrap';
  wrap.innerHTML=
    '<svg viewBox="0 0 300 175" id="arcSvg">'
    + '<path id="arcTrack" d="M 30 150 A 120 120 0 0 1 270 150" fill="none" stroke="var(--line)" stroke-width="1"/>'
    + '<line x1="150" y1="150" x2="150" y2="136" stroke="var(--line)" stroke-width="1"/>'
    + '<text x="30" y="168" class="arclabel">18:00</text>'
    + '<text x="150" y="120" class="arclabel" text-anchor="middle">19:00</text>'
    + '<text x="270" y="168" class="arclabel" text-anchor="end">20:00</text>'
    + '<circle id="arcHandle" r="8" tabindex="0" role="slider" aria-label="Arrival time"'
    +   ' aria-valuemin="0" aria-valuemax="120"></circle>'
    + '</svg>'
    + '<p class="arcread" id="arcRead"></p>';
  landingBody.appendChild(wrap);

  const svg=wrap.querySelector('#arcSvg'), track=wrap.querySelector('#arcTrack'),
        handle=wrap.querySelector('#arcHandle'), read=wrap.querySelector('#arcRead');

  const paintArc=()=>{
    const p=arcPoint(S.baseFrac);
    handle.setAttribute('cx',p.x.toFixed(2)); handle.setAttribute('cy',p.y.toFixed(2));
    const style=lineStyleFromFrac(S.baseFrac);
    track.setAttribute('stroke-width',style.strokeWidth.toFixed(2));
    if(style.dasharray) track.setAttribute('stroke-dasharray',style.dasharray);
    else track.removeAttribute('stroke-dasharray');
    const mins=Math.round(S.baseFrac*120);
    handle.setAttribute('aria-valuenow',mins);
    handle.setAttribute('aria-valuetext',fracToClock(S.baseFrac));
    read.textContent = Math.abs(S.baseFrac-0.5)<0.005/1 ? 'On time — '+fracToClock(S.baseFrac)
                      : S.baseFrac<0.5 ? fracToClock(S.baseFrac)+' — early'
                      : fracToClock(S.baseFrac)+' — late';
  };
  paintArc();

  let dragging=false;
  const move=e=>{
    if(!dragging) return;
    S.baseFrac=arcFracFromClient(svg,e.clientX,e.clientY);
    paintArc();
  };
